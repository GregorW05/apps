<style>
/* Layout: eine schmale Lernspalte wie ein Kartenstapel, Navigation unten am Daumen; Akzent in Rettungsdecken-Gold, deine Notizen in Kugelschreiber-Blau */
:root {
  --bg: #eef1ef; --panel: #ffffff; --ink: #15202a; --muted: #56626b; --line: #d6dcd9;
  --accent: #c58f1c; --accent-ink: #1d1503; --accent-soft: #f6ead0;
  --pen: #2b3fa6; --pen-soft: #e9ecfa;
  --again: #b83c28; --hard: #a86a12; --good: #2a7449; --easy: #285f9f;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1317; --panel: #172028; --ink: #e6ebee; --muted: #9aa6ae; --line: #2a3640;
  --accent: #e2b04c; --accent-ink: #1d1503; --accent-soft: #3a2f17;
  --pen: #9aabff; --pen-soft: #1f2645;
  --again: #ef7b66; --hard: #e3a84f; --good: #61c38e; --easy: #74aaea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #172028; --ink: #e6ebee; --muted: #9aa6ae; --line: #2a3640;
  --accent: #e2b04c; --accent-ink: #1d1503; --accent-soft: #3a2f17;
  --pen: #9aabff; --pen-soft: #1f2645;
  --again: #ef7b66; --hard: #e3a84f; --good: #61c38e; --easy: #74aaea; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
header.kopf { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.marke { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: .01em; line-height: 1; text-wrap: balance; }
.marke small { display: block; font-weight: 500; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.zahlen { display: flex; gap: 14px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.zahl { text-align: right; }
.zahl b { display: block; font-size: 28px; line-height: 1; font-weight: 700; }
.zahl span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.zahl.faellig b { color: var(--accent); }
.leiste { display: flex; gap: 8px; flex-wrap: wrap; }
select { font: inherit; font-size: 15px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; flex: 1 1 160px; }
.karte { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 1px 0 var(--line), 0 10px 24px -18px rgba(0,0,0,.35); }
.oben { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.marken { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.p { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.tag.fall { border-color: var(--ink); color: var(--ink); }
.tag.e { border-style: dashed; }
.tag.abc { border-color: var(--accent); color: var(--ink); letter-spacing: .04em; }
.tag.sicher { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.frage { font-size: 22px; line-height: 1.35; font-weight: 700; text-wrap: balance; margin: 0; }
.antwort { margin: 0; padding: 14px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 8px; list-style: none; }
.antwort li { padding-left: 22px; position: relative; }
.antwort li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.notiz { background: var(--pen-soft); color: var(--pen); border-radius: 10px; padding: 8px 12px 10px; font-family: var(--f-hand); font-size: 23px; line-height: 1.2; }
.notiz small { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; margin-bottom: 2px; }
.notiz .offen { font-family: var(--f-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: middle; }
.quelle { font-size: 14px; color: var(--muted); }
.bilder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.bilder figure { margin: 0; display: grid; gap: 4px; color: var(--ink); background: var(--bg); border-radius: 10px; padding: 6px; }
.bilder svg { width: 100%; height: auto; display: block; }
.bilder figcaption { font-size: 12px; line-height: 1.3; color: var(--muted); text-align: center; }
.knopf { justify-self: start; font-weight: 700; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 12px 14px; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.zeigen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; width: 100%; font-size: 18px; }
.bewerten { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bewerten button { display: grid; gap: 2px; padding: 10px 4px; font-weight: 700; font-size: 15px; border-width: 2px; }
.bewerten button span { font-family: var(--f-display); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.b0 { border-color: var(--again); color: var(--again); } .b1 { border-color: var(--hard); color: var(--hard); }
.b2 { border-color: var(--good); color: var(--good); } .b3 { border-color: var(--easy); color: var(--easy); }
.leer { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 28px; }
.leer h2 { font-family: var(--f-display); font-size: 28px; margin: 0; }
.hinweis { font-size: 14px; color: var(--muted); }
details.thema { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
details.thema > summary { list-style: none; padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; cursor: pointer; }
details.thema > summary::-webkit-details-marker { display: none; }
.thema h3 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 600; text-wrap: balance; }
.thema .seiten { font-family: var(--f-display); font-size: 14px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
.inhalt { padding: 0 16px 16px; display: grid; gap: 12px; }
.kern { margin: 0; font-size: 17px; }
.punkte { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.punkte li.stern::marker { content: "★ "; color: var(--accent); }
.merke { border-left: 4px solid var(--accent); padding: 6px 12px; font-weight: 700; }
.erg { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; display: grid; gap: 6px; }
.erg strong { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.erg p { margin: 0; }
.zeile { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.zeile:last-child { border-bottom: 0; }
.zeile .name { font-weight: 700; min-width: 0; }
.zeile .werte { font-family: var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.balken { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
.balken i { display: block; height: 100%; }
.balken .sicher { background: var(--good); } .balken .lernt { background: var(--accent); }
.legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
h2.abschnitt { font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }
.schwach { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.schwach:last-child { border-bottom: 0; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
nav.tabs div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: none; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 14px 4px; border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.status { font-size: 13px; color: var(--muted); }
.bereiche { display: flex; gap: 6px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.bereiche button { flex: 1 1 0; min-width: 0; border: 0; border-radius: 9px; padding: 9px 8px; background: none; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .03em; color: var(--muted); }
.bereiche button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (prefers-reduced-motion: no-preference) { .karte { animation: rein .18s ease-out; } @keyframes rein { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }
@media (max-width: 380px) { .frage { font-size: 20px; } .bewerten button { font-size: 14px; } }
</style>

<script id="daten" type="application/json">{"kurse":[{"kurs":"Rettungssanitäter:in","quelle":"ÖRK Lehrbuch Band 1 (Stand Jänner 2024) mit deinen Notizen, deiner Sprachnachricht vom 05.11.2026, der Wiederholung vom 11.11.2026 und den Mitschriften zweier Kurskollegen","stand":"12.11.2026","themen":[{"id":"ork","titel":"Rotes Kreuz und Rettungswesen","seiten":"S. 12 bis 15","kern":"Im Unterricht nur kurz betont: Geschichte, die sieben Grundsätze, die acht Pflichten und wer fürs Rettungswesen sorgt.","punkte":["Henry Dunant, Schweizer Geschäftsmann, legte in den 1860er-Jahren den Grundstein. Das ÖRK gibt es seit 1880.","Heute weltweit 192 Rotkreuz- und Rothalbmondgesellschaften, koordiniert aus Genf.","★ 7 Grundsätze: Menschlichkeit, Unparteilichkeit, Neutralität, Unabhängigkeit, Freiwilligkeit, Einheit, Universalität.","★ 8 Pflichten: Sorgfalt, Dokumentation, Anzeige, Verschwiegenheit, Mitteilung, Auskunft, Hilfeleistung, Fortbildung.","Rettungswesen: Die Gemeinden müssen dafür sorgen und übertragen es meist dem Roten Kreuz."],"merke":"Grundsätze, Eselsbrücke: „Manche Unfälle nehmen uns fast echt unvorbereitet“ (M U N U F E U).","notizen":[]},{"id":"abc","titel":"SSS, EE und ABCDE","seiten":"S. 16, S. 79 bis 88 (10 für 10), S. 104 bis 116, Mitschriften","kern":"Als Sanitäter:in schätzt du beim ersten Kontakt ein, ob es lebensbedrohlich ist, und gehst immer strukturiert vor. Manuelle Beurteilung heißt ohne Geräte (Band S. 104), apparative Beurteilung mit Geräten (S. 117 bis 128).","punkte":["★ Einsatzplan: Selbstschutz vor Fremdschutz. Beim Eintreffen nach Gefahren scannen und abschirmen (GAMS), dann zur Person, Bewusstsein ja oder nein?","★ SSS: Szene, Sicherheit, Situation. Szene ist das Umfeld, der größere Kontext (Wetter, Ortschaft, Straßen). Sicherheit für dich, Team und Patient:in. Situation ist, was passiert ist.","★ GAMS ist Teil von SSS (Gefahr erkennen, Absichern und Abstand bzw. Abschirmen mit den 3 W, Menschenleben retten, Spezialkräfte nachfordern).","★ EE: Erster Eindruck. Bewusstsein nach AVPU, bei Verdacht auf Wirbelsäulenverletzung MILS, starke Blutung sofort stillen (Druckverband an den Extremitäten).","★ Halskrause (HWS-Schiene, HWS heißt Halswirbelsäule) nicht anlegen, wenn die Person ohnmächtig ist.","★ AVPU (kommt zur Prüfung): A Alert, wach. V Voice, reagiert auf Ansprache. P Pain, reagiert nur auf Schmerzreiz. U Unresponsive, keine Reaktion, bewusstlos.","★ A Airway: in den Mund schauen, besonders bei Geräuschen, beim Notfallcheck, bei Verlegung und Bewusstlosen. Atemwege freimachen UND freihalten. Maßnahmen: Heimlich, Schläge zwischen die Schulterblätter, stabile Seitenlage, Kopf überstrecken, Helmabnahme bei Verkehrsunfall.","★ Kopf überstrecken: je kleiner die Person, desto weniger. Beim Säugling gar nicht, sondern Schnüffelposition (neutrale Kopfposition), um die Atemwege zu prüfen. Überstreckt man den Kopf beim Säugling, kann etwas kaputt gehen.","★ Absauger: immer Stufe -0,8, außer bei Säuglingen höchstens -0,2.","★ B Breathing: Atemfrequenz am Brustkorb zählen (nur Ein- oder nur Ausatmung, heben sich beide Seiten, tief oder flach?), Erwachsene 12 bis 16 pro Minute, Normwerte Band S. 106. Zu schnell (Hyperventilation, Atemnot) deutet auf Krankheit oder Vergiftung. Dazu Sauerstoffsättigung, Zyanose, fragen, ob die Person genug Luft bekommt, krankhafte Atemgeräusche. Maßnahmen: Beatmung oder Wiederbelebung, wenn keine Atmung, Kopf überstrecken, stabile Seitenlage, wenn Atmung, Oberkörper hoch, frische Luft, enge Kleidung öffnen.","★ B Maßnahmen: frische Luft, beengende Kleidung öffnen. Entscheiden, ob die Person selbst atmen kann. Atmet sie nicht mehr selbst: Beutel-Masken-Beatmung oder Tubus. Atmet sie nur sporadisch oder schwer oder ist der Sauerstoffwert (SpO2) zu niedrig, unter 90 %: Sauerstoff mit Maske oder Nasenbrille, höchstens 15 l pro Minute. Ist ein Sauerstoffwert von 94 % erreicht, auf 6 bis 8 l pro Minute reduzieren. Bei COPD (chronische Lungenerkrankung) ist der Zielwert 90 %, weil ohnehin keine ordentliche Sättigung mehr möglich ist. Bei Zyanose sofort Sauerstoff, auch ohne vorher zu messen.","★ C Circulation: Puls (Handgelenk, Oberarm, Leiste, Halsschlagader, Fußrücken, Sprunggelenk; schnell oder langsam, regelmäßig, stark oder schwach, Erwachsene 60 bis 80), Blutdruck auf zwei Arten (kommt zur Prüfung), bei Verdacht auf Trauma die Blutungsräume, EKG, Haut (grau, blau, rot, Ausschlag, schweißig, stehende Hautfalten bei Dehydration), Rekapillarisierungszeit (Fingernagel drücken, nach dem Loslassen in höchstens 2 Sekunden wieder durchblutet). An der Hand auf einen Blick Puls, Rekap und Hautfalten. Maßnahmen: Beine hoch, Wärmeerhalt, Wiederbelebung, bei Diabetes Über- oder Unterzucker prüfen.","Schockbar sind Kammerflimmern und ventrikuläre Tachykardie, die Asystolie nicht.","★ Blutungsräume: Brustkorb (Thorax), Bauchraum (Abdomen, wird bei Blutung steinhart), Becken und Leiste (nicht anfassen, nur schauen, Hämatome sichtbar), Oberschenkel.","★ D Disability (Neurologie): Blutzucker messen, Pflicht bei Diabetiker:innen, Bewusstlosen und D-Symptomen (Schwindel, Zittern, kalter Schweiß, Schläfrigkeit, Unruhe, Verwirrtheit, Sehstörungen). Dazu ZOPS, FAST (beide Band S. 112), Motorik und Sensibilität (mit Rekap DMS), Schmerzskala NRS 0 bis 10 (Schmerz zeigt sich auch an erhöhter Herzfrequenz und erhöhtem Blutdruck), Pupillen (Brille runter, gleich groß, Lichtreflex, entrundet?).","★ ZOPS: Zeit (Welcher Tag, wie spät?), Ort (Wo sind wir?), Person (Wie heißen Sie?), Situation (Was ist passiert?).","★ FAST (Schlaganfall-Test): Face (lächeln, hängt eine Gesichtshälfte?), Arms (beide Arme heben, auch Beine), Speech (Satz sprechen, z. B. „Die Mutter bringt dem Kind ein Glas Wasser zum Trinken“), Time (seit wann? schnell handeln).","★ E Exposure (erweiterte Untersuchung): ins Ohr leuchten, vor allem bei Trauma (Blut oder Gehirnflüssigkeit deutet auf eine Kopfverletzung), Stufenbildung am Kopf (andere Kopfform, schlechtes Outcome, hohe Letalität), SAMPLER und Anamnese durch Fragen, Werte nachmessen, die noch fehlen, Ganzkörperuntersuchung nur bei Trauma oder spezifischen Hinweisen (nicht standardmäßig), Temperatur, 10 für 10 bei Stress.","★ SAMPLER (Anamnese): Symptome, Allergien, Medikamente, Patientengeschichte (schon mal solche Probleme?), Letzte (Nahrungsaufnahme, Stuhlgang, Medikamenteneinnahme), Ereignis (was hat es ausgelöst?), Risikofaktoren (familiäre Veranlagung, Schwangerschaft, Drogen).","Basismaßnahmen: Luft, Wärme, Lagerung (Beine anwinkeln, Beine hoch, Seitenlage, aufrecht sitzend), psychologische Betreuung.","★ Notarztindikationen: Rauchgasentwicklung, Bewusstlosigkeit, Lähmungen. Kritisch krank oder verletzt: Notarzt nachfordern, notfalls schneller Transport ins Krankenhaus.","★ Notarzt per Funk nachfordern: „Leitstelle von 20 202, kommen!“ 20 ist der Bezirk Stadt Salzburg, 202 die Nummer des Autos. Davor stünde die 5 fürs Bundesland Salzburg, die sagt man meist nicht."],"merke":"„Treat first what kills first.“ ABCDE kommt sicher zur Prüfung, zu jedem Buchstaben sagen können, was du dir ansiehst. Besonders wichtig laut Unterricht: 10 für 10, AVPU, ZOPS, FAST, Blutungsräume, SAMPLER.","notizen":[{"text":"Notfallcheck und ABCDE sind sich ähnlich. Der Notfallcheck ist die Sicht der Ersthelfer, ABCDE die Sicht der Rettungssanitäter.","ort":"S. 22 und Unterricht"},{"text":"AVPU kommt zur Prüfung. Szene ist Umfeld und größerer Kontext (Wetter, Ortschaft, Straßen), Situation ist, was passiert ist. GAMS ist Teil von SSS. Bei A die Atemwege freimachen UND freihalten. Je kleiner die Patienten, desto weniger Kopf überstrecken, bei Säuglingen gar nicht mehr.","ort":"Wiederholung 11.11."},{"text":"Ausführliches ABCDE aus der Mitschrift eines Kurskollegen vom 10.11. AVPU steht dort beim Ersten Eindruck. Pulsnorm laut Mitschrift 60 bis 80.","ort":"Mitschrift 10.11."},{"text":"ABCDE kommt zu 100 % zur Prüfung. Zu jedem Buchstaben, was man sich ansieht, aus der Wiederholung im Unterricht. Die zwei Arten der Blutdruckmessung kommen zur Prüfung. Pupillen nur ohne Brille prüfen.","ort":"Wiederholung 11.11."},{"text":"Die zweite Mitschrift trennt manuelle Beurteilung (ohne Geräte, S. 104) und apparative Beurteilung (S. 117 bis 128). Normwerte Atmung S. 106, ZOPS und FAST S. 112 sind blau, also prüfungsrelevant.","ort":"Mitschrift 2"},{"text":"Halskrause (HWS-Schiene) nicht anlegen, wenn die Person ohnmächtig ist.","ort":"Wiederholung 11.11."},{"text":"Absauger immer Stufe -0,8, außer bei Säuglingen max. -0,2.","ort":"Wiederholung 11.11."},{"text":"Schnüffelposition beim Säugling ist die neutrale Kopfposition, um die Atemwege zu checken. Wird der Kopf dort überstreckt, kann etwas kaputt gehen.","ort":"Wiederholung 11.11."},{"text":"Den Wendl-Tubus müsst ihr nicht können.","ort":"Wiederholung 11.11."},{"text":"Zu lernen aus der Mappe: S. 71 bis 78, S. 79 bis 88 (10 für 10 besonders wichtig), S. 104 bis 116 (AVPU, ZOPS, FAST, Blutungsräume sehr wichtig, SAMPLER wichtig), S. 117 bis 128, S. 128 bis 134.","ort":"Wiederholung 11.11."},{"text":"ABC kommt 100 % zur Prüfung, ebenso GAMS, Notfallcheck, Herzinfarkt mit Erster Hilfe und die Telefonnummern.","ort":"Wiederholung 11.11."},{"text":"B-Maßnahmen: frische Luft, beengte Kleidung aufmachen, entscheiden, ob selber atmen kann. Masken-Beutel-Beatmung oder Tubus, wenn die Person nicht mehr selber atmet. Wenn nur sporadisch oder schwer atmet oder Blutsauerstoff zu niedrig (unter 90): Sauerstoff mit Maske oder Nasenbrille. Bei Zyanose direkt Sauerstoff, auch ohne Prüfung (sieht man auch, atmet schnell und ist blau). Max. 15 l pro Minute.","ort":"Unterricht 12.11."},{"text":"Wenn 94 % Sättigung erreicht, reduzieren auf 6 bis 8 l pro Minute.","ort":"Unterricht 12.11."},{"text":"COPD, chronische Krankheit, beeinträchtigt die Lunge. Zielwert dann bei 90 %, weil ohnehin keine ordentliche Sättigung mehr möglich.","ort":"Unterricht 12.11."}]},{"id":"not","titel":"GAMS und Absichern","seiten":"S. 17","kern":"Erst die eigene Sicherheit: GAMS bei Gefahr, beim Autounfall die 3 W. Kenn dein Material. Die Nummern stehen im Kapitel Telefonnummern.","punkte":["GAMS bei Gefahr: Gefahr erkennen, Absperren und Abstand halten, Menschenrettung (nur ohne Eigengefährdung), Spezialkräfte nachfordern.","Die 3 W beim Autounfall: Warnblinker, Warnweste, Warndreieck."],"merke":"Kenn dein Material. GAMS kommt sicher zur Prüfung.","ergaenzung":["GAMS nachgeschlagen (Feuerwehr- und Rettungsdienstlehre): G Gefahr erkennen (beobachten, Warntafeln, im Zweifel die größte Gefahr annehmen). A Absperren, Abstand halten, selbst nicht in den Gefahrenbereich. M Menschen retten nur, wenn es ohne Eigengefährdung geht, sonst Leute aus dem Bereich rufen. S Spezialkräfte nachfordern, z. B. Feuerwehr mit den Nummern der Warntafel.","Übliche Reihenfolge beim Absichern: Warnblinker an, Warnweste noch im Auto anziehen, dann das Warndreieck aufstellen. Die Abstände stehen im Lehrbuch auf S. 34, die ergänze ich mit dem nächsten Scan."],"notizen":[{"text":"Kenn dein Material, z. B. findet man die Rettungstasche in einem neuen Auto in der Stresssituation nicht.","ort":"S. 17"},{"text":"GAMS: Gefahr, Absichern / Abstand, Menschenleben retten, Spezialkräfte.","ort":"S. 17"},{"text":"3 W: Warnweste, Warnblinker, Warndreieck. Wichtig, wo man sie aufstellt.","ort":"S. 17 und Unterricht"},{"text":"In der zweiten Mitschrift steht beim A von GAMS „Abschirmen, Absichern“. Es bleibt ein Buchstabe.","ort":"Mitschrift 2"},{"text":"GAMS und Telefonnummern kommen 100 % zur Prüfung.","ort":"Wiederholung 11.11."}]},{"id":"tel","titel":"Telefonnummern","seiten":"S. 17","kern":"Alle Nummern kommen 100 % zur Prüfung, in beide Richtungen. Eine Nummer reicht, die Leitstelle alarmiert alle nötigen Kräfte. Erst die Leitstelle beendet das Gespräch.","punkte":["★ 122 Feuerwehr, 133 Polizei, 144 Rettung, 112 Euro-Notruf (in Österreich zur Polizei, geht ohne SIM und Guthaben).","★ 1450 Gesundheitsberatung (kein Notfall, 0 bis 24 Uhr).","★ 140 Bergrettung, 141 Ärztenotdienst, 142 Telefonseelsorge, 147 Rat auf Draht, 116 123 Ö3 Kummernummer.","★ Vergiftungsinformationszentrale +43 1 406 43 43 (kommt sicher).","Beim Notruf: Fragen beantworten, Freisprechen, die Hilfe ist schon während des Gesprächs alarmiert. 144 sagt dir auch, wo der nächste Defi ist."],"merke":"Die Telefonnummern kommen sicher zur Prüfung, in beide Richtungen.","notizen":[{"text":"Vergiftungsinformationszentrale kommt 100 % zur Prüfung.","ort":"S. 17"},{"text":"Telefonnummern kommen 100 % zur Prüfung.","ort":"Wiederholung 11.11."}]},{"id":"bas","titel":"Basismaßnahmen und Lagerungen","seiten":"S. 18 bis 19","kern":"Vier Basismaßnahmen kommen sicher zum Test: Lagerung, frische Luft, Wärme, psychische Betreuung. Du empfiehlst sie, du zwingst nichts auf, und sie dürfen nie Lebensrettendes verzögern.","punkte":["★ Lagerung: so, wie es angenehm ist und weniger weh tut.","★ Frische Luft: Fenster auf, enge Kleidung lockern, ruhig atmen lassen.","★ Wärme: zudecken und die Decke auch unter die Person stopfen. Bei Verdacht auf Becken oder Wirbelsäule nicht umlagern.","★ Psychische Betreuung, Look, Listen, Link: hinschauen, zuhören, Hilfe und Angehörige holen.","★ Lagerungen aus dem Unterricht: Beine zum Bauch anziehen (Bauchschmerzen), Seitenlage (wach, aber übel oder schläfrig), vornübergebeugt (Atemnot, Asthma), Rückenlage mit angewinkelten Beinen in L-Form (Kreislaufprobleme)."],"merke":"Seitenlage ist nicht die stabile Seitenlage: Seitenlage für Wache, stabile Seitenlage für Bewusstlose, die normal atmen.","notizen":[{"text":"Wann welche Lage ist prüfungswichtig. Beine anziehen: Bauchschmerzen, entlastet die Bauchdecke. Seitenlage: bei Bewusstsein, aber übel oder schläfrig, damit bei Erbrechen die Atemwege frei bleiben. Vornübergebeugt: Atemnot, Asthma. Beine angewinkelt (L-Form, am Rücken am Boden): Kreislaufprobleme.","ort":"S. 19 und Unterricht"},{"text":"Transmissionswärme: Man verliert auch über den Boden Wärme, deshalb die Decke unter die Person stopfen, nicht nur drüberlegen.","ort":"S. 19 und Unterricht"}]},{"id":"weg","titel":"Wegziehen und Umdrehen","seiten":"S. 20 bis 21","kern":"Arme am Boden nach oben führen, hinter dem Kopf überkreuzen und an den Handgelenken wegziehen. Aus der Bauchlage gleich. Nur, wenn du dich dabei nicht selbst gefährdest.","punkte":["Vorher absichern, wenn möglich.","Arme beim Hochführen am Boden lassen. Der Kopf liegt im besten Fall zwischen den Armen, damit er nicht wegkippt.","Umdrehen aus der Bauchlage: Arm beim Kopf ausstrecken, an Becken und Schulter fassen, zu dir drehen, nicht übers Gesicht.","Danach Atmung prüfen."],"merke":"Arme hoch, kreuzen, Handgelenke, ziehen.","bilder":[{"src":"wegziehen-1","text":"Arme am Boden nach oben führen"},{"src":"wegziehen-2","text":"Unter dem Kopf überkreuzen"},{"src":"wegziehen-3","text":"An den Handgelenken wegziehen"}],"notizen":[]},{"id":"reg","titel":"Notfallcheck","seiten":"S. 22 bis 23","kern":"Kommt 100 % zur praktischen Prüfung. Ablauf wie im Unterricht, laut ansagen, was du tust. Die entscheidende Frage: Atmet die Person normal?","punkte":["★ 1 Umgebung sichern, laut sagen: „Umgebung sicher.“","★ 2 Zur Person, an den Schultern rütteln: „Hallo, hallo, können Sie mich hören?“","★ 3 Keine Reaktion: laut um Hilfe rufen.","★ 4 Aufgaben verteilen: „Du rufst die Rettung.“ „Du holst den Defi.“ „Du holst den Verbandskasten.“","★ 5 Atemwege prüfen, nötigenfalls freimachen, Kopf überstrecken.","★ 6 Atemkontrolle höchstens 10 Sekunden: Ohr zu Mund und Nase, Blick auf den Brustkorb.","★ 7 Atmet normal: stabile Seitenlage. Atmet nicht normal: Herzdruckmassage.","Schnappatmung oder vereinzelte Atemzüge sind keine normale Atmung."],"merke":"Unsicher? Keine Atmung. Lieber drücken. Der Notfallcheck kommt sicher zur Prüfung.","notizen":[{"text":"Wenn unsicher, dann KEINE ATMUNG. Wacht die Person beim Drücken auf, merkt man es. Andersrum stirbt sie in der stabilen Seitenlage.","ort":"S. 22 und Unterricht"},{"text":"Eine bewusstlose Person ist immer kritisch, akute Lebensgefahr. Als Sanitäter immer den Notarzt nachfordern.","ort":"S. 22 und Unterricht"},{"text":"Notfallcheck (NFC) kommt 100 % zur Prüfung.","ort":"Wiederholung 11.11."}]},{"id":"ssl","titel":"Stabile Seitenlage","seiten":"S. 24 bis 25","kern":"Für Bewusstlose, die normal atmen, weil Zunge, Erbrochenes oder Blut sonst die Atemwege verlegen. Muss für die Prüfung sitzen, dabei erzählen, was du machst.","punkte":["★ 1 Notfallcheck: Person atmet. Neben sie knien.","★ 2 Näheren Arm im rechten Winkel zur Person ablegen.","★ 3 Ferne Hand aufs ferne Knie legen und das Knie gleichzeitig hochziehen, so weit wie möglich.","★ 4 Am Knie zu dir ziehen.","★ 5 Kopf kurz anheben, die Hand, die am Knie lag, unter den Kopf legen.","★ 6 Kopf überstrecken, Mund öffnen (Mund ist der tiefste Punkt).","★ 7 Atmung laufend kontrollieren (jede Minute), Wärme, Basismaßnahmen.","Allein ohne Hilfe: Notruf spätestens nach der Seitenlage.","★ Säugling: statt stabiler Seitenlage auf den Unterarm legen. Kopf neutral (Schnüffelposition), nicht überstrecken, Atmung laufend kontrollieren."],"merke":"Knie ganz hoch, sonst wird eine Bauchlage daraus.","notizen":[{"text":"Stabile Seitenlage muss für die Prüfung sitzen. Erzählen, was man gerade macht.","ort":"S. 23"},{"text":"Auch in der stabilen Seitenlage immer die Atmung kontrollieren, nicht dass die Person aufhört zu atmen.","ort":"Unterricht"},{"text":"Säuglinge auf den Unterarm legen statt stabiler Seitenlage.","ort":"Wiederholung 11.11."}]},{"id":"wie","titel":"Wiederbelebung","seiten":"S. 26 bis 27","kern":"Keine Reaktion und keine normale Atmung heißt Atem-Kreislauf-Stillstand. Dann sofort 30 Mal drücken, 2 Mal beatmen, bis die Person normal atmet oder der Rettungsdienst übernimmt. Vor allem Praxis.","punkte":["Harter Untergrund, Handballen auf die Brustmitte, Arme durchgestreckt.","Schnell und kräftig, nach jedem Druck ganz entlasten (Leitlinie: 5 bis 6 cm, 100 bis 120 pro Minute).","Beatmung nur, wenn du sie kannst, sonst ohne Pause durchdrücken. Beatmungstuch.","Trainierte Helfer wechseln alle 2 Minuten. Rippenbrüche heilen, Nichtstun ist tödlich."],"merke":"30 : 2, hart, schnell, entlasten, nicht aufhören.","notizen":[]},{"id":"def","titel":"Defibrillator (AED)","seiten":"S. 28 bis 29","kern":"Der Defi unterbricht mit einem Stromstoß das Kammerflimmern, er ersetzt das Drücken nicht. Einschalten, Anweisungen folgen, nur in Analyse und Schock die Hände weg.","punkte":["Einer drückt weiter, der andere schaltet ein und klebt die Elektroden auf die nackte, trockene Brust.","★ Analysephase und Schock: nicht drücken, niemand berührt die Person.","★ Kammerflimmern: Der Defi gibt immer einen Schock (so ist die Prüfungssituation).","★ Asystolie, gar kein Herzschlag: kein Schock, nur Drücken hilft.","Elektroden normal: rechts unter dem Schlüsselbein und links seitlich unter der Achsel. Kleine Kinder: vorne und hinten.","Nässe abtrocknen, starke Behaarung notfalls rasieren, Drücken hat Vorrang."],"merke":"Einschalten und tun, was er sagt.","ergaenzung":["Nachgeschaut: Schockbar sind Kammerflimmern und pulslose ventrikuläre Tachykardie. Nicht schockbar sind Asystolie (Nulllinie, keine elektrische Aktivität) und pulslose elektrische Aktivität. Bei Kindern, wenn vorhanden, Kinder-Elektroden; ist das Kind zu klein für zwei Elektroden vorne, eine vorne in die Brustmitte und eine hinten zwischen die Schulterblätter."],"notizen":[{"text":"Bei der Analysephase nicht drücken.","ort":"S. 29"},{"text":"Bei Herzkammerflimmern gibt der Defi immer Schock ab, das wird die Situation in der Prüfung sein.","ort":"S. 29 und Unterricht"},{"text":"Wenn gar kein Herzschlag, dann hilft kein Defi (Asystolie).","ort":"S. 29"},{"text":"Bei kleinen Kindern Elektroden vorne und hinten, nicht wie sonst seitlich und oben.","ort":"S. 29 und Unterricht"}]},{"id":"ver","titel":"Verschlucken","seiten":"S. 30 bis 31","kern":"Hustet die Person kräftig: leichte Verlegung, weiter husten lassen. Kann sie nicht atmen, sprechen oder husten: schwere Verlegung, 5 Rückenschläge und 5 Heimlich im Wechsel.","punkte":["Rückenschläge: vorbeugen, am Brustkorb stützen, bis 5 Mal mit der flachen Hand zwischen die Schulterblätter.","Heimlich: hinter die Person, Faust zwischen Nabel und Brustkorb, bis 5 Mal kräftig nach innen oben.","Heimlich heißt auch Oberbauchkompression.","Danach immer ins Krankenhaus. Bewusstlos: Wiederbelebung.","Säugling (unter 1 Jahr): kein Heimlich. Bäuchlings auf den Unterarm, Kopf tief, bis 5 Schläge zwischen die Schulterblätter, dann umdrehen und bis 5 Brustkorbkompressionen mit zwei Fingern, im Wechsel (nachgeschlagen)."],"merke":"5 Schläge, 5 Heimlich, im Wechsel.","notizen":[{"text":"Oberbauchkompression ist das Heimlich-Manöver.","ort":"Wiederholung 11.11."}]},{"id":"blu","titel":"Starke Blutung","seiten":"S. 32","kern":"Spritzt Blut oder läuft es im Schwall, behandelst du es als starke Blutung. Handschuhe an, dann Druck: mit der Hand oder mit Druckverband.","punkte":["Manueller Druck: geht überall. Am Anfang die Person selbst drücken lassen.","Druckverband: nur an Armen und Beinen, du hast die Hände frei.","★ Druckkörper: größer als die Wunde, saugfähig, passt sich der Körperform an.","Blutet es durch: zusätzlich mit der Hand auf den Verband drücken.","Abbindung heißt auch Tourniquet.","★ Tourniquet nicht über Gelenke, ungefähr eine Handfläche vom Blutungsort entfernt, auf der körpernahen Seite der Wunde.","★ Distal: weg vom Körperstamm. Proximal: nah zum Körper. Das Tourniquet kommt proximal, also körpernah von der Wunde."],"merke":"Druck stillt jede sichtbare Blutung.","notizen":[{"text":"Druckkörper und seine Eigenschaften kommen zur Prüfung (Kreuz am Rand).","ort":"S. 32"},{"text":"Abbindung ist dasselbe wie Tourniquet.","ort":"Wiederholung 11.11."},{"text":"Tourniquet nicht über Gelenke und ca. eine Handfläche vom Blutungsort weg.","ort":"Wiederholung 11.11."},{"text":"Distal, weg vom Körperstamm. Proximal, nah zum Körper.","ort":"Wiederholung 11.11."}]},{"id":"nw","titel":"Normal- und Warnwerte","seiten":"Atmung S. 106, Mitschriften","kern":"Alle Zahlen aus der Mitschrift auf einen Blick. Sie werden in beide Richtungen abgefragt.","punkte":["★ Atemfrequenz Erwachsene 12 bis 16 pro Minute.","★ Puls Erwachsene 60 bis 80 pro Minute.","★ Blutdruck kritisch unter 90 und über 200 mmHg.","★ Blutzucker normal 60 bis 100 mg/dl, Warnsignal unter 40 oder über 300 mg/dl.","★ Sauerstoffsättigung (SpO2) Warnwert unter 90 %.","★ Temperatur Warnzeichen über 39 Grad.","★ Rekapillarisierungszeit höchstens 2 Sekunden.","★ Schmerz (NRS 1 bis 10) ab 7 bis 8 stark, eventuell Notarzt für Schmerzmittel."],"merke":"12 bis 16 atmen, 60 bis 80 schlagen, unter 90 ist bei Blutdruck und SpO2 schlecht.","notizen":[{"text":"Normale Temperatur steht in der Mitschrift als „36-36 Grad“, vermutlich Tippfehler, bitte nachfragen.","ort":"Mitschrift 10.11."}]},{"id":"rr","titel":"Blutdruck messen (RR)","seiten":"S. 117 bis 128, Mitschriften","kern":"Blutdruck ist der Druck des Blutes in den Gefäßen, gemessen an der Arterie. RR steht für Riva-Rocci. Schnell und bei Lärm palpatorisch (durch Tasten des Pulses), sonst auskultatorisch (durch Abhören mit dem Stethoskop). Gehört im ABCDE zu C.","punkte":["★ Palpatorisch (bei Lärm oder wenn es schnell gehen muss): aufpumpen, bis kein Puls mehr, Luft ablassen, bis der Puls wieder da ist. Gibt nur den systolischen Wert.","★ Auskultatorisch (genauer, wenn die Umstände es zulassen): aufpumpen, bis kein Puls mehr, Stethoskop in die Ellenbeuge, Luft ablassen bis zum ersten Geräusch (systolisch, oberer Wert), weiter ablassen, bis kein Geräusch mehr (diastolisch, unterer Wert).","Die Geräusche sind Flussgeräusche des Blutes. Die Manschette schneidet den Fluss ab, beim Ablassen fließt das Blut wieder.","★ Kritisch unter 90 und über 200 mmHg (Millimeter Quecksilbersäule).","Manschette so anlegen, dass das Kabel hinten ist. Schlauch gut anschließen, Ablassschraube beim Pumpen zu, Stethoskop je nach Lochposition drehen."],"merke":"Erstes Geräusch oben (systolisch), letztes Geräusch unten (diastolisch).","notizen":[{"text":"Die zwei Arten der Blutdruckmessung kommen zur Prüfung.","ort":"Wiederholung 11.11."}]},{"id":"bz","titel":"Blutzucker messen","seiten":"S. 117 bis 128, Mitschriften","kern":"Insulin steuert den Blutzucker, bei Diabetes ist die Insulinproduktion gestört. Überzucker (Hyperglykämie) entsteht über Stunden bis Tage und ist nicht akut gefährlich, Unterzucker (Hypoglykämie) kommt plötzlich und ist akut gefährlich.","punkte":["★ Im ABCDE bei D messen, Pflicht bei Diabetiker:innen, Bewusstlosen und D-Symptomen (Schwindel, Zittern, kalter Schweiß, Schläfrigkeit, Unruhe, Verwirrtheit, Sehstörungen). Verdacht kann schon bei C entstehen (Herzrasen, Zittern), sonst bei E im Rahmen von SAMPLER.","Ursachen Überzucker: Therapie- oder Medikationsfehler, Krankheiten und Infektionen, Stress und Hormone, Ernährung.","Ursachen Unterzucker: Therapiefehler bei Diabetes (zu viel Insulin, orale Antidiabetika), körperliche Aktivität, Alkohol, Ernährung und Verdauung.","★ Überzucker: starker Durst, trockener Mund, häufiger Harndrang, Müdigkeit, Übelkeit, Bauchschmerzen, Erbrechen, Atem riecht nach Aceton (fauler Apfel), Schwindel, trockene warme Haut.","★ Unterzucker: Zittern, kalter Schweiß, Blässe, Heißhunger, Herzrasen, Unruhe, Schwindel, Verwirrtheit, Sprach- oder Sehstörung, feuchte kalte Haut. Schwer: Kreislaufkollaps, Hirnschäden.","★ Maßnahmen Überzucker: Wasser trinken lassen (nur bei vollem Bewusstsein), kein Insulin geben (keine Befugnis), schnell ins Krankenhaus.","★ Maßnahmen Unterzucker: Zuckerhaltiges geben, z. B. Traubenzucker oder süße Getränke (je nach Zustand).","★ Notarzt bei beiden: fehlende Schutzreflexe, Kreislauf instabil, Krampfanfälle.","Messen ist invasiv, bei wachen Patient:innen Zustimmung holen. Blutzuckertasche im Auto: Gerät, Teststreifen, Nadel und Stechhilfe, Pflaster, Abwischtuch.","★ Ablauf: eigene Hände desinfizieren, nicht dominante Hand, nicht Daumen oder Zeigefinger, Finger reinigen und mindestens 30 Sekunden trocknen lassen, Gerät vorbereiten (Streifen nicht ganz rein), Nadelstufe wählen, lila Schutz abdrehen, Stich mit dem Knopf oben auslösen, ersten Tropfen abwischen, Streifen ganz ins Gerät, Blut mit der Oberkante aufsaugen, Wert ablesen, alles mit Blut entsorgen, Pflaster.","★ Normal 60 bis 100 mg/dl (kurz nach viel Zucker auch höher), Warnsignal unter 40 oder über 300 mg/dl."],"merke":"Kalt und feucht, Zucker ins Maul. Trocken und warm, Zucker zu viel.","notizen":[{"text":"Finger: z. B. Mittelfinger, laut Vortragendem eher der kleine Finger.","ort":"Mitschrift 10.11."},{"text":"Die Unterschiede bei der Haut wurden in der Präsentation weggelassen, gelten aber trotzdem.","ort":"Mitschrift 10.11."}]},{"id":"spo","titel":"Pulsoxymeter (SpO2)","seiten":"S. 117 bis 128, Mitschriften","kern":"SpO2 ist der Sauerstoffwert. Misst mit rotem und infrarotem Licht die Sauerstoffsättigung im Kapillarblut (SpO2), also den Anteil des mit Sauerstoff beladenen Hämoglobins. Mit jedem Puls kommt neues Blut.","punkte":["★ Der Sauerstoff ist ans Hämoglobin gebunden (prüfungsrelevant).","★ Warnwert unter 90 %.","Anwendung: einschalten, Finger bis zum Anschlag hinein, Gerät zeigt SpO2 und Puls, die Kurve soll regelmäßig sein (Reden oder Bewegung lassen sie schwanken).","★ Verfälscht den Wert: kalte Finger, Unterkühlung oder Schock (schlechte Durchblutung, Ausfall möglich), Nagellack oder Schmutz (entfernen oder Gerät um 90 Grad drehen), Kohlenmonoxidvergiftung (Gerät unterscheidet CO und O2 nicht).","★ Im ABCDE am ehesten bei B, sonst bei E.","Den Puls vom Gerät nicht verwenden, trotzdem selbst fühlen (Rhythmus). Klinisches Bild immer im Kopf behalten. Kann als Monitor dranbleiben."],"merke":"Kalt, Schock, Nagellack, Kohlenmonoxid: dem Wert nicht trauen.","notizen":[{"text":"SpO2 ist der Sauerstoffwert.","ort":"Unterricht 12.11."}]},{"id":"sau","titel":"Sauerstoff","seiten":"Unterricht 12.11., Rest Ergänzung","kern":"Wann und wie du Sauerstoff gibst, kommt 100 % zur Prüfung (Karten dazu auch im Kapitel ABCDE bei B). Flaschenrechnung und Gefahren sind Ergänzung, nicht aus dem Unterricht.","punkte":["★ Wann: Person atmet nur sporadisch oder schwer, SpO2 unter 90 %, bei Zyanose sofort, auch ohne vorher zu messen.","★ Wie: Maske oder Nasenbrille, höchstens 15 l pro Minute, ab 94 % auf 6 bis 8 l pro Minute reduzieren.","★ COPD: Zielwert 90 % statt 94 %."],"merke":"Fett weg, Feuer weg, Flasche fest, Ventil langsam, nach SpO2 dosieren.","ergaenzung":["Wie lange reicht die Flasche? Flaschenvolumen (l) × Druck am Manometer (bar) = Liter Sauerstoff, geteilt durch den Flow (l pro Minute) = Minuten. Beispiel 2-l-Flasche mit 200 bar: 400 l, bei 15 l pro Minute rund 26 Minuten. Restdruck abziehen (Wert gibt die Dienststelle vor), mit 50 bar Rest also 300 l und 20 Minuten.","Brand: Sauerstoff brennt nicht selbst, lässt aber alles andere viel heftiger brennen. Kein Öl und kein Fett an Ventil, Druckminderer und Händen, keine fettigen Cremes unter der Maske, kein Feuer, nicht rauchen. Angereicherte Kleidung und Decken lüften. Beim Defi Sauerstoffquelle mindestens 1 m vom Brustkorb weg.","Druck: Flasche immer sichern (abgebrochenes Ventil macht sie zum Geschoss), Ventil langsam öffnen (Druckstoß erzeugt Hitze), vor Gebrauch prüfen, nicht in Sonne oder neben Heizung, nie ganz leer fahren.","Patient: Bei COPD kann zu viel Sauerstoff den Atemantrieb dämpfen. Zu viel Sauerstoff ohne Mangel kann schaden (z. B. Herzinfarkt, Schlaganfall), deshalb nach SpO2 dosieren. Frühgeborene: Netzhautschäden. Lange Gabe trocknet die Schleimhäute aus."],"notizen":[{"text":"Wann und wie Sauerstoff gegeben wird, kommt 100 % zur Prüfung.","ort":"12.11."}]},{"id":"ekg","titel":"EKG","seiten":"S. 117 bis 128, Mitschriften","kern":"Das EKG zeigt die elektrische Aktivität des Herzens. Sanitäter:innen interpretieren es nicht, es ist Vorarbeit für andere. Ein Herzinfarkt ist am EKG oft nicht erkennbar.","punkte":["Im ABCDE bei C ansehen.","Der LIFEPAK hat ein kleines 3-Kanal-EKG. Das 12-Kanal-EKG mit den Brustwandelektroden V1 bis V6 (S. 127) ist nicht so wichtig.","★ Kleben (prüfungsrelevant): ab der rechten Schulter (aus Sicht der Patient:in) im Uhrzeigersinn rot, gelb, grün, Merkhilfe Ampel.","An den Extremitäten: rechter Arm rot, linker Arm gelb, linkes Bein grün. Eine schwarze Elektrode (Erdung) gibt es bei euch nicht.","★ Vor dem Kleben: Haut trocken, bei Behaarung rasieren."],"merke":"Rechte Schulter, im Uhrzeigersinn, Ampel. Kleben ja, deuten nein.","notizen":[{"text":"Elektrodenposition aus der zweiten Mitschrift, dort blau markiert.","ort":"Mitschrift 2"},{"text":"Schwarze Elektrode gibt es bei uns nicht. 12-Kanal-EKG auf S. 127 nicht so wichtig.","ort":"Wiederholung 11.11."}]},{"id":"gku","titel":"Ganzkörperuntersuchung und Temperatur","seiten":"S. 117 bis 128, Mitschriften","kern":"Gehört zu E, aber nicht standardmäßig: nur bei Trauma oder spezifischen Hinweisen. Von Kopf bis Fuß nach Verletzungen, unentdeckten Krankheiten, Rötungen und Knochenbrüchen suchen, beim Ausziehen an die Wärme denken.","punkte":["★ Wann: nur bei Trauma (z. B. nach Unfällen) oder spezifischen Hinweisen, z. B. Bewusstlosigkeit ohne erkennbaren Grund. Nicht standardmäßig bei E.","★ Kopf: anschauen, Gesicht abtasten (Jochbein, Nasenbein, Ober- und Unterkiefer), Hinterkopf auf Unebenheiten (Schädelbasisbruch) und Blut, Pupillenreflex mit der Leuchte, in die Ohren schauen. Vor allem bei Trauma ins Ohr leuchten: Blut oder Gehirnflüssigkeit deutet auf eine Kopfverletzung. Stufenbildung (Kopf hat eine andere Form) heißt schlechtes Outcome, hohe Letalität.","★ Hals: entlangtasten, gestaute Halsvenen (Rückstau, z. B. Lungenembolie).","★ Brust: Schlüsselbein, Schultern, Brustbein, den Rumpf entlang bis zur Wirbelsäule.","★ Bauch: rechts und links immer aus Sicht der Patient:in. Rechter Oberbauch z. B. Leber. Die Leiste berührst du normalerweise nicht, die Person tastet selbst ab. Ausnahme: starke Blutung in der Leiste.","★ Rücken: aufsetzen lassen, sonst auf die Seite drehen (Achtung bei MILS), Wirbelsäule abtasten.","★ Gliedmaßen: Puls am Fuß, an Händen und Füßen drücken und fragen, ob sie es spürt, Hände drücken lassen.","★ Temperatur (bei E): Warnzeichen über 39 Grad. Schutzkappe aufs Thermometer, Altersgruppe einstellen, in beiden Ohren messen. Ohr bei Kindern und Erwachsenen nach oben und hinten ziehen, bei Säuglingen gerade nach hinten."],"merke":"Von Kopf bis Fuß, rechts und links aus Sicht der Patient:in.","notizen":[{"text":"In der Mitschrift steht „linker Oberbauch z. B. Blinddarm“. Der Blinddarm liegt aber rechts unten, links oben liegen z. B. Milz und Magen.","ort":"Mitschrift 10.11."},{"text":"Leiste bei der Untersuchung normalerweise nicht berühren, Ausnahme starke Blutung in der Leiste.","ort":"Wiederholung 11.11."},{"text":"Ganzkörperuntersuchung nur bei Trauma oder spezifischen Hinweisen, nicht standardmäßig bei E.","ort":"Wiederholung 11.11."}]},{"id":"hi","titel":"Herzinfarkt","seiten":"Seiten im Band noch offen","kern":"Kommt sicher zur Prüfung. Bis die Seiten aus dem Band gescannt sind, stammen die Inhalte hier aus allgemeinen Erste-Hilfe-Empfehlungen und sind als Ergänzung markiert.","punkte":["★ Kommt sicher zur Prüfung (Unterricht 11.11.).","★ Am EKG ist ein Herzinfarkt oft nicht erkennbar (Mitschrift 10.11.)."],"merke":"Brustschmerz, der ausstrahlt, plus Blässe und kalter Schweiß: an Herzinfarkt denken, 144, Oberkörper hoch, nicht allein lassen.","ergaenzung":["Anzeichen: starker, anhaltender Druck oder Schmerz in der Brust, oft ausstrahlend in linken Arm, Schulter, Hals, Unterkiefer, Rücken oder Oberbauch, dazu Atemnot, Übelkeit, Blässe, kalter Schweiß, Angst und Unruhe.","Oft untypisch bei Frauen, älteren Menschen und Diabetiker:innen: nur Übelkeit, Oberbauchschmerzen, Atemnot oder Schwäche.","Erste Hilfe: Notruf 144 mit Verdacht auf Herzinfarkt, Person nicht allein lassen und beruhigen, Oberkörper hoch (sitzend oder halbsitzend), keine Anstrengung, beengende Kleidung öffnen, frische Luft, Defi holen lassen, Atmung und Bewusstsein laufend kontrollieren. Atem-Kreislauf-Stillstand: sofort Wiederbelebung und Defi."],"notizen":[{"text":"Herzinfarkt und Erste Hilfe kommen 100 % zur Prüfung.","ort":"Wiederholung 11.11."}]},{"id":"hyg","titel":"Hygiene","seiten":"Mitschrift 2","kern":"Begriffe zu Erregern, Übertragung und Schutz. Prüfungsrelevant: den Hygieneplan anwenden können und multiresistente Erreger.","punkte":["Pathogenität: ob ein Erreger in einem Organismus eine Krankheit hervorrufen kann.","Virulenz: wie aggressiv ein Erreger ist, also wie stark er krank macht.","Nosokomiale Infektion: Erreger stammt aus einem kontaminierten Umfeld im Gesundheitssystem (z. B. Krankenhaus).","Single Use: nur einmal benutzbar. Single Patient Use: nur bei derselben Patient:in wiederverwendbar.","Übertragungswege: Stich und Biss, Tröpfchen, Schmier- und Kontaktinfektion, Blut (z. B. Nadelstich).","Dispositionsprophylaxe: vorbeugen, um das eigene Infektionsrisiko zu senken. Expositionsprophylaxe: Schutz beim Kontakt mit Infizierten (z. B. FFP2). Postexpositionsprophylaxe: Maßnahmen nach einer möglichen Ansteckung (z. B. Impfung).","★ Hygieneplan: den Maßnahmenzettel für die Expositionsprophylaxe anwenden können, er liegt im Portal.","★ Multiresistente Erreger: gegen mehrere Mittel resistent, vor allem gegen Antibiotika."],"merke":"Pathogenität: ob krank. Virulenz: wie stark krank.","notizen":[{"text":"Hygieneplan anwenden können und multiresistente Erreger sind in der zweiten Mitschrift blau, also prüfungsrelevant.","ort":"Mitschrift 2"}]},{"id":"dsg","titel":"Datenschutz (DSGVO)","seiten":"E-Learning Modul 1 und 2","kern":"Die DSGVO schützt personenbezogene Daten und sorgt für ein ausgewogenes Verhältnis zwischen Privatsphäre und der nötigen Nutzung der Daten. Verantwortlich sind alle Mitarbeiter_innen, für elektronische und für Papierdaten.","punkte":["★ Personenbezogene Daten: alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen. Schon ein Nachname kann reichen.","Verarbeitung: jeder Vorgang mit personenbezogenen Daten, z. B. Erheben, Erfassen, Ordnen, Speichern, Verwenden.","Datenschutz heißt Schutz der eigenen Daten, Schutz der Daten von Dritten und Schutz vor Regierungen, Arbeitgebern, Industrien.","Datenfluss: Patient gibt Daten an Mitarbeiter_in (Dokumentation, Maßnahmen), dann in die Organisation (gesetzliche Aufbewahrung), dann Verrechnung mit Dritten.","★ Verschwiegenheitspflicht: alles geheim halten, was dir im Dienst anvertraut wird. Weitergabe an Dritte nur auf ausdrückliche Anordnung (Gesetz, interne Vorgaben, Weisung der Vorgesetzten). Unberechtigte Weitergabe kann strafrechtliche Folgen haben.","Unbeabsichtigte Weitergabe vermeiden: Unterlagen verschlossen aufbewahren, nicht mehr benötigte schreddern statt Papierkorb, bei Gesprächen darauf achten, dass niemand mithört.","★ Im Rettungsdienst: Fenster schließen und Fahrzeug absperren, wenn du es verlässt. Unterlagen mit Patientendaten nach Gebrauch schreddern. Patientendaten nur über die digitale Patientendokumentation verwalten. Transportanweisung und Dokumentation so lagern, dass niemand hineinsieht. E-Card und Arztbriefe sofort zurückgeben.","★ Fünf Grundsätze: 1 Zweck (jede Verarbeitung braucht einen bestimmten Zweck), 2 Datensparsamkeit (nur Daten, die für den Zweck nötig sind), 3 Rechtmäßigkeit (rechtliche Befugnis nötig), 4 Transparenz (Betroffene werden informiert), 5 Datensicherheit (sicher verwahren, kein Zugang für Unbefugte).","Rechtliche Befugnis: gesetzliche Grundlage, Erfüllung eines Vertrags, berechtigtes öffentliches Interesse, Schutz lebenswichtiger Interessen, Einwilligung.","Beispiele: Anamnese, Zweck ist die optimale Versorgung. Besuchsdienst braucht Name, Adresse, Art der Betreuung, aber keine Finanzdaten oder Staatsangehörigkeit. Transportberichte im Fahrzeug verdeckt, auf der Dienststelle verschlossen.","★ Grundsatz: Jede Datenverwendung ist unzulässig, außer es gibt eine ausdrückliche Berechtigung. Sechs Rechtsgrundlagen: Gesetz, Vertrag, öffentliches Interesse, lebenswichtiges Interesse, berechtigtes Interesse, Einwilligung.","Zwei Arten von Daten: besondere Kategorie (früher sensibel: ethnische Herkunft, politische Meinung, Religion, Weltanschauung, Gewerkschaft, Gesundheit, Sexualleben, genetische und biometrische Daten) und alle anderen personenbezogenen Daten.","Einwilligung: ohne Zwang und Irrtum, in Kenntnis der Sachlage, für den konkreten Fall, jederzeit widerrufbar, durch eine aktive Handlung. Mündlich reicht, sollte aber nachvollziehbar sein. Nur nötig, wenn keine andere Rechtsgrundlage besteht.","★ Rettungsdienst: Kann der Patient nicht einwilligen, dürfen die Daten zum Schutz lebenswichtiger Interessen trotzdem erhoben werden.","★ § 5 SanG: Sanitäter_innen müssen die gesetzten sanitätsdienstlichen Maßnahmen dokumentieren. Die Aufzeichnungen bewahrt die Einrichtung mindestens zehn Jahre auf.","Gesundheitsdaten im Gesundheitsbereich: im Interesse der Person, nur durch Fachpersonal, Berufsgeheimnis und Verschwiegenheit, Dritte (Arbeitgeber, Versicherungen) dürfen sie nicht zu anderen Zwecken nutzen.","Weiterverarbeitung für einen anderen Zweck nur mit Einwilligung, Rechtsgrundlage oder Kompatibilität. Innerhalb der Organisation nicht mit allen austauschen.","Rechte der Betroffenen: Information, Auskunft, Berichtigung, Löschung (nicht, wenn eine Dokumentationspflicht besteht), Einschränkung, Übertragbarkeit. Anträge gehen an die für den Datenschutz zuständige Person."],"merke":"Zweck, Sparsamkeit, Rechtmäßigkeit, Transparenz, Sicherheit. Verantwortlich sind alle.","notizen":[{"text":"E-Learning Datenschutz Modul 1 am 12.11. abgeschlossen, alle Selbstüberprüfungen richtig.","ort":"E-Learning Datenschutz Modul 1"},{"text":"E-Learning Datenschutz Modul 2 am 12.11. abgeschlossen, alle Selbstüberprüfungen richtig.","ort":"E-Learning Datenschutz Modul 2"}]},{"id":"wor","titel":"Medizinische Begriffe","seiten":"Blatt Medizinische Begriffe (2 Seiten), Unterricht","kern":"Die 50 Fachbegriffe vom Blatt „Medizinische Begriffe Stand 2026“, alphabetisch. 15 davon kommen bei der Zwischenprüfung. Gelernt wird nur vom Fachbegriff zur deutschen Bedeutung.","punkte":["Abdomen: Bauch, Unterleib.","Abort: Fehlgeburt.","Anamnese: Systematische Erfragung von potenziell medizinisch relevanten Informationen.","Angina Pectoris: Brustenge, Herzenge.","Arrhythmie: Unregelmäßigkeit der elektrischen Herztätigkeit.","Arterien: Vom Herz wegführende Blutgefäße.","Aspiration: Eindringen flüssiger oder fester Stoffe in die Atemwege.","Asystolie: Form des Herz-Kreislauf-Stillstands durch fehlende Kontraktion des Herzens.","Atrium: Vorhof (Herz).","Bradykardie: Herzrhythmusstörung mit niedriger Herzfrequenz (Erwachsene unter 60/min).","Bronchiolen: Feine Verzweigungen der Bronchien.","Dehydration: Abnahme des Körperwassers.","Diabetes mellitus: Zuckerkrankheit (umgangssprachlich).","Diastole: Erschlaffungs- und Füllungsphase des Herzens.","Epistaxis: Nasenbluten.","Exitus: Tod.","Fontanellen: Durch Bindegewebe überbrückte Knochenspalten am kindlichen Schädel.","Fraktur: Knochenbruch.","Hypertonie: Bluthochdruck.","Indikation: Grund zur Anwendung eines bestimmten diagnostischen oder therapeutischen Verfahrens in einem Erkrankungsfall.","Infarkt: Absterben von Gewebe.","Inhalation: Einatmung (Aufnahme von Gasen, Dämpfen usw.).","Inkubationszeit: Zeit zwischen Ansteckung und dem Auftreten der ersten Symptome der Infektionskrankheit.","Insuffizienz: Schwäche, ungenügende Leistung eines Organs oder Organsystems.","Insult: Schlaganfall.","Intubation: Einführen eines Kunststoffschlauchs durch Mund oder Nase in die Luftröhre.","kardial: Das Herz betreffend, vom Herz ausgehend.","Kontraindikation: Umstand, der die Anwendung eines diagnostischen oder therapeutischen Verfahrens bei an sich gegebener Indikation verbietet.","Larynx: Kehlkopf.","Luxation: Verrenkung.","Myokard: Muskuläre Wand des Herzens.","Ödem: Flüssigkeitsansammlung in den Gewebespalten (z. B. Beinödem, Lungenödem).","Pneumonie: Entzündung der Lunge.","Prophylaxe: Verhütung von Krankheiten, Vorbeugung.","pulmonal: Die Lunge betreffend.","Ruptur: Zerreißung, Durchbruch.","Sekret: Absonderungsprodukt von Zellen bzw. Drüsen.","Sepsis: Blutvergiftung (umgangssprachlich).","steril: Keimfrei, sterilisiert.","Stridor: Pfeifendes Ein- oder Ausatemgeräusch.","Systole: Kontraktions- und Ausströmungsphase des Herzens.","Tachykardie: Herzrhythmusstörung mit erhöhter Herzfrequenz (Erwachsene über 100/min).","Thorax: Brustkorb.","Tonus: Grad der Anspannung eines Organs oder Organteils (z. B. Muskulatur, Gefäße).","Toxine: Giftstoffe.","Trachea: Luftröhre.","Uterus: Gebärmutter.","Venen: Zum Herz hinführende Blutgefäße.","zerebral: Das Gehirn betreffend.","Zyanose: Blaurote Färbung von Haut und Schleimhäuten infolge einer Abnahme des Sauerstoffgehalts im Blut.","★ Indikation einfach: spricht für eine Maßnahme. Kontraindikation einfach: es tritt etwas auf, das zeigt, dass du die Maßnahme nicht machen kannst.","Beispiel: Bewusstlos und atmet ist die Indikation für die stabile Seitenlage. Atmet die Person nicht normal, spricht das dagegen, dann Wiederbelebung."],"merke":"15 der 50 Begriffe kommen bei der Zwischenprüfung. Indikation spricht dafür, Kontraindikation dagegen. Arterien vom Herz weg, Venen zum Herz. Systole Auswurf, Diastole Füllung. Tachykardie über 100, Bradykardie unter 60.","notizen":[{"text":"Kontraindikation, wenn etwas auftritt, das zeigt, dass ich eine Maßnahme nicht machen kann. Indikation, etwas, das auf etwas hinweist.","ort":"Wiederholung 11.11."},{"text":"Blatt „Medizinische Begriffe“ (2 Seiten) als Foto von einem Kurskollegen.","ort":"Blatt Medizinische Begriffe"},{"text":"Bei den Begriffen reicht die deutsche Übersetzung, die andere Richtung muss man nicht können.","ort":"Unterricht 11.11."},{"text":"Aus dieser Liste der medizinischen Begriffe werden 15 bei der Zwischenprüfung abgefragt.","ort":"Lernplattform, Kachel Medizinische Grundbegriffe"}]}],"karten":[{"id":"ork01","t":"ork","f":"Wer legte den Grundstein für das Rote Kreuz, wann, und seit wann gibt es das ÖRK?","a":["Henry Dunant, Schweizer Geschäftsmann, in den 1860er-Jahren","ÖRK seit 1880","Heute weltweit 192 Gesellschaften, koordiniert aus Genf"],"s":"S. 12"},{"id":"ork02","t":"ork","f":"Nenne die sieben Rotkreuz-Grundsätze.","a":["Menschlichkeit, Unparteilichkeit, Neutralität, Unabhängigkeit, Freiwilligkeit, Einheit, Universalität","Eselsbrücke: „Manche Unfälle nehmen uns fast echt unvorbereitet“"],"s":"S. 12","p":true},{"id":"ork03","t":"ork","f":"Nenne die acht Berufs- und Tätigkeitspflichten.","a":["Gut arbeiten: Sorgfalt, Dokumentation, Fortbildung","Mit Information umgehen: Verschwiegenheit, Auskunft, Mitteilung, Anzeige","Helfen: Hilfeleistung"],"s":"S. 15","p":true},{"id":"ork04","t":"ork","f":"Wer muss in Österreich für das Rettungswesen sorgen?","a":["Die Gemeinden","Sie übertragen es meist dem Roten Kreuz"],"s":"S. 15"},{"id":"abc01","t":"abc","f":"Wofür stehen SSS, EE und ABCDE?","a":["SSS: Szene, Sicherheit, Situation","EE: Erster Eindruck","A: Airway, Atemwege","B: Breathing, Atmung","C: Circulation, Kreislauf","D: Disability, Neurologie","E: Exposure, Entkleiden/Entscheiden"],"s":"S. 16","p":true,"abc":"alle","sicher":true},{"id":"abc02","t":"abc","f":"Welches Motto steht hinter dem ABCDE-Schema?","a":["„Treat first what kills first“: Behandle zuerst, was zuerst tötet"],"s":"S. 16","p":true,"abc":"alle","sicher":true},{"id":"abc03","t":"abc","f":"Worum geht es bei SSS und beim Ersten Eindruck (EE)?","a":["SSS: eigene Sicherheit, Team und Patient:in schützen","EE: Notfall erfassen, lebensbedrohliche Blutungen sofort stillen"],"s":"S. 16","p":true,"abc":"SSS, EE","sicher":true},{"id":"abc04","t":"abc","f":"Worum geht es bei A und bei B?","a":["A: Atemwege freimachen UND freihalten","B: Atmung und Sauerstoffversorgung sichern, nötigenfalls Wiederbelebung"],"s":"S. 16","p":true,"abc":"A, B","sicher":true},{"id":"abc05","t":"abc","f":"Worum geht es bei C, D und E?","a":["C: schwere Kreislaufprobleme feststellen","D: schwere neurologische Störungen erkennen","E: entkleiden, nichts Wichtiges übersehen, entscheiden"],"s":"S. 16","p":true,"abc":"C, D, E","sicher":true},{"id":"abc06","t":"abc","f":"Du stufst eine Person als kritisch ein. Was tust du?","a":["Notarzt nachfordern, per Funk: „Leitstelle von 20 202, kommen!“","Wenn kein Notarztmittel rechtzeitig verfügbar ist: schneller Transport ins Krankenhaus"],"s":"S. 16, Wiederholung 11.11.","p":true,"sicher":true},{"id":"abc07","t":"abc","f":"Was unterscheidet den Notfallcheck vom ABCDE-Schema?","a":["Sie sind sich ähnlich","Notfallcheck: Sicht der Ersthelfer","ABCDE: Sicht der Rettungssanitäter, strukturierte Beurteilung"],"s":"S. 16, S. 22","n":"Das eine ist die Erste-Hilfe-Perspektive, das ABC ist dann für Rettungssanitäter.","abc":"alle","p":true,"sicher":true},{"id":"abc08","t":"abc","f":"SSS: Was ist der Unterschied zwischen Szene und Situation?","a":["Szene: Umfeld, größerer Kontext, z. B. Wetter, Ortschaft, Straßen","Situation: was passiert ist"],"s":"Wiederholung 11.11.","p":true,"abc":"SSS","sicher":true},{"id":"abc09","t":"abc","f":"Wofür steht AVPU?","a":["A: Alert, wach","V: Voice, reagiert auf Ansprache","P: Pain, reagiert auf Schmerzreiz","U: Unresponsive, reagiert nicht"],"s":"S. 104 bis 116, Wiederholung 11.11.","p":true,"n":"Kürzel wurde erwähnt, kommt zur Prüfung. Laut Unterricht sehr wichtig.","abc":"EE","sicher":true},{"id":"abc10","t":"abc","f":"Ordne nach AVPU zu: 1 unterhält sich normal mit dir, 2 öffnet die Augen erst, als du laut ansprichst, 3 reagiert erst, als du sie kneifst, 4 reagiert gar nicht.","a":["1 A (Alert)","2 V (Voice)","3 P (Pain)","4 U (Unresponsive)"],"s":"S. 104 bis 116, Wiederholung 11.11.","p":true,"abc":"EE","n":"Laut Unterricht sehr wichtig.","sicher":true},{"id":"abc12","t":"abc","f":"A: Was musst du mit den Atemwegen tun, zwei Dinge?","a":["Freimachen","UND freihalten"],"s":"Wiederholung 11.11.","abc":"A","p":true,"sicher":true},{"id":"abc13","t":"abc","f":"Wie stark überstreckst du den Kopf bei Kindern und Säuglingen?","a":["Je kleiner die Person, desto weniger","Bei Säuglingen gar nicht, Schnüffelposition (neutrale Kopfposition)","Überstreckt man beim Säugling, kann etwas kaputt gehen"],"s":"Wiederholung 11.11.","abc":"A, B","p":true,"sicher":true},{"id":"abc48","t":"abc","f":"Was ist die Schnüffelposition, und warum nutzt du sie beim Säugling?","a":["Neutrale Kopfposition beim Säugling","Damit prüfst du die Atemwege","Überstrecken kann beim Säugling etwas kaputt machen"],"s":"Wiederholung 11.11.","p":true,"abc":"A","sicher":true},{"id":"abc11","t":"abc","f":"Zu welchem Schritt im ABCDE-Schema gehört GAMS?","a":["Zu SSS, ganz am Anfang","GAMS: Gefahr erkennen, Absichern und Abstand, Menschenleben retten, Spezialkräfte nachfordern"],"s":"Wiederholung 11.11.","p":true,"abc":"SSS","sicher":true},{"id":"nr122a","t":"tel","f":"Welche Nummer hat die Feuerwehr?","a":["122"],"s":"S. 17","p":true,"sicher":true},{"id":"nr122b","t":"tel","f":"Wen erreichst du unter 122?","a":["Feuerwehr"],"s":"S. 17","p":true,"sicher":true},{"id":"nr133a","t":"tel","f":"Welche Nummer hat die Polizei?","a":["133"],"s":"S. 17","p":true,"sicher":true},{"id":"nr133b","t":"tel","f":"Wen erreichst du unter 133?","a":["Polizei"],"s":"S. 17","p":true,"sicher":true},{"id":"nr144a","t":"tel","f":"Welche Nummer hat der Rettungsdienst?","a":["144"],"s":"S. 17","p":true,"sicher":true},{"id":"nr144b","t":"tel","f":"Wen erreichst du unter 144, und was macht die Leitstelle für dich?","a":["Rettungsdienst","Leitet die Erste Hilfe am Telefon an und sagt dir, wo der nächste Defi ist"],"s":"S. 17","p":true,"sicher":true},{"id":"nr112a","t":"tel","f":"Welche Nummer ist der Euro-Notruf?","a":["112"],"s":"S. 17","p":true,"sicher":true},{"id":"nr112b","t":"tel","f":"Was ist 112, wo landest du in Österreich, und was ist der Vorteil?","a":["Euro-Notruf, in ganz Europa gleich","In Österreich bei der Polizei","Geht ohne SIM, Vertrag, Guthaben oder Heimatnetz, über jedes verfügbare Netz"],"s":"S. 17","p":true,"sicher":true},{"id":"nr1450a","t":"tel","f":"Welche Nummer hat die telefonische Gesundheitsberatung?","a":["1450"],"s":"S. 17","p":true,"sicher":true},{"id":"nr1450b","t":"tel","f":"Was ist 1450, und wann rufst du dort an?","a":["Telefonische Gesundheitsberatung, 0 bis 24 Uhr","Bei Beschwerden, die kein Notfall sind"],"s":"S. 17","p":true,"sicher":true},{"id":"nr140a","t":"tel","f":"Welche Nummer hat die Bergrettung?","a":["140"],"s":"S. 17","p":true,"sicher":true},{"id":"nr140b","t":"tel","f":"Wen erreichst du unter 140?","a":["Bergrettung"],"s":"S. 17","p":true,"sicher":true},{"id":"nr141a","t":"tel","f":"Welche Nummer hat der Ärztenotdienst?","a":["141"],"s":"S. 17","p":true,"sicher":true},{"id":"nr141b","t":"tel","f":"Wen erreichst du unter 141?","a":["Ärztenotdienst, ärztlicher Bereitschaftsdienst"],"s":"S. 17","p":true,"sicher":true},{"id":"nr142a","t":"tel","f":"Welche Nummer hat die Telefonseelsorge?","a":["142"],"s":"S. 17","p":true,"sicher":true},{"id":"nr142b","t":"tel","f":"Wen erreichst du unter 142?","a":["Telefonseelsorge"],"s":"S. 17","p":true,"sicher":true},{"id":"nr147a","t":"tel","f":"Welche Nummer hat Rat auf Draht?","a":["147"],"s":"S. 17","p":true,"sicher":true},{"id":"nr147b","t":"tel","f":"Wen erreichst du unter 147?","a":["Rat auf Draht"],"s":"S. 17","p":true,"sicher":true},{"id":"nr116a","t":"tel","f":"Welche Nummer hat die Ö3 Kummernummer?","a":["116 123"],"s":"S. 17","p":true,"sicher":true},{"id":"nr116b","t":"tel","f":"Wen erreichst du unter 116 123?","a":["Ö3 Kummernummer"],"s":"S. 17","p":true,"sicher":true},{"id":"nrvizA","t":"tel","f":"Welche Nummer hat die Vergiftungsinformationszentrale?","a":["+43 1 406 43 43"],"s":"S. 17","p":true,"n":"Kommt 100 % zur Prüfung.","sicher":true},{"id":"nrvizB","t":"tel","f":"Wen erreichst du unter +43 1 406 43 43?","a":["Vergiftungsinformationszentrale"],"s":"S. 17","p":true,"n":"Kommt 100 % zur Prüfung.","sicher":true},{"id":"not06","t":"tel","f":"Wann ist ein Notruf abgeschlossen, und was tust du währenddessen?","a":["Erst wenn die Leitstelle das Gespräch beendet","Fragen beantworten, Freisprechen nutzen, parallel Erste Hilfe leisten","Die Einsatzkräfte sind schon während des Gesprächs alarmiert"],"s":"S. 17","p":true},{"id":"not07","t":"tel","f":"Verkehrsunfall mit eingeklemmter Person: Musst du Feuerwehr und Polizei extra anrufen?","a":["Nein, eine Nummer reicht","Die Leitstelle alarmiert Feuerwehr und Polizei mit, wenn du die Lage schilderst"],"s":"S. 17","p":true},{"id":"not10","t":"not","f":"Warum musst du dein Material kennen?","a":["Was du nicht genau kennst, findest du in der Stresssituation erst recht nicht","Z. B. die Rettungstasche in einem neuen Auto"],"s":"S. 17, Unterricht","n":"Kenn dein Material."},{"id":"gams1","t":"not","f":"Wofür steht GAMS?","a":["G: Gefahr erkennen","A: Absichern, Absperren, Abstand halten","M: Menschenleben retten","S: Spezialkräfte nachfordern"],"s":"S. 17, Unterricht","p":true,"n":"Gefahr, Absichern / Abstand, Menschenleben retten, Spezialkräfte.","abc":"SSS","sicher":true},{"id":"gams2","t":"not","f":"Was bedeuten die vier Schritte von GAMS konkret?","a":["G: beobachten, Warntafeln lesen, im Zweifel die größte Gefahr annehmen","A: Bereich absperren, selbst Abstand halten, nicht in die Gefahr gehen","M: Menschen retten nur ohne Eigengefährdung, sonst Leute aus dem Bereich rufen","S: Feuerwehr, Polizei, Gefahrgutkräfte nachfordern, Nummern der Warntafel durchgeben"],"s":"nachgeschlagen","q":"e","abc":"SSS","p":true,"sicher":true},{"id":"dreiw","t":"not","f":"Welche 3 W brauchst du bei einem Autounfall, und in welcher Reihenfolge?","a":["Warnblinker einschalten","Warnweste noch im Auto anziehen","Warndreieck aufstellen, in ausreichendem Abstand vor der Unfallstelle","Abstände: Lehrbuch S. 34 (folgt mit dem nächsten Scan)"],"s":"S. 17, Unterricht","p":true,"n":"3 W: Warnweste, Warnblinker, Warndreieck. Wichtig, wo man sie aufstellt.","abc":"SSS","sicher":true},{"id":"bas01","t":"bas","f":"Nenne die vier Basismaßnahmen.","a":["Lagerung","Frische Luft","Wärme","Psychische Betreuung"],"s":"S. 18 bis 19","p":true},{"id":"bas02","t":"bas","f":"Was sind Basismaßnahmen, und was dürfen sie nie?","a":["Maßnahmen, die bei jedem Notfall gehen, körperlich und psychisch","Du empfiehlst sie, du zwingst sie nicht auf","Sie dürfen lebensrettende Maßnahmen nie verzögern"],"s":"S. 18","p":true},{"id":"bas03","t":"bas","f":"Was gehört zur frischen Luft?","a":["Fenster auf","Enge Kleidung lockern","Ruhig atmen lassen"],"s":"S. 18","p":true,"abc":"B"},{"id":"bas04","t":"bas","f":"Wie hältst du eine Person warm, und worauf achtest du?","a":["Zudecken und die Decke auch unter die Person stopfen","Grund: Transmissionswärme, man verliert auch über den Boden Wärme","Bei Verdacht auf Becken- oder Wirbelsäulenverletzung nicht umlagern"],"s":"S. 19","p":true,"n":"Auch unter die Person, nicht nur drüber legen.","abc":"C"},{"id":"bas05","t":"bas","f":"Was bedeutet Look, Listen, Link?","a":["Look: hinschauen, Stresssignale wahrnehmen","Listen: aktiv zuhören, Bedürfnisse erfragen","Link: Angehörige und weitere Hilfe holen"],"s":"S. 19","p":true},{"id":"lag01","t":"bas","f":"Welche vier Lagerungen habt ihr gelernt, und wofür?","a":["Beine zum Bauch anziehen: Bauchschmerzen","Seitenlage: wach, aber übel oder schläfrig","Vornübergebeugt: Atemnot, Asthma","Rückenlage, Beine angewinkelt (L-Form): Kreislaufprobleme"],"s":"S. 19, Unterricht","p":true,"abc":"B, C"},{"id":"lag02","t":"bas","f":"Eine Person hat starke Bauchschmerzen. Wie lagerst du sie, und warum?","a":["Beine Richtung Bauch anziehen","Das entlastet die Bauchdecke"],"s":"Unterricht","p":true},{"id":"lag03","t":"bas","f":"Eine Person ist bei Bewusstsein, ihr ist übel und sie ist schläfrig. Wie lagerst du sie?","a":["Seitenlage (nicht die stabile Seitenlage)","Bleiben die Atemwege frei, falls sie erbricht"],"s":"Unterricht","p":true,"abc":"A"},{"id":"lag04","t":"bas","f":"Eine Person hat Atemnot oder einen Asthmaanfall. Wie lagerst du sie?","a":["Vornübergebeugt, sitzend, Arme abstützen","Oberkörper hoch"],"s":"S. 18, Unterricht","p":true,"abc":"B"},{"id":"lag05","t":"bas","f":"Eine Person hat Kreislaufprobleme. Wie lagerst du sie?","a":["Am Rücken auf dem Boden, Beine angewinkelt hoch (L-Form)"],"s":"Unterricht","p":true,"abc":"C"},{"id":"lag06","t":"bas","f":"Was ist der Unterschied zwischen Seitenlage und stabiler Seitenlage?","a":["Seitenlage: Person ist bei Bewusstsein, aber übel oder schläfrig","Stabile Seitenlage: Person ist bewusstlos und atmet normal"],"s":"Unterricht, S. 24","p":true,"abc":"A"},{"id":"weg01","t":"weg","f":"Wie ziehst du eine reglose Person aus der Gefahrenzone?","a":["Nur ohne Eigengefährdung, vorher wenn möglich absichern","Arme am Boden lassen und nach oben führen","Hinter dem Kopf überkreuzen, Kopf möglichst zwischen den Armen","An den Handgelenken wegziehen","Aus der Bauchlage genauso"],"s":"S. 20 bis 21","b":["wegziehen-1","wegziehen-2","wegziehen-3"],"abc":"SSS"},{"id":"weg02","t":"weg","f":"Wie drehst du eine reglose Person aus der Bauchlage auf den Rücken?","a":["Arm beim Kopf ausstrecken","An Becken und Schulter der Gegenseite fassen","Zu dir drehen, möglichst nicht übers Gesicht","Danach Atmung prüfen"],"s":"S. 20 bis 21"},{"id":"reg02","t":"reg","f":"Notfallcheck: Wie läuft er ab? Sag es laut wie in der Prüfung.","a":["1 Umgebung sichern: „Umgebung sicher.“","2 An den Schultern rütteln: „Hallo, hallo, können Sie mich hören?“","3 Keine Reaktion: laut um Hilfe rufen","4 Aufgaben verteilen: Rettung rufen, Defi holen, Verbandskasten holen","5 Atemwege prüfen, ggf. freimachen, Kopf überstrecken","6 Max. 10 s Atemkontrolle: Ohr zu Mund und Nase, Blick auf den Brustkorb","7 Atmet: stabile Seitenlage. Atmet nicht: Herzdruckmassage"],"s":"S. 22 bis 23, Unterricht","p":true,"sicher":true},{"id":"reg09","t":"reg","f":"Wie verteilst du beim Notfallcheck die Aufgaben?","a":["Personen direkt ansprechen","„Du rufst die Rettung (144).“","„Du holst den Defi.“","„Du holst den Verbandskasten.“"],"s":"Unterricht","p":true,"sicher":true},{"id":"reg05","t":"reg","f":"Du bist unsicher, ob die Person normal atmet. Was gilt, und warum?","a":["Keine normale Atmung annehmen, sofort drücken","Wacht die Person beim Drücken auf, merkst du es","Andersrum stirbt sie in der stabilen Seitenlage"],"s":"S. 22, Unterricht","p":true,"n":"Wenn unsicher, dann KEINE ATMUNG.","abc":"B","sicher":true},{"id":"reg10","t":"reg","f":"Du findest als Sanitäter:in eine bewusstlose Person. Wie schätzt du die Lage ein?","a":["Immer kritisch, akute Lebensgefahr","Immer Notarzt nachfordern"],"s":"Unterricht","p":true,"n":"Bewusstlos ist immer kritisch, Notarzt nachfordern.","abc":"alle","sicher":true},{"id":"reg03","t":"reg","f":"Warum überstreckst du bei einer reglosen Person den Kopf?","a":["Die Muskulatur ist schlaff, die Zunge sinkt nach hinten und verlegt die Atemwege","Überstrecken macht sie frei"],"s":"S. 22","abc":"A","p":true,"sicher":true},{"id":"reg06","t":"reg","f":"Woran unterscheidest du Bewusstlosigkeit und Atem-Kreislauf-Stillstand?","a":["Beide: keine Reaktion auf Ansprechen","Bewusstlosigkeit: normale Atmung, stabile Seitenlage","Atem-Kreislauf-Stillstand: keine normale Atmung, Wiederbelebung"],"s":"S. 22, S. 28","p":true,"abc":"B, C","sicher":true},{"id":"reg07","t":"reg","f":"Ist Schnappatmung eine normale Atmung?","a":["Nein","Vereinzelte, unregelmäßige oder langsame Atemzüge und Schnappen nach Luft sind keine normale Atmung"],"s":"S. 24, S. 26","abc":"B","p":true,"sicher":true},{"id":"ssl01","t":"ssl","f":"Warum braucht eine bewusstlose Person, die normal atmet, die stabile Seitenlage?","a":["Zunge, Erbrochenes, Blut oder Speichel können die Atemwege verlegen","Ohne Seitenlage droht der Erstickungstod"],"s":"S. 24","abc":"A"},{"id":"ssl02","t":"ssl","f":"Stabile Seitenlage: Wie gehst du vor? Erzähl laut, was du machst.","a":["1 Notfallcheck: Person atmet, neben sie knien","2 Näheren Arm im rechten Winkel ablegen","3 Ferne Hand aufs ferne Knie legen, Knie gleichzeitig so weit wie möglich hochziehen","4 Am Knie zu dir ziehen","5 Kopf kurz anheben, die Hand vom Knie unter den Kopf legen","6 Kopf überstrecken, Mund öffnen","7 Atmung laufend kontrollieren"],"s":"S. 24 bis 25, Unterricht","p":true,"n":"Muss für die Prüfung sitzen. Erzählen, was man gerade macht.","abc":"A"},{"id":"ssl03","t":"ssl","f":"Warum ziehst du das Knie bei der stabilen Seitenlage so weit wie möglich hoch?","a":["Sonst rollt die Person weiter und es wird eine Bauchlage daraus"],"s":"Unterricht","p":true,"abc":"A"},{"id":"ssl04","t":"ssl","f":"Die Person liegt in der stabilen Seitenlage. Was tust du jetzt?","a":["Atmung laufend kontrollieren, jede Minute","Hört sie auf zu atmen: Wiederbelebung","Basismaßnahmen, z. B. Wärme"],"s":"S. 24, Unterricht","p":true,"n":"Immer die Atmung kontrollieren, nicht dass sie aufhört zu atmen.","abc":"B"},{"id":"ssl05","t":"ssl","f":"Du bist allein, niemand kann helfen. Wann setzt du den Notruf ab, wenn die Person normal atmet?","a":["Spätestens nach der stabilen Seitenlage"],"s":"S. 24"},{"id":"wie01","t":"wie","f":"Woran erkennst du einen Atem-Kreislauf-Stillstand?","a":["Keine Reaktion auf Ansprechen und Rütteln","Keine oder keine normale Atmung"],"s":"S. 26","p":true,"abc":"B, C"},{"id":"wie02","t":"wie","f":"In welchem Verhältnis drückst und beatmest du?","a":["30 Herzdruckmassagen : 2 Beatmungen"],"s":"S. 26","p":true,"abc":"B, C"},{"id":"wie03","t":"wie","f":"Wie drückst du richtig?","a":["Harter Untergrund, Handballen auf die Brustmitte, zweite Hand darüber","Arme durchgestreckt, Oberkörper senkrecht darüber","Schnell und kräftig, nach jedem Druck ganz entlasten","Leitlinie: 5 bis 6 cm tief, 100 bis 120 pro Minute"],"s":"S. 26 bis 27","p":true,"abc":"B, C"},{"id":"wie04","t":"wie","f":"Du kannst oder willst nicht beatmen. Was dann?","a":["Ohne Pause durchdrücken","Beatmung nur, wenn du sie kannst, bei Fremden mit Beatmungstuch"],"s":"S. 26","abc":"B, C"},{"id":"wie05","t":"wie","f":"Wie lange führst du die Wiederbelebung durch?","a":["Bis die Person wieder normal atmet oder der Rettungsdienst übernimmt","Trainierte Helfer wechseln alle 2 Minuten"],"s":"S. 26","abc":"B, C"},{"id":"wie06","t":"wie","f":"Ein Passant ruft: „Hör auf, du brichst ihr die Rippen!“ Was tust du?","a":["Weiterdrücken","Eine Rippe heilt, eine unterlassene Herzdruckmassage führt zum Tod"],"s":"S. 26","abc":"B, C"},{"id":"def01","t":"def","f":"Was bewirkt ein Defibrillator, und was kann er nicht?","a":["Ein Stromstoß unterbricht das unkoordinierte Zucken des Herzens","Er ersetzt das Drücken und Beatmen nicht"],"s":"S. 28","abc":"C"},{"id":"def02","t":"def","f":"Ihr seid zu zweit und habt einen AED. Wer macht was?","a":["Einer drückt und beatmet ohne Pause weiter","Der andere schaltet ein, folgt den Anweisungen, klebt die Elektroden auf die nackte, trockene Brust"],"s":"S. 28 bis 29","abc":"C"},{"id":"def03","t":"def","f":"Wann hörst du beim AED auf zu drücken?","a":["Nur in der Analysephase und beim Schock","Dann berührt niemand die Person"],"s":"S. 28 bis 29","p":true,"n":"Bei der Analysephase nicht drücken.","abc":"C"},{"id":"def10","t":"def","f":"Die Person hat Kammerflimmern. Gibt der Defi einen Schock?","a":["Ja, bei Kammerflimmern immer","So ist die Situation in der Prüfung"],"s":"S. 29, Unterricht","p":true,"n":"Bei Herzkammerflimmern gibt der Defi immer Schock ab.","abc":"C"},{"id":"def11","t":"def","f":"Was ist eine Asystolie, und hilft der Defi?","a":["Gar kein Herzschlag, keine elektrische Aktivität (Nulllinie)","Der Defi gibt keinen Schock","Nur Drücken hilft"],"s":"S. 29, Unterricht","p":true,"n":"Wenn gar kein Herzschlag, dann hilft kein Defi (Asystolie).","abc":"C"},{"id":"def12","t":"def","f":"Welche Herzrhythmen sind schockbar, welche nicht?","a":["Schockbar: Kammerflimmern, pulslose ventrikuläre Tachykardie","Nicht schockbar: Asystolie, pulslose elektrische Aktivität"],"s":"nachgeschlagen","q":"e","abc":"C"},{"id":"def13","t":"def","f":"Wo klebst du die Elektroden bei Erwachsenen hin?","a":["Rechts oben unter dem Schlüsselbein, neben dem Brustbein","Links seitlich am Brustkorb, unter der Achsel"],"s":"Bild auf den Elektroden","q":"e","abc":"C"},{"id":"def06","t":"def","f":"Bei einem kleinen Kind ist vorne kein Platz für zwei Elektroden. Was tust du?","a":["Eine vorne in die Brustmitte, eine hinten zwischen die Schulterblätter","Kinder-Elektroden nehmen, wenn vorhanden"],"s":"S. 29, Unterricht","p":true,"n":"Bei kleinen Kindern vorne und hinten.","abc":"C"},{"id":"def04","t":"def","f":"Welche Sicherheitsregeln gelten beim AED?","a":["Nasse Brust abtrocknen","Starke Behaarung notfalls rasieren, Drücken hat Vorrang","Keine Nässe als Stromverbindung","Beim Schock berührt niemand die Person"],"s":"S. 28","abc":"C"},{"id":"ver01","t":"ver","f":"Woran unterscheidest du leichte und schwere Verlegung der Atemwege?","a":["Leicht: Person hustet kräftig, weiter husten lassen","Schwer: kann nicht atmen, sprechen oder husten, Lebensgefahr"],"s":"S. 30","p":true,"abc":"A, B"},{"id":"ver03","t":"ver","f":"Wie gehst du bei einer schweren Verlegung vor?","a":["Notruf veranlassen","Vorbeugen, stützen, bis 5 Schläge zwischen die Schulterblätter","Dann bis 5 Heimlich-Griffe","Im Wechsel wiederholen","Danach immer ins Krankenhaus"],"s":"S. 30 bis 31","p":true,"abc":"A, B"},{"id":"ver04","t":"ver","f":"Wie geht der Heimlich-Griff (Oberbauchkompression)?","a":["Hinter die Person, Arme um den Oberbauch","Faust zwischen Nabel und Brustkorb","Bis 5 Mal kräftig nach innen und oben ziehen"],"s":"S. 31","abc":"A, B"},{"id":"ver06","t":"ver","f":"Die Person mit dem Fremdkörper wird bewusstlos. Was jetzt?","a":["Atem-Kreislauf-Stillstand: sofort Wiederbelebung","Vor dem Beatmen sichtbare Fremdkörper aus dem Mund holen"],"s":"S. 30","abc":"A, B"},{"id":"blu01","t":"blu","f":"Woran erkennst du eine starke Blutung?","a":["Blut spritzt oder kommt im Schwall","Im Zweifel als stark behandeln"],"s":"S. 32","abc":"EE"},{"id":"blu02","t":"blu","f":"Welche zwei Möglichkeiten hast du, eine starke Blutung zu stillen?","a":["Manueller Druck: geht überall","Druckverband: nur an Armen und Beinen, Hände werden frei"],"s":"S. 32","p":true,"abc":"EE"},{"id":"blu03","t":"blu","f":"Welche drei Eigenschaften muss ein Druckkörper haben?","a":["Größer als die Wunde","Saugfähig","Passt sich der Körperform an"],"s":"S. 32","p":true,"n":"Kommt zur Prüfung.","abc":"EE"},{"id":"blu04","t":"blu","f":"Es blutet durch den Druckverband durch. Was tust du?","a":["Zusätzlich mit der Hand auf den Druckverband drücken"],"s":"S. 32","abc":"EE"},{"id":"blu06","t":"blu","f":"Was ist dein erster Schritt bei einer starken Blutung?","a":["Einmalhandschuhe anziehen","Die Person selbst fest auf die Wunde drücken lassen"],"s":"S. 32","abc":"EE"},{"id":"fall01","t":"reg","typ":"fall","f":"Im Park liegt ein Mann am Boden und reagiert nicht. Spiel den Notfallcheck durch.","a":["„Umgebung sicher.“","Rütteln: „Hallo, hallo, können Sie mich hören?“","Laut um Hilfe rufen, Aufgaben verteilen (Rettung, Defi, Verbandskasten)","Atemwege frei, Kopf überstrecken, max. 10 s Atmung prüfen","Atmet: stabile Seitenlage, laufend kontrollieren","Atmet nicht oder unsicher: 30 : 2, Defi"],"s":"S. 22 bis 27","p":true,"sicher":true},{"id":"fall02","t":"reg","typ":"fall","f":"Bei der Atemkontrolle hörst du alle paar Sekunden ein schnappendes Geräusch. Was tust du?","a":["Schnappatmung ist keine normale Atmung","Sofort Wiederbelebung, Defi holen lassen"],"s":"S. 24, S. 26","abc":"B","p":true,"sicher":true},{"id":"fall03","t":"ver","typ":"fall","f":"Im Restaurant greift sich eine Frau an den Hals, sie kann nicht sprechen und nicht husten. Was tust du?","a":["Schwere Verlegung: Notruf veranlassen","Bis 5 Rückenschläge, bis 5 Heimlich, im Wechsel","Wird sie bewusstlos: Wiederbelebung","Danach ins Krankenhaus"],"s":"S. 30 bis 31","p":true,"abc":"A, B"},{"id":"fall04","t":"def","typ":"fall","f":"Prüfungssituation: Du drückst, der AED analysiert un
