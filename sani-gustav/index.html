d meldet Kammerflimmern. Was passiert, was tust du?","a":["Während der Analyse: Hände weg","Bei Kammerflimmern gibt der Defi einen Schock: alle weg, Schock auslösen","Danach sofort weiterdrücken, Anweisungen folgen"],"s":"S. 28 bis 29","p":true,"abc":"C"},{"id":"fall05","t":"blu","typ":"fall","f":"Aus einer Wunde am Unterarm spritzt Blut, ein Verbandskoffer ist da. Was tust du?","a":["Handschuhe, Person selbst drücken lassen oder selbst drücken","Notruf veranlassen","Druckverband mit Druckkörper (größer, saugfähig, anschmiegsam)","Blutet es durch: zusätzlich drücken","Wärme, betreuen"],"s":"S. 32","p":true,"abc":"EE"},{"id":"fall06","t":"weg","typ":"fall","f":"Auf einer Landstraße liegt nach einem Unfall eine Person reglos auf der Fahrbahn. Was tust du zuerst?","a":["3 W: Warnblinker, Warnweste, Warndreieck","Selbstschutz prüfen","Person wegziehen: Arme hinter dem Kopf kreuzen, an den Handgelenken ziehen","Dann Notfallcheck"],"s":"S. 17, S. 20","abc":"SSS"},{"id":"fall07","t":"tel","typ":"fall","f":"Ein Kind hat aus einer Putzmittelflasche getrunken und ist ansprechbar. Wen rufst du an?","a":["Vergiftungsinformationszentrale +43 1 406 43 43","Bei Beschwerden oder Lebensgefahr: 144"],"s":"S. 17","p":true,"sicher":true},{"id":"fall08","t":"bas","typ":"fall","f":"Eine ältere Frau ist ansprechbar, aber sehr kurzatmig. Welche Basismaßnahmen setzt du?","a":["Vornübergebeugt sitzen lassen, Arme abstützen","Frische Luft, enge Kleidung lockern","Look, Listen, Link: beruhigen, zuhören","Notruf, wenn es ein Notfall ist"],"s":"S. 18 bis 19","p":true,"abc":"B"},{"id":"fall09","t":"abc","typ":"fall","f":"Du kommst als Sanitäter:in zu einer Person, die stark blutet und kaum ansprechbar ist. Woran hältst du dich?","a":["SSS: Szene, Sicherheit, Situation","EE: Erster Eindruck, Blutung sofort stillen","Dann A, B, C, D, E","Kritisch: Notarzt nachfordern"],"s":"S. 16","p":true,"abc":"alle","sicher":true},{"id":"fall10","t":"not","typ":"fall","f":"Ein Lkw mit orangefarbener Warntafel ist umgekippt, Flüssigkeit läuft aus, der Fahrer sitzt im Führerhaus. Was tust du?","a":["GAMS: Gefahr erkennen, im Zweifel die größte annehmen","Absperren, Abstand halten, nicht hineinlaufen","Den Fahrer nur retten, wenn es ohne Eigengefährdung geht","Spezialkräfte über den Notruf nachfordern, Nummern der Warntafel durchgeben"],"s":"S. 17, nachgeschlagen","q":"e","abc":"SSS","p":true,"sicher":true},{"id":"fall11","t":"bas","typ":"fall","f":"Ein Mann krümmt sich vor Bauchschmerzen, ein anderer ist blass und ihm ist schwindlig. Wie lagerst du die beiden?","a":["Bauchschmerzen: Beine zum Bauch anziehen","Kreislaufprobleme: Rückenlage, Beine angewinkelt hoch (L-Form)"],"s":"Unterricht","p":true,"abc":"C"},{"id":"wor01","t":"wor","f":"Was ist eine Indikation?","a":["Grund für ein bestimmtes diagnostisches oder therapeutisches Verfahren","Einfach: etwas, das auf eine Maßnahme hinweist, spricht dafür"],"s":"Blatt Medizinische Begriffe S. 1, Wiederholung 11.11.","p":true},{"id":"wor02","t":"wor","f":"Was ist eine Kontraindikation?","a":["Umstand, der eine Maßnahme verbietet, obwohl sie an sich angezeigt wäre","Einfach: es tritt etwas auf, das zeigt, dass du die Maßnahme nicht machen kannst"],"s":"Blatt Medizinische Begriffe S. 2, Wiederholung 11.11.","p":true},{"id":"mbabdomena","t":"wor","f":"Was bedeutet Abdomen?","a":["Bauch, Unterleib"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbaborta","t":"wor","f":"Was bedeutet Abort?","a":["Fehlgeburt"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbanamnesea","t":"wor","f":"Was bedeutet Anamnese?","a":["Systematische Erfragung von potenziell medizinisch relevanten Informationen"],"s":"Blatt Medizinische Begriffe S. 1","abc":"E","p":true},{"id":"mbanginapectorisa","t":"wor","f":"Was bedeutet Angina Pectoris?","a":["Brustenge, Herzenge"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbarrhythmiea","t":"wor","f":"Was bedeutet Arrhythmie?","a":["Unregelmäßigkeit der elektrischen Herztätigkeit"],"s":"Blatt Medizinische Begriffe S. 1","abc":"C","p":true},{"id":"mbarteriena","t":"wor","f":"Was bedeutet Arterien?","a":["Vom Herz wegführende Blutgefäße"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbaspirationa","t":"wor","f":"Was bedeutet Aspiration?","a":["Eindringen flüssiger oder fester Stoffe in die Atemwege"],"s":"Blatt Medizinische Begriffe S. 1","abc":"A","p":true},{"id":"mbasystoliea","t":"wor","f":"Was bedeutet Asystolie?","a":["Form des Herz-Kreislauf-Stillstands durch fehlende Kontraktion des Herzens"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbatriuma","t":"wor","f":"Was bedeutet Atrium?","a":["Vorhof (Herz)"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbbradykardiea","t":"wor","f":"Was bedeutet Bradykardie?","a":["Herzrhythmusstörung mit niedriger Herzfrequenz (Erwachsene unter 60/min)"],"s":"Blatt Medizinische Begriffe S. 1","abc":"C","p":true},{"id":"mbbronchiolena","t":"wor","f":"Was bedeutet Bronchiolen?","a":["Feine Verzweigungen der Bronchien"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbdehydrationa","t":"wor","f":"Was bedeutet Dehydration?","a":["Abnahme des Körperwassers"],"s":"Blatt Medizinische Begriffe S. 1","abc":"C","p":true},{"id":"mbdiabetesmellitusa","t":"wor","f":"Was bedeutet Diabetes mellitus?","a":["Zuckerkrankheit (umgangssprachlich)"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbdiastolea","t":"wor","f":"Was bedeutet Diastole?","a":["Erschlaffungs- und Füllungsphase des Herzens"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbepistaxisa","t":"wor","f":"Was bedeutet Epistaxis?","a":["Nasenbluten"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbexitusa","t":"wor","f":"Was bedeutet Exitus?","a":["Tod"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbfontanellena","t":"wor","f":"Was bedeutet Fontanellen?","a":["Durch Bindegewebe überbrückte Knochenspalten am kindlichen Schädel"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbfraktura","t":"wor","f":"Was bedeutet Fraktur?","a":["Knochenbruch"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbhypertoniea","t":"wor","f":"Was bedeutet Hypertonie?","a":["Bluthochdruck"],"s":"Blatt Medizinische Begriffe S. 1","abc":"C","p":true},{"id":"mbinfarkta","t":"wor","f":"Was bedeutet Infarkt?","a":["Absterben von Gewebe"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbinhalationa","t":"wor","f":"Was bedeutet Inhalation?","a":["Einatmung (Aufnahme von Gasen, Dämpfen usw.)"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbinkubationszeita","t":"wor","f":"Was bedeutet Inkubationszeit?","a":["Zeit zwischen Ansteckung und dem Auftreten der ersten Symptome der Infektionskrankheit"],"s":"Blatt Medizinische Begriffe S. 1","p":true},{"id":"mbinsuffizienza","t":"wor","f":"Was bedeutet Insuffizienz?","a":["Schwäche, ungenügende Leistung eines Organs oder Organsystems"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbinsulta","t":"wor","f":"Was bedeutet Insult?","a":["Schlaganfall"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbintubationa","t":"wor","f":"Was bedeutet Intubation?","a":["Einführen eines Kunststoffschlauchs durch Mund oder Nase in die Luftröhre"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbkardiala","t":"wor","f":"Was bedeutet kardial?","a":["Das Herz betreffend, vom Herz ausgehend"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mblarynxa","t":"wor","f":"Was bedeutet Larynx?","a":["Kehlkopf"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbluxationa","t":"wor","f":"Was bedeutet Luxation?","a":["Verrenkung"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbmyokarda","t":"wor","f":"Was bedeutet Myokard?","a":["Muskuläre Wand des Herzens"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbodema","t":"wor","f":"Was bedeutet Ödem?","a":["Flüssigkeitsansammlung in den Gewebespalten (z. B. Beinödem, Lungenödem)"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbpneumoniea","t":"wor","f":"Was bedeutet Pneumonie?","a":["Entzündung der Lunge"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbprophylaxea","t":"wor","f":"Was bedeutet Prophylaxe?","a":["Verhütung von Krankheiten, Vorbeugung"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbpulmonala","t":"wor","f":"Was bedeutet pulmonal?","a":["Die Lunge betreffend"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbruptura","t":"wor","f":"Was bedeutet Ruptur?","a":["Zerreißung, Durchbruch"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbsekreta","t":"wor","f":"Was bedeutet Sekret?","a":["Absonderungsprodukt von Zellen bzw. Drüsen"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbsepsisa","t":"wor","f":"Was bedeutet Sepsis?","a":["Blutvergiftung (umgangssprachlich)"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbsterila","t":"wor","f":"Was bedeutet steril?","a":["Keimfrei, sterilisiert"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbstridora","t":"wor","f":"Was bedeutet Stridor?","a":["Pfeifendes Ein- oder Ausatemgeräusch"],"s":"Blatt Medizinische Begriffe S. 2","abc":"B","p":true},{"id":"mbsystolea","t":"wor","f":"Was bedeutet Systole?","a":["Kontraktions- und Ausströmungsphase des Herzens"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbtachykardiea","t":"wor","f":"Was bedeutet Tachykardie?","a":["Herzrhythmusstörung mit erhöhter Herzfrequenz (Erwachsene über 100/min)"],"s":"Blatt Medizinische Begriffe S. 2","abc":"C","p":true},{"id":"mbthoraxa","t":"wor","f":"Was bedeutet Thorax?","a":["Brustkorb"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbtonusa","t":"wor","f":"Was bedeutet Tonus?","a":["Grad der Anspannung eines Organs oder Organteils (z. B. Muskulatur, Gefäße)"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbtoxinea","t":"wor","f":"Was bedeutet Toxine?","a":["Giftstoffe"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbtracheaa","t":"wor","f":"Was bedeutet Trachea?","a":["Luftröhre"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbuterusa","t":"wor","f":"Was bedeutet Uterus?","a":["Gebärmutter"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbvenena","t":"wor","f":"Was bedeutet Venen?","a":["Zum Herz hinführende Blutgefäße"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbzerebrala","t":"wor","f":"Was bedeutet zerebral?","a":["Das Gehirn betreffend"],"s":"Blatt Medizinische Begriffe S. 2","p":true},{"id":"mbzyanosea","t":"wor","f":"Was bedeutet Zyanose?","a":["Blaurote Färbung von Haut und Schleimhäuten infolge einer Abnahme des Sauerstoffgehalts im Blut"],"s":"Blatt Medizinische Begriffe S. 2","abc":"B","p":true},{"id":"abc14","t":"abc","f":"Was gehört zum Ersten Eindruck (EE)?","a":["Bewusstsein nach AVPU","MILS bei Verdacht auf Wirbelsäulenverletzung","Starke Blutung sofort stillen, z. B. Druckverband an den Extremitäten"],"s":"S. 104 bis 116, Mitschrift 10.11.","p":true,"abc":"EE","n":"Laut Unterricht sehr wichtig.","sicher":true},{"id":"abc15","t":"abc","f":"Wofür steht MILS und wann brauchst du sie?","a":["Manuelle Inline-Stabilisierung","Bei Verdacht auf Wirbelsäulenverletzung","Den Ablauf aus der Mappe können, prüfungsrelevant"],"s":"Mitschrift 10.11., Wiederholung 11.11.","p":true,"n":"Ablauf steht in der Mappe, kommt nach dem Scan auf diese Karte.","abc":"EE","sicher":true},{"id":"abc46","t":"abc","f":"Wann legst du keine Halskrause (HWS-Schiene) an?","a":["Wenn die Person ohnmächtig ist"],"s":"Wiederholung 11.11.","p":true,"abc":"EE","sicher":true},{"id":"wor06","t":"abc","f":"Wofür steht HWS, und was ist eine HWS-Schiene?","a":["HWS: Halswirbelsäule","HWS-Schiene: Halskrause"],"s":"Wiederholung 11.11.","abc":"EE"},{"id":"abc16","t":"abc","f":"A: Was schaust du dir an?","a":["In den Mund schauen","Besonders bei Geräuschen und bei Bewusstlosen"],"s":"Wiederholung 11.11., Mitschrift 10.11.","p":true,"abc":"A","sicher":true},{"id":"abc17","t":"abc","f":"Prüfungsfrage: Welche Möglichkeiten gibt es, die Atemwege freizumachen und freizuhalten?","a":["Aus dem Unterricht: Heimlich, Schläge zwischen die Schulterblätter, stabile Seitenlage, Kopf überstrecken (Säugling Schnüffelposition), Helmabnahme bei Verkehrsunfall","Vorher immer in den Mund schauen, bei Bedarf absaugen (Absauger -0,8, Säugling höchstens -0,2)","Ergänzend nachgeschlagen: Esmarch-Handgriff, Guedel-Tubus. Den Wendl-Tubus müsst ihr nicht können"],"s":"Mitschriften, Ergänzung nachgeschlagen","p":true,"abc":"A","sicher":true},{"id":"abc47","t":"abc","f":"Auf welche Stufe stellst du den Absauger?","a":["Immer -0,8","Bei Säuglingen höchstens -0,2"],"s":"Wiederholung 11.11.","p":true,"abc":"A","sicher":true},{"id":"abc18","t":"abc","f":"B: Was schaust du dir an?","a":["Atemfrequenz (Erwachsene 12 bis 16 pro Minute)","Sauerstoffsättigung mit dem Pulsoxymeter","Haut: Zyanose (Blaufärbung)","Fragen, ob die Person genug Luft bekommt","Krankhafte (pathologische) Atemgeräusche","Verlegt: 5 Rückenschläge, 5 Heimlich"],"s":"Wiederholung 11.11., Mitschrift 10.11.","p":true,"abc":"B","sicher":true},{"id":"abc19","t":"abc","f":"C: Was schaust du dir an?","a":["Puls: schnell oder langsam, rhythmisch, stark oder schwach","Blutdruck auf zwei Arten: palpatorisch und auskultatorisch","Bei Verdacht auf Trauma die großen Blutgefäße und Blutungsräume","EKG","Haut: grau, blau, rot, schweißig, stehende Hautfalten (Dehydration)","An der Hand: Puls, Rekapillarisierungszeit, Hautfalten"],"s":"Wiederholung 11.11., Mitschrift 10.11.","p":true,"abc":"C","sicher":true},{"id":"abc20","t":"abc","f":"Nenne die vier großen Blutungsräume.","a":["Brustkorb (Thorax)","Bauchraum (Abdomen), wird bei Blutung steinhart","Becken und Leiste: nicht anfassen, nur schauen, Hämatome sichtbar","Oberschenkel"],"s":"S. 104 bis 116, Mitschriften 10. und 11.11.","p":true,"abc":"C","n":"Laut Unterricht sehr wichtig.","sicher":true},{"id":"abc21","t":"abc","f":"Warum tastest du Becken und Leiste bei Verdacht auf Blutung nicht ab?","a":["Gefahr, es zu verschlimmern","Nur schauen"],"s":"S. 104 bis 116, Mitschrift 10.11.","abc":"C","p":true,"n":"Laut Unterricht sehr wichtig.","sicher":true},{"id":"abc22","t":"abc","f":"D: Welche Symptome deuten auf ein D-Problem hin?","a":["Schwindel, Kopfschmerzen","Sehen eingeschränkt, Hören","Gleichgewicht","Sprechstörung","Motorik"],"s":"Mitschrift 10.11.","abc":"D","p":true,"sicher":true},{"id":"abc23","t":"abc","f":"D: Was schaust du dir an?","a":["Blutzucker","ZOPS","FAST","Motorik und Sensibilität","Schmerzskala NRS 1 bis 10","Pupillen, Brille runter"],"s":"Wiederholung 11.11., Mitschrift 10.11.","p":true,"abc":"D","sicher":true},{"id":"abc24","t":"abc","f":"Wofür steht ZOPS, und was fragst du?","a":["Z Zeit: Welcher Tag ist heute, wie spät ist es?","O Ort: Wo sind wir gerade?","P Person: Wie heißen Sie?","S Situation: Was ist passiert?"],"s":"S. 112, Mitschriften 10. und 11.11.","p":true,"abc":"D","n":"Laut Unterricht sehr wichtig.","sicher":true},{"id":"abc25","t":"abc","f":"Wofür steht FAST?","a":["F Face: Kann die Person lächeln, hängt eine Gesichtshälfte?","A Arms: Kann sie beide Arme heben (auch Beine)?","S Speech: Kann sie einen Satz sprechen, z. B. „Die Mutter bringt dem Kind ein Glas Wasser zum Trinken“?","T Time: Seit wann bestehen die Symptome? Schnell handeln"],"s":"S. 112, Mitschriften 10. und 11.11.","p":true,"n":"Test auf Schlaganfall Laut Unterricht sehr wichtig.","abc":"D","sicher":true},{"id":"abc26","t":"abc","f":"Wie prüfst du Motorik und Sensibilität (MS)?","a":["Beide Arme gerade hoch, Augen zu, sinkt ein Arm ab?","Nimmt die Person Reize wahr, z. B. über die Hand streichen","Zeigt Teillähmungen"],"s":"Mitschrift 10.11.","abc":"D","p":true,"sicher":true},{"id":"abc27","t":"abc","f":"Was ist die NRS, und ab wann wird es kritisch?","a":["Schmerzskala von 0 bis 10","0 keine Schmerzen, 10 so schlimm wie nie","Ab 7 bis 8 starke Schmerzen, eventuell Notarzt für Schmerzmittel"],"s":"Mitschriften 10. und 11.11.","abc":"D","p":true,"sicher":true},{"id":"abc37","t":"abc","f":"Woran erkennst du Schmerzen an den Messwerten?","a":["Erhöhte Herzfrequenz","Erhöhter Blutdruck"],"s":"Wiederholung 11.11.","p":true,"abc":"D","sicher":true},{"id":"abc38","t":"abc","f":"Du forderst den Notarzt nach. Was sagst du per Funk?","a":["„Leitstelle von 20 202, kommen!“","Zuerst wen du rufst, dann von wem","20 ist der Bezirk Stadt Salzburg, 202 die Nummer des Autos","Davor stünde die 5 fürs Bundesland Salzburg, die sagt man meist nicht"],"s":"Wiederholung 11.11., Mitschrift 2","p":true},{"id":"abc39","t":"abc","f":"Was ist der Unterschied zwischen manueller und apparativer Beurteilung?","a":["Manuell: ohne Geräte, nach ABCDE (Band S. 104)","Apparativ: mit Geräten, also Pulsoxymeter, Blutzucker, Blutdruck, Temperatur, EKG (S. 117 bis 128)"],"s":"Mitschrift 2","p":true,"abc":"alle","sicher":true},{"id":"abc40","t":"abc","f":"B: Wie zählst du die Atemfrequenz, und was sagt sie dir?","a":["Am Brustkorb (Rippen) fühlen","Nur Ein- oder nur Ausatmung zählen","Heben sich beide Seiten? Tief oder flach?","Zu schnell (Hyperventilation, Atemnot): Hinweis auf Krankheit oder Vergiftung","Normwerte im Band S. 106"],"s":"Mitschrift 2","p":true,"abc":"B","sicher":true},{"id":"abc41","t":"abc","f":"Welche Maßnahmen setzt du bei A, B und C?","a":["A: Heimlich, Rückenschläge, stabile Seitenlage, Kopf überstrecken, Helmabnahme bei Verkehrsunfall","B: Beatmung oder Wiederbelebung, Kopf überstrecken, stabile Seitenlage wenn Atmung, Oberkörper hoch, frische Luft, enge Kleidung öffnen, Sauerstoff mit Maske oder Nasenbrille, Beutel-Masken-Beatmung, wenn keine eigene Atmung","C: Beine hoch, Wärmeerhalt, Wiederbelebung, bei Diabetes Über- oder Unterzucker prüfen"],"s":"Mitschrift 2","p":true,"abc":"A, B, C","sicher":true},{"id":"abc49","t":"abc","f":"B: Welche Maßnahmen setzt du?","a":["Frische Luft, beengende Kleidung öffnen","Entscheiden, ob die Person selbst atmen kann","Atmet sie nicht mehr selbst: Beutel-Masken-Beatmung oder Tubus","Atmet sie nur sporadisch oder schwer oder SpO2 unter 90 %: Sauerstoff mit Maske oder Nasenbrille"],"s":"Unterricht 12.11.","p":true,"abc":"B","sicher":true},{"id":"abc50","t":"abc","f":"Wann gibst du Sauerstoff, womit, und wie viel höchstens?","a":["Wenn die Person nur sporadisch oder schwer atmet","Wenn der Sauerstoffwert (SpO2) zu niedrig ist, unter 90 %","Bei Zyanose sofort, auch ohne vorher zu messen","Mit Maske oder Nasenbrille, höchstens 15 l pro Minute","Bei 94 % auf 6 bis 8 l pro Minute reduzieren"],"s":"Unterricht 12.11.","p":true,"abc":"B","sicher":true},{"id":"abc51","t":"abc","f":"Die Person atmet nicht mehr selbst. Wie beatmest du?","a":["Beutel-Masken-Beatmung","Oder Tubus"],"s":"Unterricht 12.11.","p":true,"abc":"B","sicher":true},{"id":"abc52","t":"abc","f":"Der Sauerstoffwert (SpO2) hat 94 % erreicht. Was machst du mit dem Sauerstoff?","a":["Auf 6 bis 8 l pro Minute reduzieren","Vorher höchstens 15 l pro Minute","Bei COPD ist der Zielwert 90 % statt 94 %"],"s":"Unterricht 12.11.","p":true,"abc":"B","sicher":true},{"id":"abc53","t":"abc","f":"Die Person hat COPD. Welcher Sauerstoffwert (SpO2) ist das Ziel, und warum?","a":["90 % statt 94 %","COPD ist eine chronische Krankheit, die die Lunge beeinträchtigt","Eine ordentliche Sättigung ist ohnehin nicht mehr möglich"],"s":"Unterricht 12.11.","p":true,"abc":"B","sicher":true},{"id":"fall14","t":"abc","typ":"fall","f":"Eine Person atmet sehr schnell und ist im Gesicht blau. Was machst du bei B?","a":["Zyanose: sofort Sauerstoff, auch ohne vorher zu messen","Mit Maske oder Nasenbrille, höchstens 15 l pro Minute, ab 94 % auf 6 bis 8 l reduzieren","Frische Luft, beengende Kleidung öffnen","Der Sauerstoffwert (SpO2) liegt dann meist unter 90 %"],"s":"Unterricht 12.11.","p":true,"abc":"B","sicher":true},{"id":"abc42","t":"abc","f":"Wo kannst du den Puls tasten, und worauf achtest du?","a":["Handgelenk, Oberarm (Bizeps), Leiste, Halsschlagader, Fußrücken, Sprunggelenk","Schnell oder langsam, regelmäßig oder unregelmäßig, stark oder schwach"],"s":"Mitschriften 10. und 11.11.","p":true,"abc":"C","sicher":true},{"id":"abc43","t":"abc","f":"Wie prüfst du die Rekapillarisierungszeit?","a":["Fingernagel drücken, er wird weiß","Loslassen: nach höchstens 2 Sekunden wieder durchblutet"],"s":"Mitschrift 2","p":true,"abc":"C","sicher":true},{"id":"abc44","t":"abc","f":"Was ist DMS?","a":["Durchblutung (Rekap), Motorik, Sensibilität","Also Motorik und Sensibilität plus Rekapillarisierung"],"s":"Mitschrift 2","n":"In der Mitschrift als MDS.","abc":"D","p":true,"sicher":true},{"id":"abc45","t":"abc","f":"Nenne Notarztindikationen.","a":["Rauchgasentwicklung","Bewusstlosigkeit","Lähmungen","Dazu: fehlende Schutzreflexe, Kreislauf instabil, Krampfanfälle, starke Schmerzen ab NRS 7 bis 8"],"s":"Mitschriften 10. und 11.11.","p":true},{"id":"abc28","t":"abc","f":"Wofür steht SAMPLER?","a":["S Symptome, z. B. Schmerzen","A Allergien","M Medikamente: Werden welche genommen?","P Patientengeschichte: Schon mal solche Probleme?","L Letzte Nahrungsaufnahme, Stuhlgang, Medikamenteneinnahme","E Ereignis: Was hat das Problem ausgelöst?","R Risikofaktoren: familiäre Veranlagung, Schwangerschaft, Drogen"],"s":"S. 104 bis 116, Mitschriften 10. und 11.11.","p":true,"abc":"E","n":"Laut Unterricht wichtig.","sicher":true},{"id":"abc29","t":"abc","f":"Was ist „10 für 10“, und wann machst du es?","a":["Kurze Besprechung und Absprache im Team","Bei Stress und zum Koordinieren","Gehört zu E","Nachgeschlagen: 10 Sekunden innehalten, um die nächsten 10 Minuten zu planen"],"s":"S. 79 bis 88, Mitschrift 10.11.","abc":"E","p":true,"n":"Laut Unterricht besonders wichtig.","sicher":true},{"id":"abc30","t":"abc","f":"E: Was schaust du dir an?","a":["Ins Ohr leuchten, vor allem bei Trauma","Stufenbildung am Kopf","SAMPLER, Anamnese durch Fragen","Werte nachmessen, die noch fehlen","Temperatur","Ganzkörperuntersuchung nur bei Trauma oder spezifischen Hinweisen"],"s":"Wiederholung 11.11., Mitschrift 10.11.","p":true,"abc":"E","sicher":true},{"id":"abc31","t":"abc","f":"Wann musst du den Blutzucker messen?","a":["Bei Diabetiker:innen","Bei Bewusstlosen","Bei D-Symptomen: Schwindel, Zittern, kalter Schweiß, Schläfrigkeit, Unruhe, Verwirrtheit, Sehstörungen"],"s":"Wiederholung 11.11.","p":true,"abc":"D","sicher":true},{"id":"abc32","t":"abc","f":"Was prüfst du an der Hand auf einen Blick?","a":["Puls","Rekapillarisierungszeit","Stehende Hautfalten (Dehydration)"],"s":"Wiederholung 11.11.","abc":"C","p":true,"sicher":true},{"id":"abc33","t":"abc","f":"Warum leuchtest du bei E ins Ohr?","a":["Vor allem bei Trauma","Blut oder Gehirnflüssigkeit im Ohr deutet auf eine Kopfverletzung"],"s":"Wiederholung 11.11.","p":true,"abc":"E","sicher":true},{"id":"abc34","t":"abc","f":"Was bedeutet Stufenbildung am Kopf?","a":["Der Kopf hat eine andere Form","Schlechtes Outcome, hohe Letalität"],"s":"Wiederholung 11.11.","p":true,"abc":"E","sicher":true},{"id":"abc35","t":"abc","f":"Worauf achtest du bei den Pupillen?","a":["Brille runter","Gleich groß?","Lichtreflex","Entrundet?"],"s":"Wiederholung 11.11., Mitschriften 10. und 11.11.","p":true,"abc":"D","sicher":true},{"id":"ver07","t":"ver","f":"Was ist eine Oberbauchkompression?","a":["Der Heimlich-Griff (Heimlich-Manöver)"],"s":"Wiederholung 11.11.","abc":"A, B"},{"id":"ver08","t":"ver","f":"Fremdkörper beim Säugling: Was ist anders als beim Erwachsenen?","a":["Kein Heimlich, keine Oberbauchkompression (Verletzungsgefahr für die Bauchorgane)","Bäuchlings auf den Unterarm, Kopf tiefer als der Körper, Kopf am Kiefer stützen","Bis 5 Schläge mit dem Handballen zwischen die Schulterblätter","Umdrehen, Rücken auf dem Unterarm, Kopf tief, bis 5 Brustkorbkompressionen mit zwei Fingern auf dem unteren Brustbein","Im Wechsel wiederholen, bewusstlos: Wiederbelebung","Kinder ab 1 Jahr wie Erwachsene, mit Heimlich"],"s":"nachgeschlagen, mit Band abgleichen","q":"e","abc":"A, B"},{"id":"ssl06","t":"ssl","f":"Wie lagerst du einen bewusstlosen Säugling, der normal atmet?","a":["Statt stabiler Seitenlage auf den Unterarm legen","Kopf neutral (Schnüffelposition), nicht überstrecken","Atmung laufend kontrollieren"],"s":"Wiederholung 11.11.","abc":"A","p":true},{"id":"nw01","t":"nw","f":"Normalwerte Erwachsene: Atemfrequenz, Puls, Blutzucker?","a":["Atemfrequenz 12 bis 16 pro Minute","Puls 60 bis 80 pro Minute","Blutzucker 60 bis 100 mg/dl"],"s":"Mitschrift 10.11.","p":true,"abc":"B, C, D","sicher":true},{"id":"nw02","t":"nw","f":"Ab wann ist es kritisch: Blutdruck, Blutzucker, SpO2, Temperatur?","a":["Blutdruck unter 90 oder über 200 mmHg","Blutzucker unter 40 oder über 300 mg/dl","SpO2 unter 90 %","Temperatur über 39 Grad"],"s":"Mitschrift 10.11.","p":true,"abc":"B, C, D, E"},{"id":"nw03","t":"nw","f":"Welcher Wert ist das? 1 12 bis 16 pro Minute, 2 60 bis 80 pro Minute, 3 60 bis 100 mg/dl, 4 höchstens 2 Sekunden","a":["1 Atemfrequenz","2 Puls","3 Blutzucker normal","4 Rekapillarisierungszeit"],"s":"Mitschrift 10.11.","p":true,"abc":"B, C, D","sicher":true},{"id":"nw04","t":"nw","f":"Welcher Wert ist kritisch? 1 unter 90 oder über 200 mmHg, 2 unter 40 oder über 300 mg/dl, 3 unter 90 %, 4 über 39 Grad, 5 ab 7 bis 8 von 10","a":["1 Blutdruck","2 Blutzucker","3 SpO2","4 Temperatur","5 Schmerz (NRS)"],"s":"Mitschrift 10.11.","p":true,"abc":"B, C, D, E"},{"id":"rr01","t":"rr","f":"Wofür steht RR?","a":["Riva-Rocci, Abkürzung für Blutdruck"],"s":"Mitschrift 10.11.","p":true,"abc":"C"},{"id":"rr02","t":"rr","f":"Wann misst du palpatorisch, und wie geht es?","a":["Bei Lärm oder wenn es schnell gehen muss","Aufpumpen, bis kein Puls mehr","Luft ablassen, bis der Puls wieder da ist","Gibt nur den systolischen Wert"],"s":"Mitschriften 10. und 11.11.","p":true,"abc":"C","sicher":true,"erg":"Palpatorisch heißt durch Tasten. Manschette am Oberarm, Puls am Handgelenk derselben Seite tasten. Den unteren Wert spürst du nicht, weil der Puls ab dem oberen Wert einfach tastbar bleibt."},{"id":"rr03","t":"rr","f":"Wie misst du auskultatorisch?","a":["Aufpumpen, bis kein Puls mehr","Stethoskop in die Ellenbeuge","Luft ablassen bis zum ersten Geräusch: systolisch (oberer Wert)","Weiter ablassen, bis kein Geräusch mehr: diastolisch (unterer Wert)"],"s":"Mitschrift 10.11.","p":true,"abc":"C","sicher":true,"erg":"Auskultatorisch heißt durch Abhören, hier mit dem Stethoskop."},{"id":"rr04","t":"rr","f":"Was hörst du beim Blutdruckmessen?","a":["Flussgeräusche des Blutes","Die Manschette schneidet den Fluss ab, beim Ablassen fließt das Blut wieder"],"s":"Mitschrift 10.11.","abc":"C"},{"id":"rr05","t":"rr","f":"Worauf achtest du beim Anlegen und Pumpen?","a":["Kabel der Manschette hinten","Schlauch gut angeschlossen","Ablassschraube beim Pumpen zu","Stethoskop je nach Lochposition drehen"],"s":"Mitschrift 10.11.","abc":"C"},{"id":"rr06","t":"rr","f":"Wofür steht mmHg?","a":["Millimeter Quecksilbersäule, Einheit für Druck"],"s":"Mitschrift 10.11.","abc":"C"},{"id":"rr07","t":"rr","f":"Welche zwei Arten der Blutdruckmessung gibt es?","a":["Palpatorisch: Puls tasten, schnell, bei Lärm, nur systolischer Wert","Auskultatorisch: mit dem Stethoskop hören, genauer, systolisch und diastolisch"],"s":"Wiederholung 11.11., Mitschrift 2","p":true,"n":"Kommt zur Prüfung.","abc":"C","sicher":true},{"id":"bz01","t":"bz","f":"Was ist Hyperglykämie, was Hypoglykämie?","a":["Hyperglykämie: Überzucker, entsteht über Stunden bis Tage","Hypoglykämie: Unterzucker, kommt plötzlich, akut gefährlich"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz02","t":"bz","f":"Wann misst du im ABCDE-Schema den Blutzucker?","a":["Bei D, Pflicht bei Diabetiker:innen, Bewusstlosen und D-Symptomen","Verdacht kann schon bei C entstehen (Herzrasen, Zittern)","Sonst bei E im Rahmen von SAMPLER"],"s":"Wiederholung 11.11., Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz03","t":"bz","f":"Woran erkennst du Überzucker?","a":["Starker Durst, trockener Mund, häufiger Harndrang","Müdigkeit, Konzentrationsschwäche","Übelkeit, Bauchschmerzen, Erbrechen","Atem riecht nach Aceton (fauler Apfel)","Trockene, warme Haut"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz04","t":"bz","f":"Woran erkennst du Unterzucker?","a":["Zittern, kalter Schweiß, Blässe","Heißhunger, Herzrasen, Unruhe","Schwindel, Verwirrtheit, Sprach- oder Sehstörung","Feuchte, kalte Haut"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz05","t":"bz","f":"Hyper oder Hypo? 1 feuchte kalte Haut, Zittern, Heißhunger. 2 trockene warme Haut, Übelkeit, Atem nach Aceton.","a":["1 Hypoglykämie (Unterzucker)","2 Hyperglykämie (Überzucker)"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz06","t":"bz","f":"Nenne Ursachen für Über- und Unterzucker.","a":["Über: Therapie- oder Medikationsfehler, Infekte, Stress und Hormone, Ernährung","Unter: zu viel Insulin oder Antidiabetika, körperliche Aktivität, Alkohol, Ernährung"],"s":"Mitschrift 10.11.","abc":"D"},{"id":"bz07","t":"bz","f":"Was tust du bei Überzucker, was bei Unterzucker?","a":["Über: Wasser trinken lassen (nur bei vollem Bewusstsein), kein Insulin geben, schnell ins Krankenhaus","Unter: Zuckerhaltiges geben, z. B. Traubenzucker oder süße Getränke"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz08","t":"bz","f":"Wann brauchst du bei Über- oder Unterzucker den Notarzt?","a":["Fehlende Schutzreflexe","Kreislauf instabil","Krampfanfälle"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz09","t":"bz","f":"Was ist in der Blutzuckertasche?","a":["Gerät, Teststreifen","Nadel und Stechhilfe","Pflaster, Abwischtuch"],"s":"Mitschrift 10.11.","abc":"D"},{"id":"bz10","t":"bz","f":"Wie misst du den Blutzucker? Erzähl den Ablauf.","a":["Zustimmung holen, eigene Hände desinfizieren","Nicht dominante Hand, nicht Daumen oder Zeigefinger","Finger reinigen, mindestens 30 Sekunden trocknen lassen","Gerät vorbereiten, Nadelstufe wählen, lila Schutz abdrehen, Stich mit dem Knopf oben","Ersten Tropfen abwischen","Streifen ganz ins Gerät, Blut mit der Oberkante aufsaugen","Wert ablesen, alles mit Blut entsorgen, Pflaster"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"bz11","t":"bz","f":"Warum wischst du den ersten Blutstropfen ab?","a":["Er verfälscht den Wert"],"s":"Mitschrift 10.11.","abc":"D"},{"id":"bz12","t":"bz","f":"Welche Blutzuckerwerte sind normal, welche ein Warnsignal?","a":["Normal 60 bis 100 mg/dl (kurz nach viel Zucker auch höher)","Warnsignal unter 40 oder über 300 mg/dl"],"s":"Mitschrift 10.11.","p":true,"abc":"D"},{"id":"spo06","t":"spo","f":"Was ist SpO2?","a":["Der Sauerstoffwert","Wie viel Prozent des Blutfarbstoffs (Hämoglobin) mit Sauerstoff beladen sind","Gemessen mit dem Pulsoxymeter, kritisch unter 90 %"],"s":"Unterricht 12.11.","p":true,"abc":"B"},{"id":"spo01","t":"spo","f":"Was misst das Pulsoxymeter, und wie?","a":["Sauerstoffsättigung im Kapillarblut (SpO2)","Der Sauerstoff ist ans Hämoglobin gebunden","Mit rotem und infrarotem Licht, bei jedem Puls"],"s":"Mitschriften 10. und 11.11.","p":true,"abc":"B","sicher":true},{"id":"spo02","t":"spo","f":"Ab welchem SpO2 wird es kritisch?","a":["Unter 90 %"],"s":"Mitschrift 10.11.","p":true,"abc":"B"},{"id":"spo03","t":"spo","f":"Was verfälscht den SpO2-Wert?","a":["Kalte Finger, Unterkühlung, Schock (schlechte Durchblutung)","Nagellack oder Schmutz: entfernen oder Gerät um 90 Grad drehen","Kohlenmonoxidvergiftung: Gerät unterscheidet CO und O2 nicht","Reden oder Bewegung: Kurve schwankt"],"s":"Mitschrift 10.11.","p":true,"abc":"B"},{"id":"spo04","t":"spo","f":"Wo im ABCDE-Schema setzt du das Pulsoxymeter ein?","a":["Am ehesten bei B","Sonst bei E"],"s":"Mitschrift 10.11.","abc":"B"},{"id":"spo05","t":"spo","f":"Warum fühlst du trotz Pulsoxymeter selbst den Puls?","a":["Den Puls vom Gerät nicht verwenden","Nur durch Fühlen erkennst du den Rhythmus","Klinisches Bild immer im Kopf behalten"],"s":"Mitschrift 10.11.","abc":"B"},{"id":"sau01","t":"sau","f":"Was bedeuten beim Sauerstoff die Zahlen 90 %, 15 l, 94 %, 6 bis 8 l und bei COPD 90 %?","a":["Unter 90 % SpO2: Sauerstoff geben","15 l pro Minute: höchstens","94 %: Ziel erreicht, Flow reduzieren","6 bis 8 l pro Minute: Flow ab 94 %","COPD: Zielwert 90 % statt 94 %"],"s":"Unterricht 12.11.","p":true,"abc":"B","sicher":true},{"id":"sau02","t":"sau","f":"Wie rechnest du aus, wie lange eine Sauerstoffflasche reicht?","a":["Flaschenvolumen (l) × Druck am Manometer (bar) = Liter Sauerstoff","Liter Sauerstoff ÷ Flow (l pro Minute) = Minuten","Mit dem angezeigten Druck rechnen, nicht mit dem Nenndruck","Restdruck abziehen, den Wert gibt die Dienststelle vor"],"s":"nachgeschlagen","q":"e"},{"id":"sau03","t":"sau","typ":"fall","f":"2-l-Flasche mit 200 bar, du gibst 15 l pro Minute. Wie lange reicht sie?","a":["2 × 200 = 400 l Sauerstoff","400 ÷ 15 ≈ 26 Minuten (Theorie, Flasche leer)","Mit 50 bar Restdruck: 2 × 150 = 300 l, also 20 Minuten"],"s":"nachgeschlagen","q":"e"},{"id":"sau04","t":"sau","typ":"fall","f":"Die 2-l-Flasche zeigt nur noch 120 bar. Wie lange reicht sie bei 15 l pro Minute, und wie lange nach dem Reduzieren auf 6 l?","a":["2 × 120 = 240 l Sauerstoff","Bei 15 l pro Minute: 240 ÷ 15 = 16 Minuten","Bei 6 l pro Minute: 240 ÷ 6 = 40 Minuten","Restdruck noch abziehen"],"s":"nachgeschlagen","q":"e"},{"id":"sau05","t":"sau","f":"Warum ist Sauerstoff brandgefährlich, und was folgt daraus?","a":["Brennt nicht selbst, lässt aber alles andere viel heftiger brennen","Kein Öl, kein Fett an Ventil, Druckminderer und Händen (kann sich unter Druck selbst entzünden)","Keine fettigen Cremes (z. B. Vaseline) unter der Maske","Kein offenes Feuer, nicht rauchen, Funken vermeiden","Mit Sauerstoff angereicherte Kleidung und Decken brennen leicht, lüften"],"s":"nachgeschlagen","q":"e"},{"id":"sau06","t":"sau","f":"Du defibrillierst eine Person, die Sauerstoff bekommt. Worauf achtest du?","a":["Maske oder Nasenbrille abnehmen","Sauerstoffquelle mindestens 1 m vom Brustkorb weg","Grund: Funken plus Sauerstoff kann brennen"],"s":"nachgeschlagen","q":"e","abc":"C"},{"id":"sau07","t":"sau","f":"Welche Gefahren gehen vom Druck in der Flasche aus, und wie gehst du damit um?","a":["200 bar: Flasche immer sichern, fällt sie um und bricht das Ventil ab, wird sie zum Geschoss","Ventil langsam öffnen, ein Druckstoß erzeugt Hitze und kann einen Brand auslösen","Vor Gebrauch Dichtheit, Beschädigung und Druck prüfen","Nicht in der Sonne oder neben der Heizung lagern","Nie ganz leer fahren, sonst dringen Feuchtigkeit oder Schmutz ein"],"s":"nachgeschlagen","q":"e"},{"id":"sau08","t":"sau","f":"Welche Risiken hat Sauerstoff für den Patienten?","a":["COPD: zu viel kann den Atemantrieb dämpfen, deshalb Ziel 90 %","Zu viel ohne Mangel kann schaden (z. B. Herzinfarkt, Schlaganfall), deshalb nach SpO2 dosieren und ab 94 % reduzieren","Frühgeborene: Netzhautschäden","Lange Gabe trocknet die Schleimhäute aus"],"s":"nachgeschlagen","q":"e","abc":"B"},{"id":"ekg01","t":"ekg","f":"Was zeigt das EKG, und interpretierst du es?","a":["Die elektrische Aktivität des Herzens","Nein, Sanitäter:innen interpretieren nicht, es ist Vorarbeit für andere","Ein Herzinfarkt ist am EKG oft nicht erkennbar"],"s":"Mitschrift 10.11.","p":true,"abc":"C"},{"id":"ekg02","t":"ekg","f":"Was tust du, bevor du die EKG-Elektroden klebst?","a":["Haut muss trocken sein","Eventuell rasieren"],"s":"Mitschrift 10.11.","abc":"C"},{"id":"ekg03","t":"ekg","f":"Welche EKG-Elektroden habt ihr?","a":["Rot, gelb, grün","Eine schwarze Elektrode (Erdung) gibt es bei euch nicht","LIFEPAK: kleines 3-Kanal-EKG"],"s":"Mitschrift 10.11., Wiederholung 11.11.","abc":"C"},{"id":"ekg04","t":"ekg","f":"Wie klebst du die EKG-Elektroden?","a":["Ab der rechten Schulter (aus Sicht der Patient:in) im Uhrzeigersinn","Rot, gelb, grün, wie die Ampel","An den Extremitäten: rechter Arm rot, linker Arm gelb, linkes Bein grün"],"s":"Mitschrift 2","p":true,"abc":"C","sicher":true},{"id":"gku01","t":"gku","f":"Wann machst du eine Ganzkörperuntersuchung?","a":["Nur bei Trauma, z. B. nach Unfällen","Oder bei spezifischen Hinweisen, z. B. Bewusstlosigkeit ohne erkennbaren Grund","Nicht standardmäßig bei E"],"s":"Mitschrift 10.11., Wiederholung 11.11.","p":true,"abc":"E"},{"id":"gku02","t":"gku","f":"Was willst du mit der Ganzkörperuntersuchung finden?","a":["Verletzungen","Noch nicht entdeckte Krankheiten","Rötungen","Knochenbrüche (Diskontinuität)"],"s":"Mitschrift 10.11.","abc":"E"},{"id":"gku03","t":"gku","f":"Ganzkörperuntersuchung: In welcher Reihenfolge gehst du vor?","a":["Kopf","Hals","Brust","Bauch","Leiste (selbst abtasten lassen)","Rücken","Gliedmaßen"],"s":"Mitschrift 10.11.","p":true,"abc":"E"},{"id":"gku04","t":"gku","f":"Worauf achtest du am Kopf?","a":["Anschauen, Gesicht abtasten: Jochbein, Nasenbein, Ober- und Unterkiefer","Hinterkopf: Unebenheiten (Schädelbasisbruch), Blut","Pupillenreflex mit der Leuchte, in die Ohren schauen","Vor allem bei Trauma ins Ohr leuchten: Blut oder Gehirnflüssigkeit heißt Kopfverletzung","Stufenbildung: andere Kopfform, hohe Letalität"],"s":"Mitschrift 10.11.","abc":"E"},{"id":"gku05","t":"gku","f":"Worauf achtest du bei Hals, Bauch und Rücken?","a":["Hals: gestaute Halsvenen (Rückstau, z. B. Lungenembolie)","Bauch: rechts und links aus Sicht der Patient:in","Leiste normalerweise nicht berühren, selbst abtasten lassen, Ausnahme starke Blutung in der Leiste","Rücken: aufsetzen oder auf die Seite drehen, Achtung bei MILS, Wirbelsäule abtasten"],"s":"Mitschrift 10.11., Wiederholung 11.11.","abc":"E"},{"id":"gku06","t":"gku","f":"Wie prüfst du die Gliedmaßen?","a":["Puls am Fuß","An Händen und Füßen drücken: spürt sie es?","Hände drücken lassen"],"s":"Mitschrift 10.11.","abc":"E"},{"id":"gku07","t":"gku","f":"Wie misst du die Temperatur im Ohr, und ab wann ist es ein Warnzeichen?","a":["Schutzkappe auf, Altersgruppe einstellen, in beiden Ohren messen","Kinder und Erwachsene: Ohr nach oben und hinten ziehen","Säuglinge: gerade nach hinten","Warnzeichen über 39 Grad"],"s":"Mitschrift 10.11.","p":true,"abc":"E"},{"id":"gku08","t":"gku","f":"Darfst du bei der Untersuchung die Leiste berühren?","a":["Normalerweise nicht, die Person tastet selbst ab","Ausnahme: starke Blutung in der Leiste"],"s":"Wiederholung 11.11.","p":true,"abc":"E"},{"id":"fall12","t":"abc","f":"Prüfung: Geh das ABCDE durch und sag zu jedem Buchstaben, was du dir ansiehst.","a":["A: in den Mund schauen","B: Atemfrequenz, SpO2, Zyanose, genug Luft?, Atemgeräusche","C: Puls, Blutdruck (zwei Arten), große Blutgefäße bei Trauma, EKG, Haut","D: Blutzucker, ZOPS, FAST, Motorik und Sensibilität, NRS, Pupillen ohne Brille","E: ins Ohr leuchten, Stufenbildung, SAMPLER, fehlende Werte, Ganzkörper nur bei Trauma oder Hinweisen"],"s":"Wiederholung 11.11., Mitschrift 10.11.","typ":"fall","p":true,"abc":"alle","sicher":true},{"id":"tour1","t":"blu","f":"Was ist ein Tourniquet?","a":["Eine Abbindung"],"s":"Wiederholung 11.11.","abc":"EE"},{"id":"tour2","t":"blu","f":"Wo legst du ein Tourniquet an?","a":["Nicht über Gelenke","Ungefähr eine Handfläche vom Blutungsort entfernt","Auf der körpernahen Seite der Wunde (proximal)"],"s":"Wiederholung 11.11.","p":true,"abc":"EE"},{"id":"wor04","t":"blu","f":"Was heißt distal, was proximal?","a":["Distal: weg vom Körperstamm","Proximal: nah zum Körper"],"s":"Wiederholung 11.11.","p":true},{"id":"hyg01","t":"hyg","f":"Was ist Pathogenität, was Virulenz?","a":["Pathogenität: ob ein Erreger eine Krankheit hervorrufen kann","Virulenz: wie aggressiv er ist, wie stark er krank macht"],"s":"Mitschrift 2"},{"id":"hyg02","t":"hyg","f":"Pathogenität oder Virulenz? 1 wie stark ein Erreger krank macht, 2 ob er überhaupt krank machen kann","a":["1 Virulenz","2 Pathogenität"],"s":"Mitschrift 2"},{"id":"hyg03","t":"hyg","f":"Was ist eine nosokomiale Infektion?","a":["Der Erreger stammt aus einem kontaminierten Umfeld im Gesundheitssystem, z. B. im Krankenhaus"],"s":"Mitschrift 2"},{"id":"hyg04","t":"hyg","f":"Was heißt Single Use, was Single Patient Use?","a":["Single Use: nur einmal benutzbar","Single Patient Use: nur bei derselben Patient:in wiederverwendbar"],"s":"Mitschrift 2"},{"id":"hyg05","t":"hyg","f":"Nenne die Übertragungswege von Erregern.","a":["Stich und Biss","Tröpfchen","Schmier- und Kontaktinfektion","Blut, z. B. Nadelstich"],"s":"Mitschrift 2"},{"id":"hyg06","t":"hyg","f":"Was ist Dispositions-, Expositions- und Postexpositionsprophylaxe?","a":["Disposition: vorbeugen, eigenes Infektionsrisiko senken","Exposition: Schutz beim Kontakt mit Infizierten, z. B. FFP2","Postexposition: Maßnahmen nach möglicher Ansteckung, z. B. Impfung"],"s":"Mitschrift 2"},{"id":"hyg07","t":"hyg","f":"Was sind multiresistente Erreger?","a":["Erreger, die gegen mehrere Mittel resistent sind","Vor allem gegen Antibiotika"],"s":"Mitschrift 2","p":true,"sicher":true},{"id":"hyg08","t":"hyg","f":"Was musst du zum Hygieneplan können?","a":["Den Maßnahmenzettel für die Expositionsprophylaxe anwenden","Er liegt im Portal"],"s":"Mitschrift 2","p":true,"sicher":true},{"id":"fall13","t":"abc","f":"Einsatzplan: Du kommst an einen Einsatzort. Wie gehst du vor?","a":["Selbstschutz vor Fremdschutz: Gefahren scannen, abschirmen (GAMS)","Zur Person: Bewusstsein ja oder nein?","Ja: SSS, EE, ABCDE, Basismaßnahmen","Nein: Notfallcheck, aufweckbar? Atmung?","Atmet: stabile Seitenlage","Atmet nicht: Wiederbelebung 30 : 2, Defi nebenbei, Notarzt nachfordern"],"s":"Mitschrift 2","typ":"fall","p":true,"abc":"alle","sicher":true},{"id":"hi01","t":"hi","f":"Woran erkennst du einen Herzinfarkt?","a":["Starker, anhaltender Druck oder Schmerz in der Brust","Ausstrahlung in linken Arm, Schulter, Hals, Unterkiefer, Rücken oder Oberbauch","Atemnot, Übelkeit","Blässe, kalter Schweiß","Angst, Unruhe"],"s":"nachgeschlagen, mit Band abgleichen","q":"e","p":true,"sicher":true},{"id":"hi02","t":"hi","f":"Bei wem zeigt sich ein Herzinfarkt oft untypisch, und wie?","a":["Frauen, ältere Menschen, Diabetiker:innen","Nur Übelkeit, Oberbauchschmerzen, Atemnot oder Schwäche"],"s":"nachgeschlagen, mit Band abgleichen","q":"e","p":true,"sicher":true},{"id":"hi03","t":"hi","f":"Erste Hilfe bei Verdacht auf Herzinfarkt: Was tust du?","a":["Notruf 144, Verdacht auf Herzinfarkt nennen","Nicht allein lassen, beruhigen","Oberkörper hoch, keine Anstrengung","Beengende Kleidung öffnen, frische Luft","Defi holen lassen, Atmung und Bewusstsein laufend kontrollieren","Atem-Kreislauf-Stillstand: sofort Wiederbelebung und Defi"],"s":"nachgeschlagen, mit Band abgleichen","q":"e","p":true,"sicher":true},{"id":"hi04","t":"hi","f":"Kannst du einen Herzinfarkt am EKG sicher erkennen?","a":["Nein, am EKG ist er oft nicht erkennbar","Sanitäter:innen interpretieren das EKG ohnehin nicht"],"s":"Mitschrift 10.11.","p":true,"abc":"C","sicher":true},{"id":"hi05","t":"hi","typ":"fall","f":"Ein Mann, etwa 60, klagt über drückende Brustschmerzen, die in den linken Arm ziehen. Er ist blass und schwitzt kalt. Was tust du?","a":["An Herzinfarkt denken","Notruf 144","Oberkörper hoch, beruhigen, nicht allein lassen, beengende Kleidung öffnen","Defi holen lassen, Atmung laufend kontrollieren","Hört er auf zu atmen: Wiederbelebung und Defi"],"s":"nachgeschlagen, mit Band abgleichen","q":"e","p":true,"sicher":true},{"id":"dsg01","t":"dsg","f":"Welche Daten sind gemäß EU-DSGVO zu schützen?","a":["Personenbezogene Daten"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg02","t":"dsg","f":"Was sind personenbezogene Daten?","a":["Alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen","Schon ein Nachname kann reichen"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg03","t":"dsg","f":"Was zählt als Verarbeitung von Daten?","a":["Jeder Vorgang mit personenbezogenen Daten","Z. B. Erheben, Erfassen, Ordnen, Speichern, Verwenden"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg04","t":"dsg","f":"Wofür soll die DSGVO sorgen?","a":["Für ein ausgewogenes Verhältnis zwischen Privatsphäre und der nötigen Nutzung personenbezogener Daten"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg05","t":"dsg","f":"Wer ist für die Einhaltung des Datenschutzes verantwortlich?","a":["Alle Mitarbeiter_innen, gemeinsam","Für alle Daten, elektronisch oder auf Papier"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg06","t":"dsg","f":"Was gilt bei der Verschwiegenheitspflicht?","a":["Alles geheim halten, was dir im Dienst anvertraut wird","Weitergabe an Dritte nur auf ausdrückliche Anordnung: Gesetz, interne Vorgaben, Weisung der Vorgesetzten","Unberechtigte Weitergabe kann strafrechtliche Folgen haben"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg07","t":"dsg","f":"Welche Vorkehrungen gelten im Rettungsdienst?","a":["Fenster schließen, Fahrzeug absperren, wenn du es verlässt","Unterlagen mit Patientendaten nach Gebrauch schreddern","Patientendaten nur über die digitale Patientendokumentation","Transportanweisung so lagern, dass niemand hineinsieht","E-Card und Arztbriefe sofort zurückgeben"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg08","t":"dsg","f":"Wie vermeidest du eine unbeabsichtigte Datenweitergabe?","a":["Unterlagen verschlossen aufbewahren","Nicht mehr Benötigtes schreddern, nicht in den Papierkorb","Bei Gesprächen darauf achten, dass niemand mithört"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg09","t":"dsg","f":"Welche fünf Grundsätze gelten bei der Datenverarbeitung?","a":["Zweck","Datensparsamkeit","Rechtmäßigkeit","Transparenz","Datensicherheit"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg10","t":"dsg","f":"Was heißt Datensparsamkeit? Nenne ein Beispiel.","a":["Nur die Daten erheben, die für den Zweck wirklich nötig sind","Besuchsdienst: Name, Adresse, Art der Betreuung, aber keine Finanzdaten oder Staatsangehörigkeit"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg11","t":"dsg","f":"Welche sechs Rechtsgrundlagen für eine Datenverarbeitung gibt es?","a":["Gesetz (rechtliche Verpflichtung)","Vertrag","Öffentliches Interesse","Lebenswichtiges Interesse","Berechtigtes Interesse","Einwilligung"],"s":"E-Learning Datenschutz Modul 1 und 2"},{"id":"dsg12","t":"dsg","f":"Was umfasst Datenschutz?","a":["Schutz der eigenen Daten","Schutz der Daten von Dritten","Schutz vor Regierungen, Arbeitgebern, Industrien"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg13","t":"dsg","typ":"fall","f":"Verletzt das den Datenschutz? 1 Transportanweisung mit Schrift nach oben hinter der Windschutzscheibe, 2 Klientenunterlagen zu Hause im versperrten Schrank, 3 Papier mit Personendaten in den Papierkorb","a":["1 Ja","2 Nein, sie sind versperrt","3 Ja, muss geschreddert werden"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg14","t":"dsg","typ":"fall","f":"Ein Mitglied will über das Mitglieder-Verwaltungssystem eine Aussendung für seine Wohnungssuche. Darf das Sekretariat das?","a":["Nein","Die Daten sind für Vereinszwecke da, nicht für private Zwecke (Zweckbindung)"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg15","t":"dsg","typ":"fall","f":"Eine Liste mit abgekürzten Vornamen und Nachnamen, sonst nichts. Personenbezogene Daten?","a":["Ja","Schon der Nachname kann eine Person identifizierbar machen"],"s":"E-Learning Datenschutz Modul 1"},{"id":"dsg16","t":"dsg","f":"Was ist der Grundsatz der DSGVO zur Datenverwendung?","a":["Jede Datenverwendung ist unzulässig","Außer es besteht eine ausdrückliche Berechtigung (eine der sechs Rechtsgrundlagen)"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg17","t":"dsg","f":"Welche zwei Arten personenbezogener Daten unterscheidet die DSGVO?","a":["Daten besonderer Kategorie (früher sensible Daten)","Alle anderen personenbezogenen Daten (früher nicht sensibel)"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg18","t":"dsg","f":"Was sind Daten besonderer Kategorie?","a":["Ethnische Herkunft","Politische Meinung, Religion, Weltanschauung, Gewerkschaft","Gesundheitsdaten","Sexualleben","Genetische und biometrische Daten"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg19","t":"dsg","f":"Welche Voraussetzungen hat eine gültige Einwilligung?","a":["Ohne Zwang und Irrtum","In Kenntnis der Sachlage","Für den konkreten Fall","Jederzeit widerrufbar","Durch eine aktive Handlung"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg20","t":"dsg","f":"Muss eine Einwilligung schriftlich vorliegen?","a":["Nein, mündlich genügt","Sie soll aber nachvollziehbar sein"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg21","t":"dsg","f":"Wann braucht es eine Einwilligung, und warum ist sie die letzte Wahl?","a":["Nur wenn keine andere der sechs Rechtsgrundlagen besteht","Sie kann jederzeit widerrufen werden, dann dürfen die Daten nicht mehr verwendet werden"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg22","t":"dsg","typ":"fall","f":"Ein Patient im Rettungsdienst kann nicht einwilligen. Darfst du seine Daten erheben?","a":["Ja","Zum Schutz lebenswichtiger Interessen"],"s":"E-Learning Datenschutz Modul 2","p":true},{"id":"dsg23","t":"dsg","f":"Was schreibt § 5 SanG zur Dokumentation vor?","a":["Sanitäter_innen dokumentieren die gesetzten sanitätsdienstlichen Maßnahmen","Die Einrichtung bewahrt die Aufzeichnungen mindestens zehn Jahre auf"],"s":"E-Learning Datenschutz Modul 2","p":true},{"id":"dsg24","t":"dsg","f":"Unter welchen Voraussetzungen dürfen Gesundheitsdaten im Gesundheitsbereich verarbeitet werden?","a":["Im Interesse der Person","Nur durch Fachpersonal","Berufsgeheimnis und Verschwiegenheit","Dritte (Arbeitgeber, Versicherungen) dürfen sie nicht zu anderen Zwecken nutzen"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg25","t":"dsg","f":"Wann dürfen Daten für einen anderen Zweck weiterverarbeitet werden?","a":["Mit Einwilligung","Mit Rechtsgrundlage für die Weiterverarbeitung","Bei Kompatibilität, wenn die Person davon ausgehen kann"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg26","t":"dsg","typ":"fall","f":"Dürfen Daten aus dem Rettungsdienst an den Besuchsdienst weitergegeben werden?","a":["Nur mit Einwilligung","Keine Rechtsgrundlage, und der Patient rechnet nicht damit (keine Kompatibilität)"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg27","t":"dsg","f":"Dürfen Daten innerhalb der Organisation mit allen Personen ausgetauscht werden?","a":["Nein (falsch)","Nur mit denen, die sie für den Zweck brauchen"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg28","t":"dsg","f":"Welche Rechte haben Betroffene?","a":["Information","Auskunft","Berichtigung","Löschung","Einschränkung","Übertragbarkeit"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg29","t":"dsg","f":"Wann können Daten trotz Antrag nicht gelöscht werden, und wohin gehen solche Anträge?","a":["Wenn eine rechtliche Pflicht besteht, sie zu behalten, z. B. die Dokumentationspflicht","Anträge an die für den Datenschutz zuständige Person"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg30","t":"dsg","typ":"fall","f":"Das Ausbildungszentrum speichert Adressen von Kursteilnehmern, die bar zahlen. Darf es das?","a":["Vertragserfüllung reicht nicht, keine Rechnung nötig","Es ist zu prüfen, ob es eine andere Rechtsgrundlage gibt"],"s":"E-Learning Datenschutz Modul 2"},{"id":"dsg31","t":"dsg","f":"Wer zählt beim Datenschutz als Mitarbeiter_in?","a":["Hauptamtliche und Freiwillige","Zivildienstleistende und FSJ-Absolvierende"],"s":"E-Learning Datenschutz Modul 2"}],"id":"rs","titel":"Sani-Lernkartei","bereich":"Sanitäter","untertitel":"Rettungssanitäter:in · Kapitel 1","neuProTag":20,"labels":{"p":"★ Prüfung","fall":"Fall","pFilter":"★ Nur Prüfungsstoff","fallFilter":"Nur Fallbeispiele","quelle":"Lehrbuch ","notiz":"Deine Notiz"}}],"skizzen":{"wegziehen-1":"<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"Arme am Boden entlang nach oben führen\"><line x1=\"8\" y1=\"92\" x2=\"192\" y2=\"92\" stroke-width=\"2\" opacity=\".35\"/><circle cx=\"60\" cy=\"80\" r=\"10\"/><path d=\"M70 82 L140 84 M140 84 L178 80 M140 84 L176 90\"/><path d=\"M80 83 L104 92\" opacity=\".35\" stroke-dasharray=\"4 6\"/><path d=\"M78 80 L52 66 M80 82 L40 74\"/><path d=\"M34 60 Q46 40 70 48\" stroke=\"va     const karten = D.karten.filter(passt);
    if ($("modus").value === "alle") { queue = mischen(karten.slice()); }
    else if ($("modus").value === "neu") { queue = karten.filter(istNeu); } // nur noch nie gesehene Karten, ohne Tageslimit
    else {
      const faellig = karten.filter(istFaellig).sort((a, b) => prog[a.id].d.localeCompare(prog[b.id].d));
      const frei = Math.max(0, neuProTag() - heuteEingefuehrt());
      const neu = karten.filter(istNeu).slice(0, frei);
      queue = faellig.concat(neu);
    }
    naechste();
  }
  function naechste() { aktuell = queue.shift() || null; offen = false; zeichneKarte(); zaehlen(); }

  function intervall(k, g) {
    const p = prog[k.id] || { b: 0 };
    if (g === 0) return T("gleich");
    if (g === 1) return T("1 Tag");
    const b = Math.min(p.b + (g === 3 ? 2 : 1), IV.length - 1);
    return IV[b] === 1 ? T("1 Tag") : IV[b] + T(" Tage");
  }
  function bewerte(g) {
    const k = aktuell; if (!k) return;
    const alt = prog[k.id] || { b: 0, r: 0, f: 0, e: heute() };
    const p = { b: alt.b || 0, r: alt.r || 0, f: alt.f || 0, e: alt.e || heute() };
    if (g === 0) { p.b = 0; p.d = heute(); p.f += 1; queue.splice(Math.min(3, queue.length), 0, k); }
    else if (g === 1) { p.b = Math.max(1, p.b); p.d = heute(1); p.r += 1; }
    else { p.b = Math.min(p.b + (g === 3 ? 2 : 1), IV.length - 1); p.d = heute(IV[p.b]); p.r += 1; }
    p.z = Date.now();
    prog[k.id] = p; bewertetInSitzung += 1;
    lokalSchreiben(); speichern(k.id, p);
    naechste();
  }

  const ketten = {};
  function speichern(id, p) {
    if (!db) return;
    ketten[id] = (ketten[id] || Promise.resolve()).then(() => db.collection("fortschritt").doc(id).set(p)).catch(err => {
      $("status").textContent = T("Speichern in der Cloud gerade nicht möglich, dein Fortschritt bleibt auf diesem Gerät.");
    });
  }

  function marken(k) {
    const m = [];
    if (k.abc) m.push('<span class="tag abc">' + esc(k.abc === "alle" ? "ABCDE" : "ABCDE · " + k.abc) + '</span>');
    if (k.sicher) m.push('<span class="tag sicher">★ 100 % Prüfung</span>');
    else if (k.p) m.push('<span class="tag p">' + esc(lab().p || "★ Prüfung") + '</span>');
    if (k.typ === "fall") m.push('<span class="tag fall">' + esc(lab().fall || "Fall") + '</span>');
    if (k.q === "e") m.push('<span class="tag e">' + esc(T("Ergänzung")) + '</span>');
    return m.join("");
  }
  function bilder(liste) {
    return '<div class="bilder">' + liste.map(b => '<figure>' + ((ALLE.skizzen || {})[b.src] || "") + (b.text ? '<figcaption>' + esc(b.text) + '</figcaption>' : '') + '</figure>').join("") + '</div>';
  }
  function zeichneKarte() {
    const el = $("karte");
    if (!aktuell) {
      const imFilter = D.karten.filter(passt);
      const offenNeu = imFilter.filter(istNeu).length;
      const nurNeu = $("modus").value === "neu";
      el.innerHTML = '<div class="karte leer"><h2>' + T(nurNeu ? "Keine neuen Karten mehr" : bewertetInSitzung ? "Für heute geschafft" : "Gerade nichts fällig") + '</h2>' +
        '<p class="hinweis">' + (nurNeu ? T("Alle Karten in diesem Filter hast du schon gesehen.") : offenNeu ? offenNeu + T(" neue Karten warten, das Tageslimit von ") + neuProTag() + T(" ist erreicht.") : T("Alle Karten in diesem Bereich sind eingeplant.")) + '</p>' +
        '<button id="weiter" class="zeigen" style="width:auto">' + T("Trotzdem weiter üben") + '</button></div>';
      $("weiter").onclick = () => { $("modus").value = "alle"; baueQueue(); };
      return;
    }
    const k = aktuell, t = THEMA[k.t];
    let h = '<article class="karte"><div class="oben"><span>' + esc(t.titel) + '</span><div class="marken">' + marken(k) + '</div></div>' +
      '<p class="frage">' + esc(k.f) + '</p>';
    if (!offen) {
      h += '<button class="zeigen" id="zeigen">' + T("Antwort zeigen") + '</button>';
    } else {
      h += '<ul class="antwort">' + k.a.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul>';
      if (k.b) h += bilder(k.b.map(n => ({ src: n })));
      if (k.n) h += '<div class="notiz"><small>' + esc(lab().notiz || "Deine Notiz") + '</small>' + esc(k.n) + '</div>';
      if (k.erg) h += '<div class="erg"><strong>' + T("Ergänzung von Claude") + '</strong><p>' + esc(k.erg) + '</p></div>';
      h += '<p class="quelle">' + (k.q === "e" ? T("Ergänzung von Claude, Bezug: ") : (lab().quelle || "Lehrbuch ")) + esc(k.s) + '</p>';
      const L = ["Nochmal", "Schwer", "Gut", "Leicht"].map(T);
      h += '<div class="bewerten">' + L.map((l, i) => '<button class="b' + i + '" data-g="' + i + '">' + l + '<span>' + intervall(k, i) + '</span></button>').join("") + '</div>';
    }
    h += '</article>';
    el.innerHTML = h;
    if (!offen) $("zeigen").onclick = () => { offen = true; zeichneKarte(); };
    el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => bewerte(+b.dataset.g));
  }
  function zaehlen() {
    const alle = D.karten;
    $("z-faellig").textContent = alle.filter(istFaellig).length;
    $("z-neu").textContent = alle.filter(istNeu).length;
    $("z-sicher").textContent = alle.filter(k => prog[k.id] && prog[k.id].b >= 3).length;
    filterZahlen();
  }
  // Kartenzahl je Kapitel: im Auswahlfeld „gelernt/gesamt“, darunter die Zeile zum gewählten Kapitel
  function filterZahlen() {
    const sel = $("filter");
    [...sel.options].forEach(o => {
      const ks = D.karten.filter(k => passtWert(k, o.value));
      o.textContent = o.dataset.l + " (" + ks.filter(k => prog[k.id]).length + "/" + ks.length + ")";
    });
    const ks = D.karten.filter(passt);
    const g = ks.filter(k => prog[k.id]).length, s = ks.filter(k => prog[k.id] && prog[k.id].b >= 3).length, f = ks.filter(istFaellig).length;
    $("kapitelzahl").textContent = ks.length + " " + T("Karten") + " · " + g + " " + T("gelernt") + " · " + s + " " + T("sicher") + (f ? " · " + f + " " + T("fällig") : "");
  }

  function zeichneBlatt() {
    $("blatt").innerHTML = '<p class="hinweis">' + esc(D.quelle) + '. ' + esc(D.blattHinweis || "★ = von dir markiert oder prüfungsrelevant.") + '</p>' + D.themen.map(t => {
      let h = '<details class="thema"><summary><h3>' + esc(t.titel) + '</h3><span class="seiten">' + esc(t.seiten) + '</span></summary><div class="inhalt">';
      h += '<p class="kern">' + esc(t.kern) + '</p>';
      h += '<ul class="punkte">' + t.punkte.map(p => p.startsWith("★") ? '<li class="stern">' + esc(p.slice(1).trim()) + '</li>' : '<li>' + esc(p) + '</li>').join("") + '</ul>';
      if (t.merke) h += '<div class="merke">' + esc(t.merke) + '</div>';
      if (t.bilder) h += bilder(t.bilder);
      if (t.ergaenzung && t.ergaenzung.length) h += '<div class="erg"><strong>' + T("Ergänzung von Claude") + '</strong>' + t.ergaenzung.map(x => '<p>' + esc(x) + '</p>').join("") + '</div>';
      (t.notizen || []).forEach(n => { h += '<div class="notiz"><small>' + T("Deine Notiz, ") + esc(n.ort) + (n.unsicher ? '<span class="offen">' + T("noch klären") + '</span>' : '') + '</small>' + esc(n.text) + '</div>'; });
      return h + '</div></details>';
    }).join("");
  }
  function zeichneStand() {
    let h = '<h2 class="abschnitt">' + T("Themen") + '</h2><div class="box">';
    D.themen.filter(t => D.karten.some(k => k.t === t.id)).forEach(t => {
      const ks = D.karten.filter(k => k.t === t.id), n = ks.length;
      const sicher = ks.filter(k => prog[k.id] && prog[k.id].b >= 3).length;
      const lernt = ks.filter(k => prog[k.id] && prog[k.id].b < 3).length;
      const f = ks.filter(istFaellig).length;
      h += '<div class="zeile"><span class="name">' + esc(t.titel) + '</span><span class="werte">' + (sicher + lernt) + '/' + n + ' ' + T("gelernt") + ' · ' + sicher + ' ' + T("sicher") + (f ? ' · ' + f + ' ' + T("fällig") : '') + '</span>' +
        '<div class="balken" role="img" aria-label="' + sicher + ' ' + T("sicher") + ', ' + lernt + ' ' + T("in Arbeit") + ' ' + T("von") + ' ' + n + '"><i class="sicher" style="width:' + (100 * sicher / n) + '%"></i><i class="lernt" style="width:' + (100 * lernt / n) + '%"></i></div></div>';
    });
    h += '</div><div class="legende"><span><i style="background:var(--good)"></i>' + T("sicher (ab 4 Tagen Abstand)") + '</span><span><i style="background:var(--accent)"></i>' + T("in Arbeit") + '</span><span><i style="background:var(--line)"></i>' + T("neu") + '</span></div>';
    const schwach = D.karten.filter(k => prog[k.id] && prog[k.id].f >= 2 && prog[k.id].f >= prog[k.id].r).sort((a, b) => prog[b.id].f - prog[a.id].f).slice(0, 10);
    h += '<h2 class="abschnitt">' + T("Schwierige Karten") + '</h2><div class="box">' + (schwach.length ? schwach.map(k => '<div class="schwach"><b>' + esc(k.f) + '</b><span class="hinweis">' + prog[k.id].f + T("× nochmal, ") + esc(THEMA[k.t].titel) + '</span></div>').join("") : '<p class="hinweis">' + T("Noch keine. Karten, bei denen du öfter „Nochmal“ drückst, landen hier.") + '</p>') + '</div>';
    h += '<p class="status">' + T(quelle === "cloud" ? "Fortschritt wird über alle deine Geräte synchronisiert." : quelle === "laedt" ? "Fortschritt wird geladen …" : "Fortschritt nur auf diesem Gerät gespeichert.") + T(" Stand der Inhalte: ") + esc(D.stand) + ', ' + D.karten.length + T(" Karten.") + '</p>';
    h += '<button class="knopf" id="kopieren">' + T("Fortschritt für Claude kopieren") + '</button><p class="hinweis" id="kopiert">' + T("Kopiert den Lernstand. Füge ihn im Chat ein, dann sehe ich, wo es hakt.") + '</p>';
    $("stand").innerHTML = h;
    $("kopieren").onclick = async () => {
      const text = "Lernstand Lernkartei (" + D.titel + ") " + heute() + "\n" + JSON.stringify(prog);
      try { await navigator.clipboard.writeText(text); $("kopiert").textContent = T("Kopiert. Jetzt im Chat mit Claude einfügen."); }
      catch (e) { const ta = document.createElement("textarea"); ta.value = text; ta.rows = 4; ta.style.width = "100%"; $("kopiert").replaceWith(ta); ta.select(); }
    };
  }

  function filterFuellen() {
    const opt = (v, l) => '<option value="' + esc(v) + '" data-l="' + esc(l) + '">' + esc(l) + '</option>';
    const o = [opt("alle", T("Alle Themen"))];
    if (D.karten.some(k => k.sicher)) o.push(opt("sicher", "★ Nur 100 % Prüfung"));
    if (D.karten.some(k => k.p)) o.push(opt("pruef", lab().pFilter || "★ Nur Prüfungsstoff"));
    if (D.karten.some(k => k.typ === "fall")) o.push(opt("fall", lab().fallFilter || "Nur Fallbeispiele"));
    D.themen.filter(t => D.karten.some(k => k.t === t.id)).forEach(t => o.push(opt(t.id, t.titel)));
    $("filter").innerHTML = o.join("");
    filterZahlen();
  }
  function ansicht(v) {
    document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.v === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    $("v-lernen").hidden = v !== "lernen"; $("v-blatt").hidden = v !== "blatt"; $("v-stand").hidden = v !== "stand";
    if (v === "stand") zeichneStand();
    try { localStorage.setItem(LS + "-ansicht", v); } catch (e) {}
    window.scrollTo(0, 0);
  }

  async function verbinden() {
    if (!window.claude || !window.claude.use) { quelle = "lokal"; return; }
    quelle = "laedt";
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { quelle = "lokal"; $("status").textContent = T("Fortschritt wird nur auf diesem Gerät gespeichert."); return; }
    const timer = setTimeout(() => { if (!geladen) $("status").textContent = T("Der gespeicherte Fortschritt ist gerade nicht erreichbar. Du kannst trotzdem lernen."); }, 10000);
    db.collection("fortschritt").onSnapshot(snap => {
      const neu = {};
      snap.docs.forEach(d => { neu[d.id] = Object.assign({}, d.data()); });
      Object.keys(prog).forEach(id => { if (!neu[id] || (prog[id].z || 0) > (neu[id].z || 0)) neu[id] = prog[id]; });
      prog = neu; lokalSchreiben();
      if (!snap.metadata.fromCache) { clearTimeout(timer); quelle = "cloud"; $("status").textContent = ""; }
      const ersterStand = !geladen; geladen = true;
      if (ersterStand && bewertetInSitzung === 0 && !offen) baueQueue(); else zaehlen();
      if (!$("v-stand").hidden) zeichneStand();
    }, err => { clearTimeout(timer); quelle = "lokal"; $("status").textContent = T("Cloud-Speicher nicht verfügbar, Fortschritt bleibt auf diesem Gerät."); });
  }

  function bereich(id) {
    D = ALLE.kurse.find(k => k.id === id) || ALLE.kurse[0];
    THEMA = Object.fromEntries(D.themen.map(t => [t.id, t]));
    $("marke-titel").textContent = D.titel;
    $("kursname").textContent = D.untertitel || D.kurs;
    document.documentElement.lang = D.lang || "de";
    document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T(e.dataset.t); });
    document.querySelectorAll("#bereiche button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === D.id ? "true" : "false"));
    try { localStorage.setItem(LS + "-bereich", D.id); } catch (e) {}
    filterFuellen();
    zeichneBlatt();
    if (!$("v-stand").hidden) zeichneStand();
  }

  prog = lokalLesen();
  $("bereiche").innerHTML = ALLE.kurse.map(k => '<button type="button" data-k="' + esc(k.id) + '" aria-pressed="false">' + esc(k.bereich || k.titel) + '</button>').join("");
  $("bereiche").hidden = ALLE.kurse.length < 2;
  document.querySelectorAll("#bereiche button").forEach(b => b.onclick = () => { if (b.dataset.k !== D.id) { bereich(b.dataset.k); $("modus").value = "heute"; baueQueue(); } });
  let startBereich = ALLE.kurse[0].id; try { startBereich = localStorage.getItem(LS + "-bereich") || startBereich; } catch (e) {}
  bereich(startBereich);
  $("filter").onchange = baueQueue;
  $("modus").onchange = baueQueue;
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => ansicht(b.dataset.v));
  baueQueue();
  let start = "lernen"; try { start = localStorage.getItem(LS + "-ansicht") || "lernen"; } catch (e) {}
  if (start !== "lernen") ansicht(start);
  verbinden();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
