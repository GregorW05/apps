    "Lernen": "Study", "Lernblatt": "Summary", "Übersicht": "Progress", "Alle Themen": "All topics",
    "gleich": "now", "1 Tag": "1 day", " Tage": " days", "Nochmal": "Again", "Schwer": "Hard", "Gut": "Good", "Leicht": "Easy",
    "Antwort zeigen": "Show answer", "Ergänzung": "Added by Claude", "Ergänzung von Claude": "Added by Claude", "Ergänzung von Claude, Bezug: ": "Added by Claude, based on: ",
    "Deine Notiz, ": "Your note, ", "noch klären": "to clarify",
    "Für heute geschafft": "Done for today", "Gerade nichts fällig": "Nothing due right now",
    " neue Karten warten, das Tageslimit von ": " new cards waiting, the daily limit of ", " ist erreicht.": " has been reached.",
    "Alle Karten in diesem Bereich sind eingeplant.": "All cards in this area are scheduled.", "Trotzdem weiter üben": "Keep practising anyway",
    "Themen": "Topics", "in Arbeit": "learning", "von": "of", "sicher (ab 4 Tagen Abstand)": "mastered (interval of 4+ days)",
    "Schwierige Karten": "Difficult cards", "× nochmal, ": "× again, ", "Noch keine. Karten, bei denen du öfter „Nochmal“ drückst, landen hier.": "None yet. Cards where you often press Again show up here.",
    "Fortschritt wird über alle deine Geräte synchronisiert.": "Progress syncs across all your devices.", "Fortschritt wird geladen …": "Loading progress …",
    "Fortschritt nur auf diesem Gerät gespeichert.": "Progress is saved on this device only.", " Stand der Inhalte: ": " Content as of ", " Karten.": " cards.",
    "Fortschritt für Claude kopieren": "Copy progress for Claude", "Kopiert den Lernstand. Füge ihn im Chat ein, dann sehe ich, wo es hakt.": "Copies your progress. Paste it into the chat so Claude can see where you get stuck.",
    "Kopiert. Jetzt im Chat mit Claude einfügen.": "Copied. Now paste it into the chat with Claude.",
    "Speichern in der Cloud gerade nicht möglich, dein Fortschritt bleibt auf diesem Gerät.": "Cloud saving is not possible right now, your progress stays on this device.",
    "Fortschritt wird nur auf diesem Gerät gespeichert.": "Progress is saved on this device only.",
    "Der gespeicherte Fortschritt ist gerade nicht erreichbar. Du kannst trotzdem lernen.": "Your saved progress cannot be reached right now. You can still study.",
    "Cloud-Speicher nicht verfügbar, Fortschritt bleibt auf diesem Gerät.": "Cloud storage unavailable, progress stays on this device."
  };
  const T = s => (D && D.lang === "en" && EN[s]) || s;
  const LS = "sani-lernkartei-v1";
  let prog = {};
  let db = null, quelle = "lokal", geladen = false;
  let queue = [], aktuell = null, offen = false, bewertetInSitzung = 0;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function heute(plus) { const d = new Date(); d.setHours(12, 0, 0, 0); if (plus) d.setDate(d.getDate() + plus); return d.toISOString().slice(0, 10); }
  function lokalLesen() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
  function lokalSchreiben() { try { localStorage.setItem(LS, JSON.stringify(prog)); } catch (e) {} }

  function istFaellig(k) { const p = prog[k.id]; return p && p.d && p.d <= heute(); }
  function istNeu(k) { return !prog[k.id]; }
  function heuteEingefuehrt() { const h = heute(); return D.karten.filter(k => prog[k.id] && prog[k.id].e === h).length; }
  function passt(k) {
    const f = $("filter").value;
    if (f === "alle") return true;
    if (f === "pruef") return !!k.p;
    if (f === "fall") return k.typ === "fall";
    return k.t === f;
  }
  function mischen(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function baueQueue() {
    const karten = D.karten.filter(passt);
    if ($("modus").value === "alle") { queue = mischen(karten.slice()); }
    else if ($("modus").value === "neu") { queue = karten.filter(istNeu); } // nur noch nie gesehene Karten, ohne Tageslimit
    else {
      const faellig = karten.filter(istFaellig).sort((a, b) => prog[a.id].d.localeCompare(prog[b.id].d));
      const frei = Math.max(0, neuProTag() - heuteEingefuehrt());
      const neu = karten.filter(istNeu).slice(0, frei);
      queue = faellig.concat(neu);
    }
    naechste();
  }
  function naechste() { aktuell = queue.shift() || null; offen = false; zeichneKarte(); zaehlen(); }

  function intervall(k, g) {
    const p = prog[k.id] || { b: 0 };
    if (g === 0) return T("gleich");
    if (g === 1) return T("1 Tag");
    const b = Math.min(p.b + (g === 3 ? 2 : 1), IV.length - 1);
    return IV[b] === 1 ? T("1 Tag") : IV[b] + T(" Tage");
  }
  function bewerte(g) {
    const k = aktuell; if (!k) return;
    const alt = prog[k.id] || { b: 0, r: 0, f: 0, e: heute() };
    const p = { b: alt.b || 0, r: alt.r || 0, f: alt.f || 0, e: alt.e || heute() };
    if (g === 0) { p.b = 0; p.d = heute(); p.f += 1; queue.splice(Math.min(3, queue.length), 0, k); }
    else if (g === 1) { p.b = Math.max(1, p.b); p.d = heute(1); p.r += 1; }
    else { p.b = Math.min(p.b + (g === 3 ? 2 : 1), IV.length - 1); p.d = heute(IV[p.b]); p.r += 1; }
    p.z = Date.now();
    prog[k.id] = p; bewertetInSitzung += 1;
    lokalSchreiben(); speichern(k.id, p);
    naechste();
  }

  const ketten = {};
  function speichern(id, p) {
    if (!db) return;
    ketten[id] = (ketten[id] || Promise.resolve()).then(() => db.collection("fortschritt").doc(id).set(p)).catch(err => {
      $("status").textContent = T("Speichern in der Cloud gerade nicht möglich, dein Fortschritt bleibt auf diesem Gerät.");
    });
  }

  function marken(k) {
    const m = [];
    if (k.p) m.push('<span class="tag p">' + esc(lab().p || "★ Prüfung") + '</span>');
    if (k.typ === "fall") m.push('<span class="tag fall">' + esc(lab().fall || "Fall") + '</span>');
    if (k.q === "e") m.push('<span class="tag e">' + esc(T("Ergänzung")) + '</span>');
    return m.join("");
  }
  function bilder(liste) {
    return '<div class="bilder">' + liste.map(b => '<figure>' + ((ALLE.skizzen || {})[b.src] || "") + (b.text ? '<figcaption>' + esc(b.text) + '</figcaption>' : '') + '</figure>').join("") + '</div>';
  }
  function zeichneKarte() {
    const el = $("karte");
    if (!aktuell) {
      const imFilter = D.karten.filter(passt);
      const offenNeu = imFilter.filter(istNeu).length;
      const nurNeu = $("modus").value === "neu";
      el.innerHTML = '<div class="karte leer"><h2>' + T(nurNeu ? "Keine neuen Karten mehr" : bewertetInSitzung ? "Für heute geschafft" : "Gerade nichts fällig") + '</h2>' +
        '<p class="hinweis">' + (nurNeu ? T("Alle Karten in diesem Filter hast du schon gesehen.") : offenNeu ? offenNeu + T(" neue Karten warten, das Tageslimit von ") + neuProTag() + T(" ist erreicht.") : T("Alle Karten in diesem Bereich sind eingeplant.")) + '</p>' +
        '<button id="weiter" class="zeigen" style="width:auto">' + T("Trotzdem weiter üben") + '</button></div>';
      $("weiter").onclick = () => { $("modus").value = "alle"; baueQueue(); };
      return;
    }
    const k = aktuell, t = THEMA[k.t];
    let h = '<article class="karte"><div class="oben"><span>' + esc(t.titel) + '</span><div class="marken">' + marken(k) + '</div></div>' +
      '<p class="frage">' + esc(k.f) + '</p>';
    if (!offen) {
      h += '<button class="zeigen" id="zeigen">' + T("Antwort zeigen") + '</button>';
    } else {
      h += '<ul class="antwort">' + k.a.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul>';
      if (k.b) h += bilder(k.b.map(n => ({ src: n })));
      if (k.n) h += '<div class="notiz"><small>' + esc(lab().notiz || "Deine Notiz") + '</small>' + esc(k.n) + '</div>';
      h += '<p class="quelle">' + (k.q === "e" ? T("Ergänzung von Claude, Bezug: ") : (lab().quelle || "Lehrbuch ")) + esc(k.s) + '</p>';
      const L = ["Nochmal", "Schwer", "Gut", "Leicht"].map(T);
      h += '<div class="bewerten">' + L.map((l, i) => '<button class="b' + i + '" data-g="' + i + '">' + l + '<span>' + intervall(k, i) + '</span></button>').join("") + '</div>';
    }
    h += '</article>';
    el.innerHTML = h;
    if (!offen) $("zeigen").onclick = () => { offen = true; zeichneKarte(); };
    el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => bewerte(+b.dataset.g));
  }
  function zaehlen() {
    const alle = D.karten;
    $("z-faellig").textContent = alle.filter(istFaellig).length;
    $("z-neu").textContent = alle.filter(istNeu).length;
    $("z-sicher").textContent = alle.filter(k => prog[k.id] && prog[k.id].b >= 3).length;
  }

  function zeichneBlatt() {
    $("blatt").innerHTML = '<p class="hinweis">' + esc(D.quelle) + '. ' + esc(D.blattHinweis || "★ = von dir markiert oder prüfungsrelevant.") + '</p>' + D.themen.map(t => {
      let h = '<details class="thema"><summary><h3>' + esc(t.titel) + '</h3><span class="seiten">' + esc(t.seiten) + '</span></summary><div class="inhalt">';
      h += '<p class="kern">' + esc(t.kern) + '</p>';
      h += '<ul class="punkte">' + t.punkte.map(p => p.startsWith("★") ? '<li class="stern">' + esc(p.slice(1).trim()) + '</li>' : '<li>' + esc(p) + '</li>').join("") + '</ul>';
      if (t.merke) h += '<div class="merke">' + esc(t.merke) + '</div>';
      if (t.bilder) h += bilder(t.bilder);
      if (t.ergaenzung && t.ergaenzung.length) h += '<div class="erg"><strong>' + T("Ergänzung von Claude") + '</strong>' + t.ergaenzung.map(x => '<p>' + esc(x) + '</p>').join("") + '</div>';
      (t.notizen || []).forEach(n => { h += '<div class="notiz"><small>' + T("Deine Notiz, ") + esc(n.ort) + (n.unsicher ? '<span class="offen">' + T("noch klären") + '</span>' : '') + '</small>' + esc(n.text) + '</div>'; });
      return h + '</div></details>';
    }).join("");
  }
  function zeichneStand() {
    let h = '<h2 class="abschnitt">' + T("Themen") + '</h2><div class="box">';
    D.themen.filter(t => D.karten.some(k => k.t === t.id)).forEach(t => {
      const ks = D.karten.filter(k => k.t === t.id), n = ks.length;
      const sicher = ks.filter(k => prog[k.id] && prog[k.id].b >= 3).length;
      const lernt = ks.filter(k => prog[k.id] && prog[k.id].b < 3).length;
      const f = ks.filter(istFaellig).length;
      h += '<div class="zeile"><span class="name">' + esc(t.titel) + '</span><span class="werte">' + sicher + '/' + n + ' ' + T("sicher") + (f ? ' · ' + f + ' ' + T("fällig") : '') + '</span>' +
        '<div class="balken" role="img" aria-label="' + sicher + ' ' + T("sicher") + ', ' + lernt + ' ' + T("in Arbeit") + ' ' + T("von") + ' ' + n + '"><i class="sicher" style="width:' + (100 * sicher / n) + '%"></i><i class="lernt" style="width:' + (100 * lernt / n) + '%"></i></div></div>';
    });
    h += '</div><div class="legende"><span><i style="background:var(--good)"></i>' + T("sicher (ab 4 Tagen Abstand)") + '</span><span><i style="background:var(--accent)"></i>' + T("in Arbeit") + '</span><span><i style="background:var(--line)"></i>' + T("neu") + '</span></div>';
    const schwach = D.karten.filter(k => prog[k.id] && prog[k.id].f >= 2 && prog[k.id].f >= prog[k.id].r).sort((a, b) => prog[b.id].f - prog[a.id].f).slice(0, 10);
    h += '<h2 class="abschnitt">' + T("Schwierige Karten") + '</h2><div class="box">' + (schwach.length ? schwach.map(k => '<div class="schwach"><b>' + esc(k.f) + '</b><span class="hinweis">' + prog[k.id].f + T("× nochmal, ") + esc(THEMA[k.t].titel) + '</span></div>').join("") : '<p class="hinweis">' + T("Noch keine. Karten, bei denen du öfter „Nochmal“ drückst, landen hier.") + '</p>') + '</div>';
    h += '<p class="status">' + T(quelle === "cloud" ? "Fortschritt wird über alle deine Geräte synchronisiert." : quelle === "laedt" ? "Fortschritt wird geladen …" : "Fortschritt nur auf diesem Gerät gespeichert.") + T(" Stand der Inhalte: ") + esc(D.stand) + ', ' + D.karten.length + T(" Karten.") + '</p>';
    h += '<button class="knopf" id="kopieren">' + T("Fortschritt für Claude kopieren") + '</button><p class="hinweis" id="kopiert">' + T("Kopiert den Lernstand. Füge ihn im Chat ein, dann sehe ich, wo es hakt.") + '</p>';
    $("stand").innerHTML = h;
    $("kopieren").onclick = async () => {
      const text = "Lernstand Lernkartei (" + D.titel + ") " + heute() + "\n" + JSON.stringify(prog);
      try { await navigator.clipboard.writeText(text); $("kopiert").textContent = T("Kopiert. Jetzt im Chat mit Claude einfügen."); }
      catch (e) { const ta = document.createElement("textarea"); ta.value = text; ta.rows = 4; ta.style.width = "100%"; $("kopiert").replaceWith(ta); ta.select(); }
    };
  }

  function filterFuellen() {
    const o = ['<option value="alle">' + T("Alle Themen") + '</option>'];
    if (D.karten.some(k => k.p)) o.push('<option value="pruef">' + esc(lab().pFilter || "★ Nur Prüfungsstoff") + '</option>');
    if (D.karten.some(k => k.typ === "fall")) o.push('<option value="fall">' + esc(lab().fallFilter || "Nur Fallbeispiele") + '</option>');
    D.themen.filter(t => D.karten.some(k => k.t === t.id)).forEach(t => o.push('<option value="' + t.id + '">' + esc(t.titel) + '</option>'));
    $("filter").innerHTML = o.join("");
  }
  function ansicht(v) {
    document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.v === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    $("v-lernen").hidden = v !== "lernen"; $("v-blatt").hidden = v !== "blatt"; $("v-stand").hidden = v !== "stand";
    if (v === "stand") zeichneStand();
    try { localStorage.setItem(LS + "-ansicht", v); } catch (e) {}
    window.scrollTo(0, 0);
  }

  async function verbinden() {
    if (!window.claude || !window.claude.use) { quelle = "lokal"; return; }
    quelle = "laedt";
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { quelle = "lokal"; $("status").textContent = T("Fortschritt wird nur auf diesem Gerät gespeichert."); return; }
    const timer = setTimeout(() => { if (!geladen) $("status").textContent = T("Der gespeicherte Fortschritt ist gerade nicht erreichbar. Du kannst trotzdem lernen."); }, 10000);
    db.collection("fortschritt").onSnapshot(snap => {
      const neu = {};
      snap.docs.forEach(d => { neu[d.id] = Object.assign({}, d.data()); });
      Object.keys(prog).forEach(id => { if (!neu[id] || (prog[id].z || 0) > (neu[id].z || 0)) neu[id] = prog[id]; });
      prog = neu; lokalSchreiben();
      if (!snap.metadata.fromCache) { clearTimeout(timer); quelle = "cloud"; $("status").textContent = ""; }
      const ersterStand = !geladen; geladen = true;
      if (ersterStand && bewertetInSitzung === 0 && !offen) baueQueue(); else zaehlen();
      if (!$("v-stand").hidden) zeichneStand();
    }, err => { clearTimeout(timer); quelle = "lokal"; $("status").textContent = T("Cloud-Speicher nicht verfügbar, Fortschritt bleibt auf diesem Gerät."); });
  }

  function bereich(id) {
    D = ALLE.kurse.find(k => k.id === id) || ALLE.kurse[0];
    THEMA = Object.fromEntries(D.themen.map(t => [t.id, t]));
    $("marke-titel").textContent = D.titel;
    $("kursname").textContent = D.untertitel || D.kurs;
    document.documentElement.lang = D.lang || "de";
    document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T(e.dataset.t); });
    document.querySelectorAll("#bereiche button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === D.id ? "true" : "false"));
    try { localStorage.setItem(LS + "-bereich", D.id); } catch (e) {}
    filterFuellen();
    zeichneBlatt();
    if (!$("v-stand").hidden) zeichneStand();
  }

  prog = lokalLesen();
  $("bereiche").innerHTML = ALLE.kurse.map(k => '<button type="button" data-k="' + esc(k.id) + '" aria-pressed="false">' + esc(k.bereich || k.titel) + '</button>').join("");
  $("bereiche").hidden = ALLE.kurse.length < 2;
  document.querySelectorAll("#bereiche button").forEach(b => b.onclick = () => { if (b.dataset.k !== D.id) { bereich(b.dataset.k); $("modus").value = "heute"; baueQueue(); } });
  let startBereich = ALLE.kurse[0].id; try { startBereich = localStorage.getItem(LS + "-bereich") || startBereich; } catch (e) {}
  bereich(startBereich);
  $("filter").onchange = baueQueue;
  $("modus").onchange = baueQueue;
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => ansicht(b.dataset.v));
  baueQueue();
  let start = "lernen"; try { start = localStorage.getItem(LS + "-ansicht") || "lernen"; } catch (e) {}
  if (start !== "lernen") ansicht(start);
  verbinden();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
