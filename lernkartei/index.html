<script id="daten" type="application/json">{"kurse":[{"kurs":"Rettungssanitäter:in","quelle":"ÖRK Lehrbuch Band 1, Kapitel 1 (Stand Jänner 2024) mit deinen Notizen und deiner Sprachnachricht vom 05.11.2026","stand":"05.11.2026","themen":[{"id":"ork","titel":"Rotes Kreuz und Rettungswesen","seiten":"S. 12 bis 15","kern":"Im Unterricht nur kurz betont: Geschichte, die sieben Grundsätze, die acht Pflichten und wer fürs Rettungswesen sorgt.","punkte":["Henry Dunant, Schweizer Geschäftsmann, legte in den 1860er-Jahren den Grundstein. Das ÖRK gibt es seit 1880.","Heute weltweit 192 Rotkreuz- und Rothalbmondgesellschaften, koordiniert aus Genf.","★ 7 Grundsätze: Menschlichkeit, Unparteilichkeit, Neutralität, Unabhängigkeit, Freiwilligkeit, Einheit, Universalität.","★ 8 Pflichten: Sorgfalt, Dokumentation, Anzeige, Verschwiegenheit, Mitteilung, Auskunft, Hilfeleistung, Fortbildung.","Rettungswesen: Die Gemeinden müssen dafür sorgen und übertragen es meist dem Roten Kreuz."],"merke":"Grundsätze, Eselsbrücke: „Manche Unfälle nehmen uns fast echt unvorbereitet“ (M U N U F E U).","notizen":[]},{"id":"abc","titel":"SSS, EE und ABCDE","seiten":"S. 16","kern":"Als Sanitäter:in schätzt du beim ersten Kontakt ein, ob es lebensbedrohlich ist. Im Sanitätseinsatz meist nicht (Transportbegleitung), im Rettungseinsatz kann es ein Notfall sein. Du gehst immer strukturiert vor und behandelst zuerst, was zuerst tötet.","punkte":["★ SSS: Szene, Sicherheit, Situation. Eigene Sicherheit, Team, Patient:in.","★ EE: Erster Eindruck. Notfall erfassen, lebensbedrohliche Blutungen sofort stillen.","★ A Airway: Atemwege freimachen und freihalten.","★ B Breathing: Atmung und Sauerstoffversorgung sichern, nötigenfalls Wiederbelebung.","★ C Circulation: schwere Kreislaufprobleme feststellen.","★ D Disability: schwere neurologische Störungen erkennen.","★ E Exposure: Entkleiden und Entscheiden, wurde nichts übersehen?","Kritisch krank oder verletzt: Notarzt nachfordern, notfalls schneller Transport ins Krankenhaus."],"merke":"„Treat first what kills first.“","notizen":[{"text":"Notfallcheck und ABCDE sind sich ähnlich. Der Notfallcheck ist die Sicht der Ersthelfer, ABCDE die Sicht der Rettungssanitäter.","ort":"S. 22 und Unterricht"}]},{"id":"not","titel":"Notruf, GAMS und Absichern","seiten":"S. 17","kern":"Alle Nummern kommen zur Prüfung, in beide Richtungen. Eine Nummer reicht, die Leitstelle alarmiert alle nötigen Kräfte. Erst die Leitstelle beendet das Gespräch.","punkte":["★ 122 Feuerwehr, 133 Polizei, 144 Rettung, 112 Euro-Notruf (in Österreich zur Polizei, geht ohne SIM und Guthaben).","★ 1450 Gesundheitsberatung (kein Notfall, 0 bis 24 Uhr).","★ 140 Bergrettung, 141 Ärztenotdienst, 142 Telefonseelsorge, 147 Rat auf Draht, 116 123 Ö3 Kummernummer.","★ Vergiftungsinformationszentrale +43 1 406 43 43 (kommt sicher).","Beim Notruf: Fragen beantworten, Freisprechen, die Hilfe ist schon während des Gesprächs alarmiert. 144 sagt dir auch, wo der nächste Defi ist.","GAMS bei Gefahr: Gefahr erkennen, Absperren und Abstand halten, Menschenrettung (nur ohne Eigengefährdung), Spezialkräfte nachfordern.","Die 3 W beim Autounfall: Warnblinker, Warnweste, Warndreieck."],"merke":"Kenn dein Material.","ergaenzung":["GAMS nachgeschlagen (Feuerwehr- und Rettungsdienstlehre): G Gefahr erkennen (beobachten, Warntafeln, im Zweifel die größte Gefahr annehmen). A Absperren, Abstand halten, selbst nicht in den Gefahrenbereich. M Menschen retten nur, wenn es ohne Eigengefährdung geht, sonst Leute aus dem Bereich rufen. S Spezialkräfte nachfordern, z. B. Feuerwehr mit den Nummern der Warntafel.","Übliche Reihenfolge beim Absichern: Warnblinker an, Warnweste noch im Auto anziehen, dann das Warndreieck aufstellen. Die Abstände stehen im Lehrbuch auf S. 34, die ergänze ich mit dem nächsten Scan."],"notizen":[{"text":"Vergiftungsinformationszentrale kommt 100 % zur Prüfung.","ort":"S. 17"},{"text":"Kenn dein Material, z. B. findet man die Rettungstasche in einem neuen Auto in der Stresssituation nicht.","ort":"S. 17"},{"text":"GAMS: Gefahr, Absichern / Abstand, Menschenleben retten, Spezialkräfte.","ort":"S. 17"},{"text":"3 W: Warnweste, Warnblinker, Warndreieck. Wichtig, wo man sie aufstellt.","ort":"S. 17 und Unterricht"}]},{"id":"bas","titel":"Basismaßnahmen und Lagerungen","seiten":"S. 18 bis 19","kern":"Vier Basismaßnahmen kommen sicher zum Test: Lagerung, frische Luft, Wärme, psychische Betreuung. Du empfiehlst sie, du zwingst nichts auf, und sie dürfen nie Lebensrettendes verzögern.","punkte":["★ Lagerung: so, wie es angenehm ist und weniger weh tut.","★ Frische Luft: Fenster auf, enge Kleidung lockern, ruhig atmen lassen.","★ Wärme: zudecken und die Decke auch unter die Person stopfen. Bei Verdacht auf Becken oder Wirbelsäule nicht umlagern.","★ Psychische Betreuung, Look, Listen, Link: hinschauen, zuhören, Hilfe und Angehörige holen.","★ Lagerungen aus dem Unterricht: Beine zum Bauch anziehen (Bauchschmerzen), Seitenlage (wach, aber übel oder schläfrig), vornübergebeugt (Atemnot, Asthma), Rückenlage mit angewinkelten Beinen in L-Form (Kreislaufprobleme)."],"merke":"Seitenlage ist nicht die stabile Seitenlage: Seitenlage für Wache, stabile Seitenlage für Bewusstlose, die normal atmen.","notizen":[{"text":"Wann welche Lage ist prüfungswichtig. Beine anziehen: Bauchschmerzen, entlastet die Bauchdecke. Seitenlage: bei Bewusstsein, aber übel oder schläfrig, damit bei Erbrechen die Atemwege frei bleiben. Vornübergebeugt: Atemnot, Asthma. Beine angewinkelt (L-Form, am Rücken am Boden): Kreislaufprobleme.","ort":"S. 19 und Unterricht"},{"text":"Transmissionswärme: Man verliert auch über den Boden Wärme, deshalb die Decke unter die Person stopfen, nicht nur drüberlegen.","ort":"S. 19 und Unterricht"}]},{"id":"weg","titel":"Wegziehen und Umdrehen","seiten":"S. 20 bis 21","kern":"Arme am Boden nach oben führen, hinter dem Kopf überkreuzen und an den Handgelenken wegziehen. Aus der Bauchlage gleich. Nur, wenn du dich dabei nicht selbst gefährdest.","punkte":["Vorher absichern, wenn möglich.","Arme beim Hochführen am Boden lassen. Der Kopf liegt im besten Fall zwischen den Armen, damit er nicht wegkippt.","Umdrehen aus der Bauchlage: Arm beim Kopf ausstrecken, an Becken und Schulter fassen, zu dir drehen, nicht übers Gesicht.","Danach Atmung prüfen."],"merke":"Arme hoch, kreuzen, Handgelenke, ziehen.","bilder":[{"src":"wegziehen-1","text":"Arme am Boden nach oben führen"},{"src":"wegziehen-2","text":"Unter dem Kopf überkreuzen"},{"src":"wegziehen-3","text":"An den Handgelenken wegziehen"}],"notizen":[]},{"id":"reg","titel":"Notfallcheck","seiten":"S. 22 bis 23","kern":"Kommt 100 % zur praktischen Prüfung. Ablauf wie im Unterricht, laut ansagen, was du tust. Die entscheidende Frage: Atmet die Person normal?","punkte":["★ 1 Umgebung sichern, laut sagen: „Umgebung sicher.“","★ 2 Zur Person, an den Schultern rütteln: „Hallo, hallo, können Sie mich hören?“","★ 3 Keine Reaktion: laut um Hilfe rufen.","★ 4 Aufgaben verteilen: „Du rufst die Rettung.“ „Du holst den Defi.“ „Du holst den Verbandskasten.“","★ 5 Atemwege prüfen, nötigenfalls freimachen, Kopf überstrecken.","★ 6 Atemkontrolle höchstens 10 Sekunden: Ohr zu Mund und Nase, Blick auf den Brustkorb.","★ 7 Atmet normal: stabile Seitenlage. Atmet nicht normal: Herzdruckmassage.","Schnappatmung oder vereinzelte Atemzüge sind keine normale Atmung."],"merke":"Unsicher? Keine Atmung. Lieber drücken.","notizen":[{"text":"Wenn unsicher, dann KEINE ATMUNG. Wacht die Person beim Drücken auf, merkt man es. Andersrum stirbt sie in der stabilen Seitenlage.","ort":"S. 22 und Unterricht"},{"text":"Eine bewusstlose Person ist immer kritisch, akute Lebensgefahr. Als Sanitäter immer den Notarzt nachfordern.","ort":"S. 22 und Unterricht"}]},{"id":"ssl","titel":"Stabile Seitenlage","seiten":"S. 24 bis 25","kern":"Für Bewusstlose, die normal atmen, weil Zunge, Erbrochenes oder Blut sonst die Atemwege verlegen. Muss für die Prüfung sitzen, dabei erzählen, was du machst.","punkte":["★ 1 Notfallcheck: Person atmet. Neben sie knien.","★ 2 Näheren Arm im rechten Winkel zur Person ablegen.","★ 3 Ferne Hand aufs ferne Knie legen und das Knie gleichzeitig hochziehen, so weit wie möglich.","★ 4 Am Knie zu dir ziehen.","★ 5 Kopf kurz anheben, die Hand, die am Knie lag, unter den Kopf legen.","★ 6 Kopf überstrecken, Mund öffnen (Mund ist der tiefste Punkt).","★ 7 Atmung laufend kontrollieren (jede Minute), Wärme, Basismaßnahmen.","Allein ohne Hilfe: Notruf spätestens nach der Seitenlage."],"merke":"Knie ganz hoch, sonst wird eine Bauchlage daraus.","notizen":[{"text":"Stabile Seitenlage muss für die Prüfung sitzen. Erzählen, was man gerade macht.","ort":"S. 23"},{"text":"Auch in der stabilen Seitenlage immer die Atmung kontrollieren, nicht dass die Person aufhört zu atmen.","ort":"Unterricht"}]},{"id":"wie","titel":"Wiederbelebung","seiten":"S. 26 bis 27","kern":"Keine Reaktion und keine normale Atmung heißt Atem-Kreislauf-Stillstand. Dann sofort 30 Mal drücken, 2 Mal beatmen, bis die Person normal atmet oder der Rettungsdienst übernimmt. Vor allem Praxis.","punkte":["Harter Untergrund, Handballen auf die Brustmitte, Arme durchgestreckt.","Schnell und kräftig, nach jedem Druck ganz entlasten (Leitlinie: 5 bis 6 cm, 100 bis 120 pro Minute).","Beatmung nur, wenn du sie kannst, sonst ohne Pause durchdrücken. Beatmungstuch.","Trainierte Helfer wechseln alle 2 Minuten. Rippenbrüche heilen, Nichtstun ist tödlich."],"merke":"30 : 2, hart, schnell, entlasten, nicht aufhören.","notizen":[]},{"id":"def","titel":"Defibrillator (AED)","seiten":"S. 28 bis 29","kern":"Der Defi unterbricht mit einem Stromstoß das Kammerflimmern, er ersetzt das Drücken nicht. Einschalten, Anweisungen folgen, nur in Analyse und Schock die Hände weg.","punkte":["Einer drückt weiter, der andere schaltet ein und klebt die Elektroden auf die nackte, trockene Brust.","★ Analysephase und Schock: nicht drücken, niemand berührt die Person.","★ Kammerflimmern: Der Defi gibt immer einen Schock (so ist die Prüfungssituation).","★ Asystolie, gar kein Herzschlag: kein Schock, nur Drücken hilft.","Elektroden normal: rechts unter dem Schlüsselbein und links seitlich unter der Achsel. Kleine Kinder: vorne und hinten.","Nässe abtrocknen, starke Behaarung notfalls rasieren, Drücken hat Vorrang."],"merke":"Einschalten und tun, was er sagt.","ergaenzung":["Nachgeschaut: Schockbar sind Kammerflimmern und pulslose ventrikuläre Tachykardie. Nicht schockbar sind Asystolie (Nulllinie, keine elektrische Aktivität) und pulslose elektrische Aktivität. Bei Kindern, wenn vorhanden, Kinder-Elektroden; ist das Kind zu klein für zwei Elektroden vorne, eine vorne in die Brustmitte und eine hinten zwischen die Schulterblätter."],"notizen":[{"text":"Bei der Analysephase nicht drücken.","ort":"S. 29"},{"text":"Bei Herzkammerflimmern gibt der Defi immer Schock ab, das wird die Situation in der Prüfung sein.","ort":"S. 29 und Unterricht"},{"text":"Wenn gar kein Herzschlag, dann hilft kein Defi (Asystolie).","ort":"S. 29"},{"text":"Bei kleinen Kindern Elektroden vorne und hinten, nicht wie sonst seitlich und oben.","ort":"S. 29 und Unterricht"}]},{"id":"ver","titel":"Verschlucken","seiten":"S. 30 bis 31","kern":"Hustet die Person kräftig: leichte Verlegung, weiter husten lassen. Kann sie nicht atmen, sprechen oder husten: schwere Verlegung, 5 Rückenschläge und 5 Heimlich im Wechsel.","punkte":["Rückenschläge: vorbeugen, am Brustkorb stützen, bis 5 Mal mit der flachen Hand zwischen die Schulterblätter.","Heimlich: hinter die Person, Faust zwischen Nabel und Brustkorb, bis 5 Mal kräftig nach innen oben.","Danach immer ins Krankenhaus. Bewusstlos: Wiederbelebung."],"merke":"5 Schläge, 5 Heimlich, im Wechsel.","notizen":[]},{"id":"blu","titel":"Starke Blutung","seiten":"S. 32","kern":"Spritzt Blut oder läuft es im Schwall, behandelst du es als starke Blutung. Handschuhe an, dann Druck: mit der Hand oder mit Druckverband.","punkte":["Manueller Druck: geht überall. Am Anfang die Person selbst drücken lassen.","Druckverband: nur an Armen und Beinen, du hast die Hände frei.","★ Druckkörper: größer als die Wunde, saugfähig, passt sich der Körperform an.","Blutet es durch: zusätzlich mit der Hand auf den Verband drücken."],"merke":"Druck stillt jede sichtbare Blutung.","notizen":[{"text":"Druckkörper und seine Eigenschaften kommen zur Prüfung (Kreuz am Rand).","ort":"S. 32"}]}],"karten":[{"id":"ork01","t":"ork","f":"Wer legte den Grundstein für das Rote Kreuz, wann, und seit wann gibt es das ÖRK?","a":["Henry Dunant, Schweizer Geschäftsmann, in den 1860er-Jahren","ÖRK seit 1880","Heute weltweit 192 Gesellschaften, koordiniert aus Genf"],"s":"S. 12"},{"id":"ork02","t":"ork","f":"Nenne die sieben Rotkreuz-Grundsätze.","a":["Menschlichkeit, Unparteilichkeit, Neutralität, Unabhängigkeit, Freiwilligkeit, Einheit, Universalität","Eselsbrücke: „Manche Unfälle nehmen uns fast echt unvorbereitet“"],"s":"S. 12","p":true},{"id":"ork03","t":"ork","f":"Nenne die acht Berufs- und Tätigkeitspflichten.","a":["Gut arbeiten: Sorgfalt, Dokumentation, Fortbildung","Mit Information umgehen: Verschwiegenheit, Auskunft, Mitteilung, Anzeige","Helfen: Hilfeleistung"],"s":"S. 15","p":true},{"id":"ork04","t":"ork","f":"Wer muss in Österreich für das Rettungswesen sorgen?","a":["Die Gemeinden","Sie übertragen es meist dem Roten Kreuz"],"s":"S. 15"},{"id":"abc01","t":"abc","f":"Wofür stehen SSS, EE und ABCDE?","a":["SSS: Szene, Sicherheit, Situation","EE: Erster Eindruck","A: Airway, Atemwege","B: Breathing, Atmung","C: Circulation, Kreislauf","D: Disability, Neurologie","E: Exposure, Entkleiden/Entscheiden"],"s":"S. 16","p":true},{"id":"abc02","t":"abc","f":"Welches Motto steht hinter dem ABCDE-Schema?","a":["„Treat first what kills first“: Behandle zuerst, was zuerst tötet"],"s":"S. 16","p":true},{"id":"abc03","t":"abc","f":"Worum geht es bei SSS und beim Ersten Eindruck (EE)?","a":["SSS: eigene Sicherheit, Team und Patient:in schützen","EE: Notfall erfassen, lebensbedrohliche Blutungen sofort stillen"],"s":"S. 16","p":true},{"id":"abc04","t":"abc","f":"Worum geht es bei A und bei B?","a":["A: Atemwege freimachen und freihalten","B: Atmung und Sauerstoffversorgung sichern, nötigenfalls Wiederbelebung"],"s":"S. 16","p":true},{"id":"abc05","t":"abc","f":"Worum geht es bei C, D und E?","a":["C: schwere Kreislaufprobleme feststellen","D: schwere neurologische Störungen erkennen","E: entkleiden, nichts Wichtiges übersehen, entscheiden"],"s":"S. 16","p":true},{"id":"abc06","t":"abc","f":"Du stufst eine Person als kritisch ein. Was tust du?","a":["Notarzt nachfordern","Wenn kein Notarztmittel rechtzeitig verfügbar ist: schneller Transport ins Krankenhaus"],"s":"S. 16","p":true},{"id":"abc07","t":"abc","f":"Was unterscheidet den Notfallcheck vom ABCDE-Schema?","a":["Sie sind sich ähnlich","Notfallcheck: Sicht der Ersthelfer","ABCDE: Sicht der Rettungssanitäter, strukturierte Beurteilung"],"s":"S. 16, S. 22","n":"Das eine ist die Erste-Hilfe-Perspektive, das ABC ist dann für Rettungssanitäter."},{"id":"nr122a","t":"not","f":"Welche Nummer hat die Feuerwehr?","a":["122"],"s":"S. 17","p":true},{"id":"nr122b","t":"not","f":"Wen erreichst du unter 122?","a":["Feuerwehr"],"s":"S. 17","p":true},{"id":"nr133a","t":"not","f":"Welche Nummer hat die Polizei?","a":["133"],"s":"S. 17","p":true},{"id":"nr133b","t":"not","f":"Wen erreichst du unter 133?","a":["Polizei"],"s":"S. 17","p":true},{"id":"nr144a","t":"not","f":"Welche Nummer hat der Rettungsdienst?","a":["144"],"s":"S. 17","p":true},{"id":"nr144b","t":"not","f":"Wen erreichst du unter 144, und was macht die Leitstelle für dich?","a":["Rettungsdienst","Leitet die Erste Hilfe am Telefon an und sagt dir, wo der nächste Defi ist"],"s":"S. 17","p":true},{"id":"nr112a","t":"not","f":"Welche Nummer ist der Euro-Notruf?","a":["112"],"s":"S. 17","p":true},{"id":"nr112b","t":"not","f":"Was ist 112, wo landest du in Österreich, und was ist der Vorteil?","a":["Euro-Notruf, in ganz Europa gleich","In Österreich bei der Polizei","Geht ohne SIM, Vertrag, Guthaben oder Heimatnetz, über jedes verfügbare Netz"],"s":"S. 17","p":true},{"id":"nr1450a","t":"not","f":"Welche Nummer hat die telefonische Gesundheitsberatung?","a":["1450"],"s":"S. 17","p":true},{"id":"nr1450b","t":"not","f":"Was ist 1450, und wann rufst du dort an?","a":["Telefonische Gesundheitsberatung, 0 bis 24 Uhr","Bei Beschwerden, die kein Notfall sind"],"s":"S. 17","p":true},{"id":"nr140a","t":"not","f":"Welche Nummer hat die Bergrettung?","a":["140"],"s":"S. 17","p":true},{"id":"nr140b","t":"not","f":"Wen erreichst du unter 140?","a":["Bergrettung"],"s":"S. 17","p":true},{"id":"nr141a","t":"not","f":"Welche Nummer hat der Ärztenotdienst?","a":["141"],"s":"S. 17","p":true},{"id":"nr141b","t":"not","f":"Wen erreichst du unter 141?","a":["Ärztenotdienst, ärztlicher Bereitschaftsdienst"],"s":"S. 17","p":true},{"id":"nr142a","t":"not","f":"Welche Nummer hat die Telefonseelsorge?","a":["142"],"s":"S. 17","p":true},{"id":"nr142b","t":"not","f":"Wen erreichst du unter 142?","a":["Telefonseelsorge"],"s":"S. 17","p":true},{"id":"nr147a","t":"not","f":"Welche Nummer hat Rat auf Draht?","a":["147"],"s":"S. 17","p":true},{"id":"nr147b","t":"not","f":"Wen erreichst du unter 147?","a":["Rat auf Draht"],"s":"S. 17","p":true},{"id":"nr116a","t":"not","f":"Welche Nummer hat die Ö3 Kummernummer?","a":["116 123"],"s":"S. 17","p":true},{"id":"nr116b","t":"not","f":"Wen erreichst du unter 116 123?","a":["Ö3 Kummernummer"],"s":"S. 17","p":true},{"id":"nrvizA","t":"not","f":"Welche Nummer hat die Vergiftungsinformationszentrale?","a":["+43 1 406 43 43"],"s":"S. 17","p":true,"n":"Kommt 100 % zur Prüfung."},{"id":"nrvizB","t":"not","f":"Wen erreichst du unter +43 1 406 43 43?","a":["Vergiftungsinformationszentrale"],"s":"S. 17","p":true,"n":"Kommt 100 % zur Prüfung."},{"id":"not06","t":"not","f":"Wann ist ein Notruf abgeschlossen, und was tust du währenddessen?","a":["Erst wenn die Leitstelle das Gespräch beendet","Fragen beantworten, Freisprechen nutzen, parallel Erste Hilfe leisten","Die Einsatzkräfte sind schon während des Gesprächs alarmiert"],"s":"S. 17"},{"id":"not07","t":"not","f":"Verkehrsunfall mit eingeklemmter Person: Musst du Feuerwehr und Polizei extra anrufen?","a":["Nein, eine Nummer reicht","Die Leitstelle alarmiert Feuerwehr und Polizei mit, wenn du die Lage schilderst"],"s":"S. 17"},{"id":"not10","t":"not","f":"Warum musst du dein Material kennen?","a":["Was du nicht genau kennst, findest du in der Stresssituation erst recht nicht","Z. B. die Rettungstasche in einem neuen Auto"],"s":"S. 17, Unterricht","n":"Kenn dein Material."},{"id":"gams1","t":"not","f":"Wofür steht GAMS?","a":["G: Gefahr erkennen","A: Absichern, Absperren, Abstand halten","M: Menschenleben retten","S: Spezialkräfte nachfordern"],"s":"S. 17, Unterricht","p":true,"n":"Gefahr, Absichern / Abstand, Menschenleben retten, Spezialkräfte."},{"id":"gams2","t":"not","f":"Was bedeuten die vier Schritte von GAMS konkret?","a":["G: beobachten, Warntafeln lesen, im Zweifel die größte Gefahr annehmen","A: Bereich absperren, selbst Abstand halten, nicht in die Gefahr gehen","M: Menschen retten nur ohne Eigengefährdung, sonst Leute aus dem Bereich rufen","S: Feuerwehr, Polizei, Gefahrgutkräfte nachfordern, Nummern der Warntafel durchgeben"],"s":"nachgeschlagen","q":"e"},{"id":"dreiw","t":"not","f":"Welche 3 W brauchst du bei einem Autounfall, und in welcher Reihenfolge?","a":["Warnblinker einschalten","Warnweste noch im Auto anziehen","Warndreieck aufstellen, in ausreichendem Abstand vor der Unfallstelle","Abstände: Lehrbuch S. 34 (folgt mit dem nächsten Scan)"],"s":"S. 17, Unterricht","p":true,"n":"3 W: Warnweste, Warnblinker, Warndreieck. Wichtig, wo man sie aufstellt."},{"id":"bas01","t":"bas","f":"Nenne die vier Basismaßnahmen.","a":["Lagerung","Frische Luft","Wärme","Psychische Betreuung"],"s":"S. 18 bis 19","p":true},{"id":"bas02","t":"bas","f":"Was sind Basismaßnahmen, und was dürfen sie nie?","a":["Maßnahmen, die bei jedem Notfall gehen, körperlich und psychisch","Du empfiehlst sie, du zwingst sie nicht auf","Sie dürfen lebensrettende Maßnahmen nie verzögern"],"s":"S. 18","p":true},{"id":"bas03","t":"bas","f":"Was gehört zur frischen Luft?","a":["Fenster auf","Enge Kleidung lockern","Ruhig atmen lassen"],"s":"S. 18","p":true},{"id":"bas04","t":"bas","f":"Wie hältst du eine Person warm, und worauf achtest du?","a":["Zudecken und die Decke auch unter die Person stopfen","Grund: Transmissionswärme, man verliert auch über den Boden Wärme","Bei Verdacht auf Becken- oder Wirbelsäulenverletzung nicht umlagern"],"s":"S. 19","p":true,"n":"Auch unter die Person, nicht nur drüber legen."},{"id":"bas05","t":"bas","f":"Was bedeutet Look, Listen, Link?","a":["Look: hinschauen, Stresssignale wahrnehmen","Listen: aktiv zuhören, Bedürfnisse erfragen","Link: Angehörige und weitere Hilfe holen"],"s":"S. 19","p":true},{"id":"lag01","t":"bas","f":"Welche vier Lagerungen habt ihr gelernt, und wofür?","a":["Beine zum Bauch anziehen: Bauchschmerzen","Seitenlage: wach, aber übel oder schläfrig","Vornübergebeugt: Atemnot, Asthma","Rückenlage, Beine angewinkelt (L-Form): Kreislaufprobleme"],"s":"S. 19, Unterricht","p":true},{"id":"lag02","t":"bas","f":"Eine Person hat starke Bauchschmerzen. Wie lagerst du sie, und warum?","a":["Beine Richtung Bauch anziehen","Das entlastet die Bauchdecke"],"s":"Unterricht","p":true},{"id":"lag03","t":"bas","f":"Eine Person ist bei Bewusstsein, ihr ist übel und sie ist schläfrig. Wie lagerst du sie?","a":["Seitenlage (nicht die stabile Seitenlage)","Bleiben die Atemwege frei, falls sie erbricht"],"s":"Unterricht","p":true},{"id":"lag04","t":"bas","f":"Eine Person hat Atemnot oder einen Asthmaanfall. Wie lagerst du sie?","a":["Vornübergebeugt, sitzend, Arme abstützen","Oberkörper hoch"],"s":"S. 18, Unterricht","p":true},{"id":"lag05","t":"bas","f":"Eine Person hat Kreislaufprobleme. Wie lagerst du sie?","a":["Am Rücken auf dem Boden, Beine angewinkelt hoch (L-Form)"],"s":"Unterricht","p":true},{"id":"lag06","t":"bas","f":"Was ist der Unterschied zwischen Seitenlage und stabiler Seitenlage?","a":["Seitenlage: Person ist bei Bewusstsein, aber übel oder schläfrig","Stabile Seitenlage: Person ist bewusstlos und atmet normal"],"s":"Unterricht, S. 24","p":true},{"id":"weg01","t":"weg","f":"Wie ziehst du eine reglose Person aus der Gefahrenzone?","a":["Nur ohne Eigengefährdung, vorher wenn möglich absichern","Arme am Boden lassen und nach oben führen","Hinter dem Kopf überkreuzen, Kopf möglichst zwischen den Armen","An den Handgelenken wegziehen","Aus der Bauchlage genauso"],"s":"S. 20 bis 21","b":["wegziehen-1","wegziehen-2","wegziehen-3"]},{"id":"weg02","t":"weg","f":"Wie drehst du eine reglose Person aus der Bauchlage auf den Rücken?","a":["Arm beim Kopf ausstrecken","An Becken und Schulter der Gegenseite fassen","Zu dir drehen, möglichst nicht übers Gesicht","Danach Atmung prüfen"],"s":"S. 20 bis 21"},{"id":"reg02","t":"reg","f":"Notfallcheck: Wie läuft er ab? Sag es laut wie in der Prüfung.","a":["1 Umgebung sichern: „Umgebung sicher.“","2 An den Schultern rütteln: „Hallo, hallo, können Sie mich hören?“","3 Keine Reaktion: laut um Hilfe rufen","4 Aufgaben verteilen: Rettung rufen, Defi holen, Verbandskasten holen","5 Atemwege prüfen, ggf. freimachen, Kopf überstrecken","6 Max. 10 s Atemkontrolle: Ohr zu Mund und Nase, Blick auf den Brustkorb","7 Atmet: stabile Seitenlage. Atmet nicht: Herzdruckmassage"],"s":"S. 22 bis 23, Unterricht","p":true},{"id":"reg09","t":"reg","f":"Wie verteilst du beim Notfallcheck die Aufgaben?","a":["Personen direkt ansprechen","„Du rufst die Rettung (144).“","„Du holst den Defi.“","„Du holst den Verbandskasten.“"],"s":"Unterricht","p":true},{"id":"reg05","t":"reg","f":"Du bist unsicher, ob die Person normal atmet. Was gilt, und warum?","a":["Keine normale Atmung annehmen, sofort drücken","Wacht die Person beim Drücken auf, merkst du es","Andersrum stirbt sie in der stabilen Seitenlage"],"s":"S. 22, Unterricht","p":true,"n":"Wenn unsicher, dann KEINE ATMUNG."},{"id":"reg10","t":"reg","f":"Du findest als Sanitäter:in eine bewusstlose Person. Wie schätzt du die Lage ein?","a":["Immer kritisch, akute Lebensgefahr","Immer Notarzt nachfordern"],"s":"Unterricht","p":true,"n":"Bewusstlos ist immer kritisch, Notarzt nachfordern."},{"id":"reg03","t":"reg","f":"Warum überstreckst du bei einer reglosen Person den Kopf?","a":["Die Muskulatur ist schlaff, die Zunge sinkt nach hinten und verlegt die Atemwege","Überstrecken macht sie frei"],"s":"S. 22"},{"id":"reg06","t":"reg","f":"Woran unterscheidest du Bewusstlosigkeit und Atem-Kreislauf-Stillstand?","a":["Beide: keine Reaktion auf Ansprechen","Bewusstlosigkeit: normale Atmung, stabile Seitenlage","Atem-Kreislauf-Stillstand: keine normale Atmung, Wiederbelebung"],"s":"S. 22, S. 28","p":true},{"id":"reg07","t":"reg","f":"Ist Schnappatmung eine normale Atmung?","a":["Nein","Vereinzelte, unregelmäßige oder langsame Atemzüge und Schnappen nach Luft sind keine normale Atmung"],"s":"S. 24, S. 26"},{"id":"ssl01","t":"ssl","f":"Warum braucht eine bewusstlose Person, die normal atmet, die stabile Seitenlage?","a":["Zunge, Erbrochenes, Blut oder Speichel können die Atemwege verlegen","Ohne Seitenlage droht der Erstickungstod"],"s":"S. 24"},{"id":"ssl02","t":"ssl","f":"Stabile Seitenlage: Wie gehst du vor? Erzähl laut, was du machst.","a":["1 Notfallcheck: Person atmet, neben sie knien","2 Näheren Arm im rechten Winkel ablegen","3 Ferne Hand aufs ferne Knie legen, Knie gleichzeitig so weit wie möglich hochziehen","4 Am Knie zu dir ziehen","5 Kopf kurz anheben, die Hand vom Knie unter den Kopf legen","6 Kopf überstrecken, Mund öffnen","7 Atmung laufend kontrollieren"],"s":"S. 24 bis 25, Unterricht","p":true,"n":"Muss für die Prüfung sitzen. Erzählen, was man gerade macht."},{"id":"ssl03","t":"ssl","f":"Warum ziehst du das Knie bei der stabilen Seitenlage so weit wie möglich hoch?","a":["Sonst rollt die Person weiter und es wird eine Bauchlage daraus"],"s":"Unterricht","p":true},{"id":"ssl04","t":"ssl","f":"Die Person liegt in der stabilen Seitenlage. Was tust du jetzt?","a":["Atmung laufend kontrollieren, jede Minute","Hört sie auf zu atmen: Wiederbelebung","Basismaßnahmen, z. B. Wärme"],"s":"S. 24, Unterricht","p":true,"n":"Immer die Atmung kontrollieren, nicht dass sie aufhört zu atmen."},{"id":"ssl05","t":"ssl","f":"Du bist allein, niemand kann helfen. Wann setzt du den Notruf ab, wenn die Person normal atmet?","a":["Spätestens nach der stabilen Seitenlage"],"s":"S. 24"},{"id":"wie01","t":"wie","f":"Woran erkennst du einen Atem-Kreislauf-Stillstand?","a":["Keine Reaktion auf Ansprechen und Rütteln","Keine oder keine normale Atmung"],"s":"S. 26","p":true},{"id":"wie02","t":"wie","f":"In welchem Verhältnis drückst und beatmest du?","a":["30 Herzdruckmassagen : 2 Beatmungen"],"s":"S. 26","p":true},{"id":"wie03","t":"wie","f":"Wie drückst du richtig?","a":["Harter Untergrund, Handballen auf die Brustmitte, zweite Hand darüber","Arme durchgestreckt, Oberkörper senkrecht darüber","Schnell und kräftig, nach jedem Druck ganz entlasten","Leitlinie: 5 bis 6 cm tief, 100 bis 120 pro Minute"],"s":"S. 26 bis 27","p":true},{"id":"wie04","t":"wie","f":"Du kannst oder willst nicht beatmen. Was dann?","a":["Ohne Pause durchdrücken","Beatmung nur, wenn du sie kannst, bei Fremden mit Beatmungstuch"],"s":"S. 26"},{"id":"wie05","t":"wie","f":"Wie lange führst du die Wiederbelebung durch?","a":["Bis die Person wieder normal atmet oder der Rettungsdienst übernimmt","Trainierte Helfer wechseln alle 2 Minuten"],"s":"S. 26"},{"id":"wie06","t":"wie","f":"Ein Passant ruft: „Hör auf, du brichst ihr die Rippen!“ Was tust du?","a":["Weiterdrücken","Eine Rippe heilt, eine unterlassene Herzdruckmassage führt zum Tod"],"s":"S. 26"},{"id":"def01","t":"def","f":"Was bewirkt ein Defibrillator, und was kann er nicht?","a":["Ein Stromstoß unterbricht das unkoordinierte Zucken des Herzens","Er ersetzt das Drücken und Beatmen nicht"],"s":"S. 28"},{"id":"def02","t":"def","f":"Ihr seid zu zweit und habt einen AED. Wer macht was?","a":["Einer drückt und beatmet ohne Pause weiter","Der andere schaltet ein, folgt den Anweisungen, klebt die Elektroden auf die nackte, trockene Brust"],"s":"S. 28 bis 29"},{"id":"def03","t":"def","f":"Wann hörst du beim AED auf zu drücken?","a":["Nur in der Analysephase und beim Schock","Dann berührt niemand die Person"],"s":"S. 28 bis 29","p":true,"n":"Bei der Analysephase nicht drücken."},{"id":"def10","t":"def","f":"Die Person hat Kammerflimmern. Gibt der Defi einen Schock?","a":["Ja, bei Kammerflimmern immer","So ist die Situation in der Prüfung"],"s":"S. 29, Unterricht","p":true,"n":"Bei Herzkammerflimmern gibt der Defi immer Schock ab."},{"id":"def11","t":"def","f":"Was ist eine Asystolie, und hilft der Defi?","a":["Gar kein Herzschlag, keine elektrische Aktivität (Nulllinie)","Der Defi gibt keinen Schock","Nur Drücken hilft"],"s":"S. 29, Unterricht","p":true,"n":"Wenn gar kein Herzschlag, dann hilft kein Defi (Asystolie)."},{"id":"def12","t":"def","f":"Welche Herzrhythmen sind schockbar, welche nicht?","a":["Schockbar: Kammerflimmern, pulslose ventrikuläre Tachykardie","Nicht schockbar: Asystolie, pulslose elektrische Aktivität"],"s":"nachgeschlagen","q":"e"},{"id":"def13","t":"def","f":"Wo klebst du die Elektroden bei Erwachsenen hin?","a":["Rechts oben unter dem Schlüsselbein, neben dem Brustbein","Links seitlich am Brustkorb, unter der Achsel"],"s":"Bild auf den Elektroden","q":"e"},{"id":"def06","t":"def","f":"Bei einem kleinen Kind ist vorne kein Platz für zwei Elektroden. Was tust du?","a":["Eine vorne in die Brustmitte, eine hinten zwischen die Schulterblätter","Kinder-Elektroden nehmen, wenn vorhanden"],"s":"S. 29, Unterricht","p":true,"n":"Bei kleinen Kindern vorne und hinten."},{"id":"def04","t":"def","f":"Welche Sicherheitsregeln gelten beim AED?","a":["Nasse Brust abtrocknen","Starke Behaarung notfalls rasieren, Drücken hat Vorrang","Keine Nässe als Stromverbindung","Beim Schock berührt niemand die Person"],"s":"S. 28"},{"id":"ver01","t":"ver","f":"Woran unterscheidest du leichte und schwere Verlegung der Atemwege?","a":["Leicht: Person hustet kräftig, weiter husten lassen","Schwer: kann nicht atmen, sprechen oder husten, Lebensgefahr"],"s":"S. 30","p":true},{"id":"ver03","t":"ver","f":"Wie gehst du bei einer schweren Verlegung vor?","a":["Notruf veranlassen","Vorbeugen, stützen, bis 5 Schläge zwischen die Schulterblätter","Dann bis 5 Heimlich-Griffe","Im Wechsel wiederholen","Danach immer ins Krankenhaus"],"s":"S. 30 bis 31","p":true},{"id":"ver04","t":"ver","f":"Wie geht der Heimlich-Griff?","a":["Hinter die Person, Arme um den Oberbauch","Faust zwischen Nabel und Brustkorb","Bis 5 Mal kräftig nach innen und oben ziehen"],"s":"S. 31"},{"id":"ver06","t":"ver","f":"Die Person mit dem Fremdkörper wird bewusstlos. Was jetzt?","a":["Atem-Kreislauf-Stillstand: sofort Wiederbelebung","Vor dem Beatmen sichtbare Fremdkörper aus dem Mund holen"],"s":"S. 30"},{"id":"blu01","t":"blu","f":"Woran erkennst du eine starke Blutung?","a":["Blut spritzt oder kommt im Schwall","Im Zweifel als stark behandeln"],"s":"S. 32"},{"id":"blu02","t":"blu","f":"Welche zwei Möglichkeiten hast du, eine starke Blutung zu stillen?","a":["Manueller Druck: geht überall","Druckverband: nur an Armen und Beinen, Hände werden frei"],"s":"S. 32","p":true},{"id":"blu03","t":"blu","f":"Welche drei Eigenschaften muss ein Druckkörper haben?","a":["Größer als die Wunde","Saugfähig","Passt sich der Körperform an"],"s":"S. 32","p":true,"n":"Kommt zur Prüfung."},{"id":"blu04","t":"blu","f":"Es blutet durch den Druckverband durch. Was tust du?","a":["Zusätzlich mit der Hand auf den Druckverband drücken"],"s":"S. 32"},{"id":"blu06","t":"blu","f":"Was ist dein erster Schritt bei einer starken Blutung?","a":["Einmalhandschuhe anziehen","Die Person selbst fest auf die Wunde drücken lassen"],"s":"S. 32"},{"id":"fall01","t":"reg","typ":"fall","f":"Im Park liegt ein Mann am Boden und reagiert nicht. Spiel den Notfallcheck durch.","a":["„Umgebung sicher.“","Rütteln: „Hallo, hallo, können Sie mich hören?“","Laut um Hilfe rufen, Aufgaben verteilen (Rettung, Defi, Verbandskasten)","Atemwege frei, Kopf überstrecken, max. 10 s Atmung prüfen","Atmet: stabile Seitenlage, laufend kontrollieren","Atmet nicht oder unsicher: 30 : 2, Defi"],"s":"S. 22 bis 27","p":true},{"id":"fall02","t":"reg","typ":"fall","f":"Bei der Atemkontrolle hörst du alle paar Sekunden ein schnappendes Geräusch. Was tust du?","a":["Schnappatmung ist keine normale Atmung","Sofort Wiederbelebung, Defi holen lassen"],"s":"S. 24, S. 26"},{"id":"fall03","t":"ver","typ":"fall","f":"Im Restaurant greift sich eine Frau an den Hals, sie kann nicht sprechen und nicht husten. Was tust du?","a":["Schwere Verlegung: Notruf veranlassen","Bis 5 Rückenschläge, bis 5 Heimlich, im Wechsel","Wird sie bewusstlos: Wiederbelebung","Danach ins Krankenhaus"],"s":"S. 30 bis 31","p":true},{"id":"fall04","t":"def","typ":"fall","f":"Prüfungssituation: Du drückst, der AED analysiert und meldet Kammerflimmern. Was passiert, was tust du?","a":["Während der Analyse: Hände weg","Bei Kammerflimmern gibt der Defi einen Schock: alle weg, Schock auslösen","Danach sofort weiterdrücken, Anweisungen folgen"],"s":"S. 28 bis 29","p":true},{"id":"fall05","t":"blu","typ":"fall","f":"Aus einer Wunde am Unterarm spritzt Blut, ein Verbandskoffer ist da. Was tust du?","a":["Handschuhe, Person selbst drücken lassen oder selbst drücken","Notruf veranlassen","Druckverband mit Druckkörper (größer, saugfähig, anschmiegsam)","Blutet es durch: zusätzlich drücken","Wärme, betreuen"],"s":"S. 32","p":true},{"id":"fall06","t":"weg","typ":"fall","f":"Auf einer Landstraße liegt nach einem Unfall eine Person reglos auf der Fahrbahn. Was tust du zuerst?","a":["3 W: Warnblinker, Warnweste, Warndreieck","Selbstschutz prüfen","Person wegziehen: Arme hinter dem Kopf kreuzen, an den Handgelenken ziehen","Dann Notfallcheck"],"s":"S. 17, S. 20"},{"id":"fall07","t":"not","typ":"fall","f":"Ein Kind hat aus einer Putzmittelflasche getrunken und ist ansprechbar. Wen rufst du an?","a":["Vergiftungsinformationszentrale +43 1 406 43 43","Bei Beschwerden oder Lebensgefahr: 144"],"s":"S. 17","p":true},{"id":"fall08","t":"bas","typ":"fall","f":"Eine ältere Frau ist ansprechbar, aber sehr kurzatmig. Welche Basismaßnahmen setzt du?","a":["Vornübergebeugt sitzen lassen, Arme abstützen","Frische Luft, enge Kleidung lockern","Look, Listen, Link: beruhigen, zuhören","Notruf, wenn es ein Notfall ist"],"s":"S. 18 bis 19","p":true},{"id":"fall09","t":"abc","typ":"fall","f":"Du kommst als Sanitäter:in zu einer Person, die stark blutet und kaum ansprechbar ist. Woran hältst du dich?","a":["SSS: Szene, Sicherheit, Situation","EE: Erster Eindruck, Blutung sofort stillen","Dann A, B, C, D, E","Kritisch: Notarzt nachfordern"],"s":"S. 16","p":true},{"id":"fall10","t":"not","typ":"fall","f":"Ein Lkw mit orangefarbener Warntafel ist umgekippt, Flüssigkeit läuft aus, der Fahrer sitzt im Führerhaus. Was tust du?","a":["GAMS: Gefahr erkennen, im Zweifel die größte annehmen","Absperren, Abstand halten, nicht hineinlaufen","Den Fahrer nur retten, wenn es ohne Eigengefährdung geht","Spezialkräfte über den Notruf nachfordern, Nummern der Warntafel durchgeben"],"s":"S. 17, nachgeschlagen","q":"e"},{"id":"fall11","t":"bas","typ":"fall","f":"Ein Mann krümmt sich vor Bauchschmerzen, ein anderer ist blass und ihm ist schwindlig. Wie lagerst du die beiden?","a":["Bauchschmerzen: Beine zum Bauch anziehen","Kreislaufprobleme: Rückenlage, Beine angewinkelt hoch (L-Form)"],"s":"Unterricht","p":true}],"id":"rs","titel":"Sani-Lernkartei","bereich":"Sanitäter","untertitel":"Rettungssanitäter:in · Kapitel 1","neuProTag":20,"labels":{"p":"★ Prüfung","fall":"Fall","pFilter":"★ Nur Prüfungsstoff","fallFilter":"Nur Fallbeispiele","quelle":"Lehrbuch ","notiz":"Deine Notiz"}},{"kurs":"SIM video interview","titel":"HSG Interview","bereich":"HSG Interview","untertitel":"SIM video interview (Kira)","lang":"en","quelle":"Your essays (HEC, INSEAD, LBS), your HSG application, official SIM pages and Kira help, research from 8 Nov 2026","stand":"09.11.2026","neuProTag":999,"blattHinweis":"★ = core.","labels":{"p":"★ Core","fall":"Practice","pFilter":"★ Core cards only","fallFilter":"Practice tasks only","quelle":"Source: ","notiz":"Remember"},"themen":[{"id":"hsg-format","titel":"Format and tech","seiten":"2 cards","kern":"8 video questions in about 30 minutes. For each question the question video plays once, then you get prep time, then you answer within a fixed time limit.","punkte":["Unlimited practice questions, only one attempt at the real ones","When time runs out, Kira submits automatically, you can also submit earlier","Reported times are 30 to 60 s prep and 1 to 2 min to answer, the practice run shows the real times","Chrome incognito, laptop plugged in, LAN if possible, notifications off","If the connection drops, press Try again, then contact Kira support and sim@unisg.ch","★ The video counts for 35% of the admission decision"],"merke":"Look into the camera, not at your own image."},{"id":"hsg-sucht","titel":"What SIM looks for","seiten":"0 cards","kern":"According to SIM admissions, the questions are built around five profile traits. Every answer should show at least one of them.","punkte":["★ Global Mindset, shown by the border village, UCLA, Kenya","★ Critical and Creative Thinking, shown by opinion answers with a counterargument, AI bachelor thesis","★ Analytical Aptitude, shown by top 10%, UCLA 4.0, chess top 3%, a cleanly calculated estimate","★ Self-Reflection, shown by EY despite your accounting weakness, sticking with the GMAT, advice to your younger self","★ Maturity and Integrity, shown by the Career Club, Kenya, the Red Cross"],"merke":"Be honest and genuine. According to former SIM admissions staff, that is the only right answer."},{"id":"hsg-formel","titel":"Answer formula","seiten":"0 cards","kern":"Answer first, then an example, then a bridge to SIM or your goal. During prep time, note only three keywords.","punkte":["Sentence 1 answers the question directly","Two to four sentences of example, what YOU did, the result with a number","One bridging sentence, then stop","Better to finish cleanly after 60 to 90 seconds than to be cut off"]},{"id":"hsg-geschichten","titel":"Six stories","seiten":"7 cards","kern":"These six stories answer almost any question. Three keywords per story, tell it freely, do not memorise it word for word.","punkte":["UNHYDE podcast, for leadership, initiative, the CV question","Leaving UNHYDE, for conflict and values","Heimlich manoeuvre and Red Cross, for service and something personal","Kenya, for global mindset","Christopher Oster, for advice and role model","Chess club and Career Club, for community"],"merke":"Use each story at most twice in the whole interview."},{"id":"hsg-werte","titel":"Three messages","kern":"Every answer should leave one of three messages. Answer first, one example, one bridge sentence.","punkte":["Building things from zero, chess club, Career Club, UNHYDE podcast, my own company","Being dependable, head boy, student council, clear expectations at UNHYDE, making sure the podcast kept running after I left","Giving first, Kenya, Career Club, chess lectures, Red Cross"],"merke":"In the interview say them in the first person, I build things from zero, people can depend on me, I give first.","seiten":"5 cards"},{"id":"hsg-pflicht","titel":"Must-have answers","seiten":"5 cards","kern":"These five answers are almost certain to come up or can be adapted to many questions. Practise each out loud two or three times.","punkte":["Why SIM, why St. Gallen, why now","Tell us about yourself","Your contribution to the SIM community","A time you stood up for your values","What service means to you"]},{"id":"hsg-fragen","titel":"More questions","seiten":"9 cards","kern":"Likely questions from applicant reports and the five traits. Three building blocks each.","punkte":["Culture and background","Uncertainty","Weakness","Failure","Responsible leadership","Goals","High performance","Trend","A colleague takes credit for your work"]},{"id":"hsg-denken","titel":"Opinion, estimates, maths","seiten":"20 cards","kern":"Opinion questions and an estimation question have been reported. A pure maths task is not documented but possible. Always think out loud.","punkte":["Opinion, position, two reasons, counterargument, conclusion","Estimates and maths, state your structure, use round numbers, say your assumptions, sanity check, one clear result","Market sizing, top-down from a known total or bottom-up from one unit, ideally check one with the other","Calculate on paper during prep time, then explain your approach and result in the answer"],"ergaenzung":["The maths exercises are GMAT-style and were added by Claude, they are not reported SIM questions.","New estimation exercises from 9 Nov 2026 use the numbers in Benchmarks for estimates."]},{"id":"hsg-benchmarks","titel":"Benchmarks for estimates","kern":"Rounded numbers to anchor any market sizing. Say them as assumptions, I assume about ...","punkte":["Switzerland about 10 million, EU about 500 million","Zurich city about 500,000, canton Zurich about 1.5 million, Geneva, Basel and Bern about 200,000 each, St. Gallen about 100,000","University of St. Gallen about 10,000 students and 2,000 staff, about 6,000 people on campus on a teaching day","Life expectancy about 80, about 100,000 people born and 100,000 dying every year","About half the population works, about 5 million people","About 250 working days and 2,000 working hours a year","Median salary about CHF 5,000 a month, GDP about CHF 1 trillion, 1 CHF roughly 1 EUR"],"merke":"Top-down from these totals, bottom-up from one unit, then check one with the other.","seiten":"7 cards"},{"id":"hsg-fakten","titel":"SIM facts","seiten":"3 cards","kern":"Facts for your Why SIM answer, from the official SIM pages, as of November 2026.","punkte":["FT Masters in Management 2026 rank 1, for the 15th time","3 semesters, 90 ECTS, cohort of around 58, Global SIM Community of over 1,000","SIM International Project, SIMagination Challenge, Strategic Entrepreneurship, Business Model Innovation, BCG as corporate partner"]}],"karten":[{"id":"hsg-g1","t":"hsg-geschichten","p":true,"f":"Story for leadership and initiative, the UNHYDE podcast. Your three keywords?","a":["Built it from zero, concept, brand and the studio myself","Led a team of ten incl. editor and sales, clear expectations both ways, I delivered my part first","Over 1.8 million views in under 30 days, 30 episodes, guests like Klitschko and the MD of Ferrari Central Europe"],"s":"HEC essay question 3, employment reference"},{"id":"hsg-g2","t":"hsg-geschichten","p":true,"f":"Story for conflict and values, leaving UNHYDE. Your three keywords?","a":["Founder dispute froze new projects, I had to dissolve my sales team, the podcast earned no regular income","Being dependable even when leaving, I told my partner early, gave my reasons and listened to his side","The podcast had no future for me, but I made sure it kept running without any damage, supported external recordings on a paid basis. Conflict delayed is conflict multiplied"],"n":"React early, tell the truth, label it as your view, keep asking for the other side.","s":"HEC essay, conflict question"},{"id":"hsg-g3","t":"hsg-geschichten","p":true,"f":"Story for service and something personal, the Heimlich manoeuvre and the Red Cross. Your three keywords?","a":["My girlfriend's little brother choked on food, I did the Heimlich manoeuvre and he was fine","Small effort, huge impact, I wanted to be able to help properly","Paramedic with the Red Cross in Salzburg since 1 November, until July 2027"],"n":"Only since 1 November. Tell it as your reason and motivation, not as long experience.","s":"HEC essay notes, LBS short answer 3"},{"id":"hsg-g4","t":"hsg-geschichten","p":true,"f":"Story for global mindset, Kenya. Your three keywords?","a":["First time on another continent, completely alone, four weeks","Organised fundraising of over €5,000 for the orphanage's secondary school","It put my luck into perspective and showed me I enjoy unfamiliar environments"],"s":"HEC and LBS essays"},{"id":"hsg-g5","t":"hsg-geschichten","p":true,"f":"Story for advice and role model, Christopher Oster. Your three keywords?","a":["Ex-BCG, co-founder and ex-CEO of CLARK, now at Santander, I met him in person","His lesson, consulting gives you the benefit of the doubt when you later found","He stays calm and composed even with many projects at once, that is what I want to learn from him"],"s":"HEC essay, role model"},{"id":"hsg-g6","t":"hsg-geschichten","p":true,"f":"Story for community, the chess club and the Career Club. Your three keywords?","a":["Built the chess club from zero in October 2022 to over 90 members, wrote the lectures myself, led it until August 2025","Founded the Career Club in 2024, under 15% acceptance, gave first by passing on what I learned and connecting members to my former employers","Top 3% worldwide by Elo, also joined the chess club at UCLA"],"s":"LBS short answer 2, HSG CV"},{"id":"hsg-g7","t":"hsg-geschichten","f":"Which story do you use for which type of question?","a":["Leadership, initiative, best CV experience: the podcast","Conflict, values, honesty: leaving UNHYDE","Service, something personal: the Heimlich manoeuvre and the Red Cross","Culture, global mindset: Kenya, plus the border village and UCLA","Advice, role model: Christopher Oster","Community, contribution to SIM: chess club and Career Club","Weakness, perseverance: the GMAT, 595 twice, then 675","End every story with one of your three messages, from zero, dependable, giving first"],"s":"Answer plan","q":"e"},{"id":"hsg-w1","t":"hsg-werte","p":true,"f":"Your three messages?","a":["Building things from zero","Being dependable","Giving first"],"n":"In the interview in the first person, I build things from zero, people can depend on me, I give first.","s":"Your values from 9 Nov 2026"},{"id":"hsg-w2","t":"hsg-werte","p":true,"f":"Proof for building things from zero?","a":["Chess club, from nothing to over 90 members","Career Club, founded in 2024, under 15% acceptance","UNHYDE podcast, built the studio myself, over 1.8 million views in under 30 days","My own company since September 2026, a video course with Roland Trettl, an app, local AI nodes for doctors and lawyers"],"s":"HSG CV, your projects"},{"id":"hsg-w3","t":"hsg-werte","p":true,"f":"Proof for being dependable?","a":["Head boy at school and later in the student council at university, people trusted me to represent them","At UNHYDE clear expectations with my team, what I expect and what they get from me, then I delivered my part","Leaving UNHYDE, the podcast had no future for me, but I told my partner early and made sure it kept running without any damage","Red Cross, as a paramedic people depend on you, that is why I chose it"],"n":"Add your own concrete UNHYDE team example, what you expected and what happened when it was not met.","s":"Your values from 9 Nov 2026"},{"id":"hsg-w4","t":"hsg-werte","p":true,"f":"Proof for giving first?","a":["Four weeks at an orphanage in Kenya, more than €5,000 raised for a secondary school","Career Club, passed on what I learned about internships and the GMAT, connected members to my former employers","Chess club, wrote the lectures myself","Civil service as a paramedic with the Red Cross"],"s":"HSG CV, your values"},{"id":"hsg-w5","t":"hsg-werte","f":"How do you bridge from a story to a message?","a":["Answer first, then one example, then one sentence like, that is what I mean by giving first","Spread the three messages over the eight answers, each at least twice","Never tell the same story twice"],"s":"Answer plan","q":"e"},{"id":"hsg-p1","t":"hsg-pflicht","p":true,"f":"Why SIM, why St. Gallen, and why now?","a":["My goal is strategy consulting in Zurich and later my own company. SIM is the most direct path there","I build things from zero, a chess club, a career club, a podcast, now my own company. The SIM International Project and the SIMagination Challenge are exactly that kind of learning by doing","I want a cohort where I have to catch up, at my last university I was usually the one pushing projects","And I give first, I would bring founder meetups and help with film and podcast formats, later as a SIM Buddy","Now, because I finished my bachelor in August 2026 and my civil service ends in July 2027"],"s":"HEC essay notes, SIM curriculum"},{"id":"hsg-p2","t":"hsg-pflicht","p":true,"f":"Tell us about yourself.","a":["Austrian and German, grew up in a village right on the border. At 14 I moved to Salzburg and lived in a boarding school during the week, independent early, also head boy","Science focus at school, physics, chemistry, biology. Chose business because I wanted to apply that analytical thinking to people and organisations, and to building things myself","BA International Business at Munich Business School, top 10%, a term at UCLA, founded a chess club and a career club","Tried banking, audit at EY and especially consulting at Allianz Inhouse Consulting. Last role Head of Sales & Marketing at a Munich start-up, built a podcast from zero to over 1.8 million views in under 30 days, that is where I discovered entrepreneurship","Today my own company, a video course with Roland Trettl, an app and local AI nodes for doctors and lawyers, plus civil service as a paramedic with the Red Cross","Close, three things to remember, I build things from zero, people can depend on me, I give first"],"s":"HSG CV, your outline from 9 Nov 2026","n":"About 90 seconds. Say the three messages at the end in the first person."},{"id":"hsg-p3","t":"hsg-pflicht","p":true,"f":"How will you contribute to the SIM community?","a":["I build things from zero, I founded the chess club and grew it to over 90 members, and founded a selective career club","I give first, in the Career Club I passed on what I learned about internships and the GMAT and connected members to my former employers","Concrete offer for SIM, a founders or chess meetup, help with film and podcast formats, later being a SIM Buddy","And people can depend on me, when I sign up for something in the cohort, it gets done"],"s":"LBS essays, SIM community page"},{"id":"hsg-p4","t":"hsg-pflicht","p":true,"f":"Tell us about a time you stood up for your values, even against resistance.","a":["Value, being dependable, even when you leave","Situation, a founder dispute froze new projects, I had to dissolve my sales team and the podcast earned no regular income, so I decided to leave","My partner had invested money and time and did not want me to go. The easy way would have been to slowly pull back","Instead I told him early, gave my reasons and listened to his side","The podcast had no future for me, but I still made sure it kept running without any damage, I supported external recordings on a paid basis. Conflict delayed is conflict multiplied"],"s":"HEC essay, conflict question"},{"id":"hsg-p5","t":"hsg-pflicht","p":true,"f":"What does a service mindset mean to you, and how do you live it?","a":["For me service means giving first, helping where it matters without expecting anything back","My girlfriend's little brother choked on food, I did the Heimlich manoeuvre and he was fine. Small effort, huge impact","That is why I chose civil service as a paramedic with the Red Cross, I started on 1 November","Same idea before, four weeks at an orphanage in Kenya with more than €5,000 raised for a secondary school, and the Career Club"],"s":"HEC essay notes"},{"id":"hsg-q1","t":"hsg-fragen","f":"How have your cultural and personal experiences shaped who you are?","a":["Grew up in a small village right on the Austrian-German border, two citizenships, crossing borders always felt natural","At 14 I moved to Salzburg and lived in a boarding school during the week. I had to organise my own life, so I became someone others can depend on early","Kenya, four weeks alone at an orphanage, my first time on another continent. It put my luck into perspective and is why I give first","UCLA, I joined the university chess club to really integrate. Result, I adapt fast and look for the other perspective first"],"s":"LBS essay, thrive"},{"id":"hsg-q2","t":"hsg-fragen","f":"How do you prepare for something you cannot control?","a":["Separate what I can control from what I cannot","Prepare the controllable part with routines, in my paramedic training I learn fixed schemes for chaotic situations, because people depend on you there","Have a plan B and accept the rest calmly","Example, consulting first is my plan B built into my founder plan, it lowers the risk of a start-up"],"s":"LBS essay, career goals"},{"id":"hsg-q3","t":"hsg-fragen","f":"What is your biggest weakness?","a":["I get very enthusiastic about new opportunities and try a lot of new things, but in the past I sometimes gave up on them too quickly","What I do about it, before I start I decide what success looks like, and I do not judge it at the first setback","Example, the GMAT. 595 in February, 595 again in October. Earlier I might have stopped there","I kept going, worked on my weakest section, Data Insights, from 76 to 84, and four weeks later scored 675, 94th percentile"],"s":"Your idea from 8 Nov 2026, GMAT results from mba.com","n":"With the superscore, schools see all three test dates anyway, so the story matches your documents."},{"id":"hsg-q4","t":"hsg-fragen","f":"Tell us about a failure and what you learned.","a":["At UNHYDE several of my ideas did not yield results, because I spread myself too thin","Lesson, commit fully, see things through","Proof, the podcast, built end to end, over 1.8 million views in under 30 days"],"s":"HEC essay, advice to your younger self"},{"id":"hsg-q5","t":"hsg-fragen","f":"What does responsible leadership mean to you?","a":["Responsible leadership means people can depend on you, clear expectations and you keep your side first","Example, when I left UNHYDE the podcast had no future for me, but I made sure it kept running and my partner was not left alone","As head boy and later in the student council I learned that trust comes from delivering, not from the title","Long term, consulting as the learning phase, then a company with real impact, like local AI that keeps the data of doctors and lawyers in their own practice"],"s":"HEC and LBS essays"},{"id":"hsg-q6","t":"hsg-fragen","f":"Where do you see yourself in five to ten years?","a":["Short term, strategy consultant at a top firm in Zurich for two to three years","I prefer creative ways of modelling and structuring problems to the fixed methods of finance or private equity","Long term, my own technology company full time, it is a question of when, not if","Already started, my own company since September 2026, a video course with Roland Trettl, an app and local AI nodes"],"s":"INSEAD essays, HEC essay"},{"id":"hsg-q7","t":"hsg-fragen","f":"How do you define high performance when you are already performing well?","a":["Learning faster and focusing, not working longer","I go for my weak spots, I chose an audit internship at EY because accounting was my weakest subject","And I commit fully to fewer things"],"s":"Interview notes 2024, HEC essay","q":"e"},{"id":"hsg-q8","t":"hsg-fragen","f":"Which trend will change business most in the coming years?","a":["AI, my bachelor thesis was on AI-based forecasting, and I am building local AI nodes, so doctors and lawyers can use AI without their data leaving the practice","Opportunity, better workflows for doctors, lawyers and their clients","Risk, AI companies have wiped out whole software categories within a few years, so founders must build what is hard to copy","Responsibility for decisions stays with people, so strategy and leadership matter even more"],"s":"LBS essay, career goals, HSG CV"},{"id":"hsg-q9","t":"hsg-fragen","typ":"fall","f":"A teammate presents your work as their own. What do you do?","a":["Talk to the person directly and privately first","Assume no bad intent at first and clarify the facts","If it happens again, involve the supervisor with facts and keep the team result in focus"],"s":"Situational question","q":"e"},{"id":"hsg-d1","t":"hsg-denken","p":true,"f":"How do you structure an answer to an opinion question?","a":["Clear position in one sentence","Two reasons, ideally one with an example","The strongest counterargument, then your conclusion"],"s":"Critical and Creative Thinking","q":"e"},{"id":"hsg-d2","t":"hsg-denken","typ":"fall","f":"Is democracy the best form of government?","a":["Yes, the best of the systems we know, because power changes peacefully and freedom and minorities are protected","Counterpoint, decisions can be slow and short-term, populism is a real risk","Conclusion, Swiss direct democracy shows how involving people can make it stronger"],"s":"Reported once by a consultant blog (undated, not confirmed for the SIM video interview)","q":"e"},{"id":"hsg-d3","t":"hsg-denken","typ":"fall","f":"Does the geography of a country shape its culture?","a":["Yes, partly. Geography sets the conditions, climate, terrain, rivers and access to the sea. Swiss mountain valleys, for example, created strong local identities and federalism","My home on the Salzach, the river is the border to Bavaria, yet both sides share the same dialect, jobs and shops. The river connects more than it divides","Counterpoint, North and South Korea share the same geography but have very different cultures. Politics and history can outweigh geography","Conclusion, geography sets the starting point, people and institutions decide the rest"],"s":"Reported once by a consultant blog (undated, not confirmed for the SIM video interview)","q":"e"},{"id":"hsg-d4","t":"hsg-denken","p":true,"f":"How do you approach an estimation or maths task on video?","a":["Restate the question and say your structure first","Calculate step by step out loud with round numbers and name your assumptions","Sanity check, then one clear final number or range"],"n":"Calculate on paper during prep time, then explain your approach and result in the answer.","s":"Analytical Aptitude","q":"e"},{"id":"hsg-d6","t":"hsg-denken","p":true,"f":"Market sizing, what is the difference between top-down and bottom-up?","a":["Top-down starts from a big known total, e.g. the population or the whole market, and narrows it down step by step with shares","Bottom-up starts from one unit, e.g. one shop or one customer, and multiplies up, number of units times volume per unit","Strongest answer, do one and sanity check with the other. Chocolate bars top-down, 75,000 people times consumption per person. Bottom-up, number of shops times bars sold per shop"],"s":"Analytical Aptitude","q":"e"},{"id":"hsg-d5","t":"hsg-denken","typ":"fall","f":"How many chocolate bars are eaten in St. Gallen every day?","a":["Structure, people times chocolate per person, share eaten as bars","About 100,000 people, assume 27 g of chocolate a day, one third as 50 g bars","100,000 × 27 g ÷ 3 ÷ 50 g ≈ 18,000, so roughly 15,000 to 20,000 bars a day"],"s":"Reported SIM question, numbers are assumptions","q":"e"},{"id":"hsg-m1","t":"hsg-denken","typ":"fall","f":"Revenue grows from 80 to 100 million CHF. By how many percent?","a":["Change 20 on a base of 80","20 ÷ 80 = 25 %","Check, 80 × 1.25 = 100"],"s":"Maths exercise","q":"e"},{"id":"hsg-m2","t":"hsg-denken","typ":"fall","f":"A price falls by 20 %. By how many percent must it rise to get back to the old level?","a":["Take 100, after the drop 80","Back to 100 needs +20 on a base of 80","20 ÷ 80 = 25 %, not 20 %"],"s":"Maths exercise","q":"e"},{"id":"hsg-m3","t":"hsg-denken","typ":"fall","f":"Fixed costs 120,000 CHF, price 50 CHF, variable cost 30 CHF per unit. Break-even?","a":["Contribution margin 50 − 30 = 20 CHF per unit","120,000 ÷ 20 = 6,000 units","Above 6,000 units the company makes a profit"],"s":"Maths exercise","q":"e"},{"id":"hsg-m4","t":"hsg-denken","typ":"fall","f":"A company grows 10 % per year. When has revenue roughly doubled?","a":["Rule of 72, 72 ÷ 10 ≈ 7 years","Check, 1.1 to the power of 7 ≈ 1.95","So a bit over 7 years"],"s":"Maths exercise","q":"e"},{"id":"hsg-m5","t":"hsg-denken","typ":"fall","f":"Team A has 10 people with an average of 80, team B 30 people with an average of 60. Overall average?","a":["Weighted, not simple average","(10 × 80 + 30 × 60) ÷ 40 = 2,600 ÷ 40","= 65, closer to B because B is bigger"],"s":"Maths exercise","q":"e"},{"id":"hsg-m6","t":"hsg-denken","typ":"fall","f":"How many coffees are drunk at the University of St. Gallen on a teaching day?","a":["About 10,000 students and 2,000 staff, about half on campus on a teaching day, so 6,000 people","About half drink coffee there, 1.5 cups each","6,000 × 0.5 × 1.5 ≈ 4,500, so roughly 3,000 to 6,000 coffees"],"s":"Estimation exercise, numbers are assumptions","q":"e"},{"id":"hsg-e9","t":"hsg-denken","typ":"fall","f":"How many diapers are used in Switzerland every year?","a":["Structure, children in diapers × diapers per day × 365","About 100,000 births a year, children wear diapers for about 2.5 years, so about 250,000 children","About 5 diapers a day, so 250,000 × 5 × 365 ≈ 450 million a year","Range 400 to 500 million"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-b1","t":"hsg-benchmarks","f":"Population of Switzerland and the EU?","a":["Switzerland about 10 million","EU about 500 million"],"s":"Rounded benchmarks, say them as assumptions","q":"e"},{"id":"hsg-b2","t":"hsg-benchmarks","f":"Population of Zurich, the other big Swiss cities and St. Gallen?","a":["Zurich city about 500,000, canton Zurich about 1.5 million","Geneva, Basel and Bern about 200,000 each","St. Gallen about 100,000"],"s":"Rounded benchmarks, say them as assumptions","q":"e"},{"id":"hsg-b3","t":"hsg-benchmarks","f":"How many people are at the University of St. Gallen?","a":["About 10,000 students","About 2,000 staff","On a teaching day assume about half on campus, about 6,000 people"],"s":"Rounded benchmarks, say them as assumptions","q":"e"},{"id":"hsg-b6","t":"hsg-benchmarks","f":"Life expectancy, births and deaths in Switzerland?","a":["Life expectancy about 80","About 100,000 people are born and about 100,000 die every year","So roughly 100,000 people per year of age"],"s":"Rounded benchmarks, say them as assumptions","q":"e"},{"id":"hsg-b7","t":"hsg-benchmarks","f":"Working days and hours in a year?","a":["365 days, about 250 working days","About 2,000 working hours per full-time job"],"s":"Rounded benchmarks, say them as assumptions","q":"e"},{"id":"hsg-b8","t":"hsg-benchmarks","f":"Salary and GDP benchmarks for Switzerland?","a":["Median salary about CHF 5,000 a month","GDP about CHF 1 trillion, about CHF 100,000 per person","1 CHF is roughly 1 EUR"],"s":"Rounded benchmarks, say them as assumptions","q":"e"},{"id":"hsg-b10","t":"hsg-benchmarks","f":"How many people work in Switzerland?","a":["About half the population, about 5 million people"],"s":"Rounded benchmarks, say them as assumptions","q":"e"},{"id":"hsg-e1","t":"hsg-denken","typ":"fall","f":"How many cups of coffee are drunk in Zurich every day?","a":["Structure, people in the city × share of adults × cups per adult","About 500,000 residents plus about 200,000 commuters on a weekday, so roughly 700,000 people","About 80% are adults, assume 2.5 cups each","700,000 × 0.8 × 2.5 ≈ 1.4 million cups a day","Sanity check, about two cups per person in the city is plausible. Range 1 to 1.5 million"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-e2","t":"hsg-denken","typ":"fall","f":"How many chocolate bars are eaten at the University of St. Gallen every day?","a":["Bottom-up, people on campus × share who eat a bar × bars each","About 10,000 students and 2,000 staff, about half on campus on a teaching day, so about 6,000 people","Assume one in five eats a bar, one each, so about 1,200","Top-down check, assume the Swiss eat about 27 g of chocolate a day. 6,000 × 27 g, one third as 50 g bars, is about 1,100","Both ways meet, so roughly 1,000 to 1,500 bars a day"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-e3","t":"hsg-denken","typ":"fall","f":"How many smartphones are sold in Switzerland every year?","a":["Structure, smartphones in use ÷ replacement cycle","10 million people, assume practically everyone has one, so about 10 million phones","Replaced about every three years, so about 3.3 million a year","Range 3 to 3.5 million a year"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-e5","t":"hsg-denken","typ":"fall","f":"How many weddings take place in Switzerland every year?","a":["Structure, people per year of age × share who marry × people per wedding","About 100,000 people per year of age in Switzerland","Assume about 60% marry at some point, some twice, so about 70,000 people marry per year","Two people per wedding, so roughly 35,000 weddings a year"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-e6","t":"hsg-denken","typ":"fall","f":"What is the yearly revenue of a café on the HSG campus?","a":["Structure, customers per day × average ticket × opening days","About 6,000 people on campus on a teaching day, say 10% buy at this café, so 600 customers","Average ticket about CHF 6, a coffee and something small, so about CHF 3,600 a day","About 200 days with full traffic, so roughly CHF 700,000 a year","Range CHF 0.5 to 1 million, depending on location and competition"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-e7","t":"hsg-denken","typ":"fall","f":"How many pizzas are eaten in Zurich every week?","a":["Structure, people × pizzas per person per week","About 500,000 residents, plus commuters who eat lunch in the city","Assume an average person eats pizza about every two weeks, at home, delivered or in a restaurant","500,000 ÷ 2 ≈ 250,000, plus commuters, roughly 300,000 pizzas a week"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-e8","t":"hsg-denken","typ":"fall","f":"How many hairdressers are there in Zurich?","a":["Supply and demand","Demand, men get a haircut about every 5 weeks, women about every 10, so about 7.5 cuts per person a year. 500,000 × 7.5 ≈ 3.75 million cuts","Supply, one hairdresser does about 8 cuts a day on about 220 days, so about 1,800 a year","3.75 million ÷ 1,800 ≈ 2,100, roughly 1,500 to 2,500 hairdressers"],"s":"Estimation exercise, numbers are assumptions from your benchmarks","q":"e"},{"id":"hsg-f1","t":"hsg-fakten","p":true,"f":"Three SIM features for your Why SIM answer?","a":["SIM International Project, a mandatory internship abroad you organise yourself","SIMagination Challenge, your own project with social impact","Electives Strategic Entrepreneurship and Business Model Innovation, BCG as corporate partner"],"s":"SIM curriculum and programme page"},{"id":"hsg-f2","t":"hsg-fakten","f":"What are the key facts about SIM?","a":["FT Masters in Management 2026, rank 1 for the 15th time","3 semesters, 90 ECTS, cohort around 58","Global SIM Community with over 1,000 members, SIM Buddy from the year above"],"s":"HSG news 07.09.2026, Poets&Quants, SIM community page"},{"id":"hsg-f3","t":"hsg-fakten","p":true,"f":"Which five traits does SIM look for?","a":["Global Mindset, Critical and Creative Thinking, Analytical Aptitude","Self-Reflection, Maturity and Integrity","Every answer shows at least one of them"],"s":"SIM Your Profile"},{"id":"hsg-t1","t":"hsg-format","f":"What happens in Kira when the answer time runs out?","a":["Kira submits your answer automatically","You can submit earlier with Submit","So finish cleanly after 60 to 90 seconds"],"s":"Kira help"},{"id":"hsg-t2","t":"hsg-format","f":"What do you do if the connection drops?","a":["Press Try again, you continue where you left off","Inform Kira support via Email Support","Write to sim@unisg.ch while the deadline is still running"],"s":"Kira help"}],"id":"hsg"}],"skizzen":{"wegziehen-1":"<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"Arme am Boden entlang nach oben führen\"><line x1=\"8\" y1=\"92\" x2=\"192\" y2=\"92\" stroke-width=\"2\" opacity=\".35\"/><circle cx=\"60\" cy=\"80\" r=\"10\"/><path d=\"M70 82 L140 84 M140 84 L178 80 M140 84 L176 90\"/><path d=\"M80 83 L104 92\" opacity=\".35\" stroke-dasharray=\"4 6\"/><path d=\"M78 80 L52 66 M80 82 L40 74\"/><path d=\"M34 60 Q46 40 70 48\" stroke=\"var(--accent)\"/><path d=\"M64 42 L71 48 L62 53\" stroke=\"var(--accent)\"/><\/svg>","wegziehen-2":"<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"Arme unter dem Kopf überkreuzen\"><line x1=\"8\" y1=\"92\" x2=\"192\" y2=\"92\" stroke-width=\"2\" opacity=\".35\"/><circle cx=\"78\" cy=\"80\" r=\"10\"/><path d=\"M88 82 L156 84 M156 84 L190 80 M156 84 L188 90\"/><path d=\"M92 80 L60 90 L36 74 M92 84 L58 74 L34 88\"/><circle cx=\"34\" cy=\"74\" r=\"3\" fill=\"currentColor\"/><circle cx=\"34\" cy=\"88\" r=\"3\" fill=\"currentColor\"/><text x=\"44\" y=\"30\" fill=\"var(--accent)\" stroke=\"none\" font-size=\"22\" font-family=\"system-ui, sans-serif\" font-weight=\"700\">X<\/text><\/svg>","wegziehen-3":"<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"An den Handgelenken in Sicherheit ziehen\"><l
