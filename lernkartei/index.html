<style>
/* Layout: eine schmale Lernspalte wie ein Kartenstapel, Navigation unten am Daumen; Akzent in Rettungsdecken-Gold, deine Notizen in Kugelschreiber-Blau */
:root {
  --bg: #eef1ef; --panel: #ffffff; --ink: #15202a; --muted: #56626b; --line: #d6dcd9;
  --accent: #c58f1c; --accent-ink: #1d1503; --accent-soft: #f6ead0;
  --pen: #2b3fa6; --pen-soft: #e9ecfa;
  --again: #b83c28; --hard: #a86a12; --good: #2a7449; --easy: #285f9f;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1317; --panel: #172028; --ink: #e6ebee; --muted: #9aa6ae; --line: #2a3640;
  --accent: #e2b04c; --accent-ink: #1d1503; --accent-soft: #3a2f17;
  --pen: #9aabff; --pen-soft: #1f2645;
  --again: #ef7b66; --hard: #e3a84f; --good: #61c38e; --easy: #74aaea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #172028; --ink: #e6ebee; --muted: #9aa6ae; --line: #2a3640;
  --accent: #e2b04c; --accent-ink: #1d1503; --accent-soft: #3a2f17;
  --pen: #9aabff; --pen-soft: #1f2645;
  --again: #ef7b66; --hard: #e3a84f; --good: #61c38e; --easy: #74aaea; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
header.kopf { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.marke { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: .01em; line-height: 1; text-wrap: balance; }
.marke small { display: block; font-weight: 500; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.zahlen { display: flex; gap: 14px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.zahl { text-align: right; }
.zahl b { display: block; font-size: 28px; line-height: 1; font-weight: 700; }
.zahl span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.zahl.faellig b { color: var(--accent); }
.leiste { display: flex; gap: 8px; flex-wrap: wrap; }
select { font: inherit; font-size: 15px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; flex: 1 1 160px; }
.karte { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 1px 0 var(--line), 0 10px 24px -18px rgba(0,0,0,.35); }
.oben { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.marken { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.p { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.tag.fall { border-color: var(--ink); color: var(--ink); }
.tag.e { border-style: dashed; }
.frage { font-size: 22px; line-height: 1.35; font-weight: 700; text-wrap: balance; margin: 0; }
.antwort { margin: 0; padding: 14px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 8px; list-style: none; }
.antwort li { padding-left: 22px; position: relative; }
.antwort li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.notiz { background: var(--pen-soft); color: var(--pen); border-radius: 10px; padding: 8px 12px 10px; font-family: var(--f-hand); font-size: 23px; line-height: 1.2; }
.notiz small { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; margin-bottom: 2px; }
.notiz .offen { font-family: var(--f-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: middle; }
.quelle { font-size: 14px; color: var(--muted); }
.bilder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.bilder figure { margin: 0; display: grid; gap: 4px; color: var(--ink); background: var(--bg); border-radius: 10px; padding: 6px; }
.bilder svg { width: 100%; height: auto; display: block; }
.bilder figcaption { font-size: 12px; line-height: 1.3; color: var(--muted); text-align: center; }
.knopf { justify-self: start; font-weight: 700; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 12px 14px; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.zeigen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; width: 100%; font-size: 18px; }
.bewerten { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bewerten button { display: grid; gap: 2px; padding: 10px 4px; font-weight: 700; font-size: 15px; border-width: 2px; }
.bewerten button span { font-family: var(--f-display); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.b0 { border-color: var(--again); color: var(--again); } .b1 { border-color: var(--hard); color: var(--hard); }
.b2 { border-color: var(--good); color: var(--good); } .b3 { border-color: var(--easy); color: var(--easy); }
.leer { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 28px; }
.leer h2 { font-family: var(--f-display); font-size: 28px; margin: 0; }
.hinweis { font-size: 14px; color: var(--muted); }
details.thema { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
details.thema > summary { list-style: none; padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; cursor: pointer; }
details.thema > summary::-webkit-details-marker { display: none; }
.thema h3 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 600; text-wrap: balance; }
.thema .seiten { font-family: var(--f-display); font-size: 14px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
.inhalt { padding: 0 16px 16px; display: grid; gap: 12px; }
.kern { margin: 0; font-size: 17px; }
.punkte { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.punkte li.stern::marker { content: "★ "; color: var(--accent); }
.merke { border-left: 4px solid var(--accent); padding: 6px 12px; font-weight: 700; }
.erg { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; display: grid; gap: 6px; }
.erg strong { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.erg p { margin: 0; }
.zeile { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.zeile:last-child { border-bottom: 0; }
.zeile .name { font-weight: 700; min-width: 0; }
.zeile .werte { font-family: var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.balken { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
.balken i { display: block; height: 100%; }
.balken .sicher { background: var(--good); } .balken .lernt { background: var(--accent); }
.legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
h2.abschnitt { font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }
.schwach { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.schwach:last-child { border-bottom: 0; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
nav.tabs div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: none; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 14px 4px; border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.status { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .karte { animation: rein .18s ease-out; } @keyframes rein { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }
@media (max-width: 380px) { .frage { font-size: 20px; } .bewerten button { font-size: 14px; } }
</style>

<script id="daten" type="application/json">{"kurs":"Rettungssanitäter:in","quelle":"ÖRK Lehrbuch Band 1, Kapitel 1 (Stand Jänner 2024) mit deinen Notizen und deiner Sprachnachricht vom 05.11.2026","stand":"05.11.2026","themen":[{"id":"ork","titel":"Rotes Kreuz und Rettungswesen","seiten":"S. 12 bis 15","kern":"Im Unterricht nur kurz betont: Geschichte, die sieben Grundsätze, die acht Pflichten und wer fürs Rettungswesen sorgt.","punkte":["Henry Dunant, Schweizer Geschäftsmann, legte in den 1860er-Jahren den Grundstein. Das ÖRK gibt es seit 1880.","Heute weltweit 192 Rotkreuz- und Rothalbmondgesellschaften, koordiniert aus Genf.","★ 7 Grundsätze: Menschlichkeit, Unparteilichkeit, Neutralität, Unabhängigkeit, Freiwilligkeit, Einheit, Universalität.","★ 8 Pflichten: Sorgfalt, Dokumentation, Anzeige, Verschwiegenheit, Mitteilung, Auskunft, Hilfeleistung, Fortbildung.","Rettungswesen: Die Gemeinden müssen dafür sorgen und übertragen es meist dem Roten Kreuz."],"merke":"Grundsätze, Eselsbrücke: „Manche Unfälle nehmen uns fast echt unvorbereitet“ (M U N U F E U).","notizen":[]},{"id":"abc","titel":"SSS, EE und ABCDE","seiten":"S. 16","kern":"Als Sanitäter:in schätzt du beim ersten Kontakt ein, ob es lebensbedrohlich ist. Im Sanitätseinsatz meist nicht (Transportbegleitung), im Rettungseinsatz kann es ein Notfall sein. Du gehst immer strukturiert vor und behandelst zuerst, was zuerst tötet.","punkte":["★ SSS: Szene, Sicherheit, Situation. Eigene Sicherheit, Team, Patient:in.","★ EE: Erster Eindruck. Notfall erfassen, lebensbedrohliche Blutungen sofort stillen.","★ A Airway: Atemwege freimachen und freihalten.","★ B Breathing: Atmung und Sauerstoffversorgung sichern, nötigenfalls Wiederbelebung.","★ C Circulation: schwere Kreislaufprobleme feststellen.","★ D Disability: schwere neurologische Störungen erkennen.","★ E Exposure: Entkleiden und Entscheiden, wurde nichts übersehen?","Kritisch krank oder verletzt: Notarzt nachfordern, notfalls schneller Transport ins Krankenhaus."],"merke":"„Treat first what kills first.“","notizen":[{"text":"Notfallcheck und ABCDE sind sich ähnlich. Der Notfallcheck ist die Sicht der Ersthelfer, ABCDE die Sicht der Rettungssanitäter.","ort":"S. 22 und Unterricht"}]},{"id":"not","titel":"Notruf, GAMS und Absichern","seiten":"S. 17","kern":"Alle Nummern kommen zur Prüfung, in beide Richtungen. Eine Nummer reicht, die Leitstelle alarmiert alle nötigen Kräfte. Erst die Leitstelle beendet das Gespräch.","punkte":["★ 122 Feuerwehr, 133 Polizei, 144 Rettung, 112 Euro-Notruf (in Österreich zur Polizei, geht ohne SIM und Guthaben).","★ 1450 Gesundheitsberatung (kein Notfall, 0 bis 24 Uhr).","★ 140 Bergrettung, 141 Ärztenotdienst, 142 Telefonseelsorge, 147 Rat auf Draht, 116 123 Ö3 Kummernummer.","★ Vergiftungsinformationszentrale +43 1 406 43 43 (kommt sicher).","Beim Notruf: Fragen beantworten, Freisprechen, die Hilfe ist schon während des Gesprächs alarmiert. 144 sagt dir auch, wo der nächste Defi ist.","GAMS bei Gefahr: Gefahr erkennen, Absperren und Abstand halten, Menschenrettung (nur ohne Eigengefährdung), Spezialkräfte nachfordern.","Die 3 W beim Autounfall: Warnblinker, Warnweste, Warndreieck."],"merke":"Kenn dein Material.","ergaenzung":["GAMS nachgeschlagen (Feuerwehr- und Rettungsdienstlehre): G Gefahr erkennen (beobachten, Warntafeln, im Zweifel die größte Gefahr annehmen). A Absperren, Abstand halten, selbst nicht in den Gefahrenbereich. M Menschen retten nur, wenn es ohne Eigengefährdung geht, sonst Leute aus dem Bereich rufen. S Spezialkräfte nachfordern, z. B. Feuerwehr mit den Nummern der Warntafel.","Übliche Reihenfolge beim Absichern: Warnblinker an, Warnweste noch im Auto anziehen, dann das Warndreieck aufstellen. Die Abstände stehen im Lehrbuch auf S. 34, die ergänze ich mit dem nächsten Scan."],"notizen":[{"text":"Vergiftungsinformationszentrale kommt 100 % zur Prüfung.","ort":"S. 17"},{"text":"Kenn dein Material, z. B. findet man die Rettungstasche in einem neuen Auto in der Stresssituation nicht.","ort":"S. 17"},{"text":"GAMS: Gefahr, Absichern / Abstand, Menschenleben retten, Spezialkräfte.","ort":"S. 17"},{"text":"3 W: Warnweste, Warnblinker, Warndreieck. Wichtig, wo man sie aufstellt.","ort":"S. 17 und Unterricht"}]},{"id":"bas","titel":"Basismaßnahmen und Lagerungen","seiten":"S. 18 bis 19","kern":"Vier Basismaßnahmen kommen sicher zum Test: Lagerung, frische Luft, Wärme, psychische Betreuung. Du empfiehlst sie, du zwingst nichts auf, und sie dürfen nie Lebensrettendes verzögern.","punkte":["★ Lagerung: so, wie es angenehm ist und weniger weh tut.","★ Frische Luft: Fenster auf, enge Kleidung lockern, ruhig atmen lassen.","★ Wärme: zudecken und die Decke auch unter die Person stopfen. Bei Verdacht auf Becken oder Wirbelsäule nicht umlagern.","★ Psychische Betreuung, Look, Listen, Link: hinschauen, zuhören, Hilfe und Angehörige holen.","★ Lagerungen aus dem Unterricht: Beine zum Bauch anziehen (Bauchschmerzen), Seitenlage (wach, aber übel oder schläfrig), vornübergebeugt (Atemnot, Asthma), Rückenlage mit angewinkelten Beinen in L-Form (Kreislaufprobleme)."],"merke":"Seitenlage ist nicht die stabile Seitenlage: Seitenlage für Wache, stabile Seitenlage für Bewusstlose, die normal atmen.","notizen":[{"text":"Wann welche Lage ist prüfungswichtig. Beine anziehen: Bauchschmerzen, entlastet die Bauchdecke. Seitenlage: bei Bewusstsein, aber übel oder schläfrig, damit bei Erbrechen die Atemwege frei bleiben. Vornübergebeugt: Atemnot, Asthma. Beine angewinkelt (L-Form, am Rücken am Boden): Kreislaufprobleme.","ort":"S. 19 und Unterricht"},{"text":"Transmissionswärme: Man verliert auch über den Boden Wärme, deshalb die Decke unter die Person stopfen, nicht nur drüberlegen.","ort":"S. 19 und Unterricht"}]},{"id":"weg","titel":"Wegziehen und Umdrehen","seiten":"S. 20 bis 21","kern":"Arme am Boden nach oben führen, hinter dem Kopf überkreuzen und an den Handgelenken wegziehen. Aus der Bauchlage gleich. Nur, wenn du dich dabei nicht selbst gefährdest.","punkte":["Vorher absichern, wenn möglich.","Arme beim Hochführen am Boden lassen. Der Kopf liegt im besten Fall zwischen den Armen, damit er nicht wegkippt.","Umdrehen aus der Bauchlage: Arm beim Kopf ausstrecken, an Becken und Schulter fassen, zu dir drehen, nicht übers Gesicht.","Danach Atmung prüfen."],"merke":"Arme hoch, kreuzen, Handgelenke, ziehen.","bilder":[{"src":"wegziehen-1","text":"Arme am Boden nach oben führen"},{"src":"wegziehen-2","text":"Unter dem Kopf überkreuzen"},{"src":"wegziehen-3","text":"An den Handgelenken wegziehen"}],"notizen":[]},{"id":"reg","titel":"Notfallcheck","seiten":"S. 22 bis 23","kern":"Kommt 100 % zur praktischen Prüfung. Ablauf wie im Unterricht, laut ansagen, was du tust. Die entscheidende Frage: Atmet die Person normal?","punkte":["★ 1 Umgebung sichern, laut sagen: „Umgebung sicher.“","★ 2 Zur Person, an den Schultern rütteln: „Hallo, hallo, können Sie mich hören?“","★ 3 Keine Reaktion: laut um Hilfe rufen.","★ 4 Aufgaben verteilen: „Du rufst die Rettung.“ „Du holst den Defi.“ „Du holst den Verbandskasten.“","★ 5 Atemwege prüfen, nötigenfalls freimachen, Kopf überstrecken.","★ 6 Atemkontrolle höchstens 10 Sekunden: Ohr zu Mund und Nase, Blick auf den Brustkorb.","★ 7 Atmet normal: stabile Seitenlage. Atmet nicht normal: Herzdruckmassage.","Schnappatmung oder vereinzelte Atemzüge sind keine normale Atmung."],"merke":"Unsicher? Keine Atmung. Lieber drücken.","notizen":[{"text":"Wenn unsicher, dann KEINE ATMUNG. Wacht die Person beim Drücken auf, merkt man es. Andersrum stirbt sie in der stabilen Seitenlage.","ort":"S. 22 und Unterricht"},{"text":"Eine bewusstlose Person ist immer kritisch, akute Lebensgefahr. Als Sanitäter immer den Notarzt nachfordern.","ort":"S. 22 und Unterricht"}]},{"id":"ssl","titel":"Stabile Seitenlage","seiten":"S. 24 bis 25","kern":"Für Bewusstlose, die normal atmen, weil Zunge, Erbrochenes oder Blut sonst die Atemwege verlegen. Muss für die Prüfung sitzen, dabei erzählen, was du machst.","punkte":["★ 1 Notfallcheck: Person atmet. Neben sie knien.","★ 2 Näheren Arm im rechten Winkel zur Person ablegen.","★ 3 Ferne Hand aufs ferne Knie legen und das Knie gleichzeitig hochziehen, so weit wie möglich.","★ 4 Am Knie zu dir ziehen.","★ 5 Kopf kurz anheben, die Hand, die am Knie lag, unter den Kopf legen.","★ 6 Kopf überstrecken, Mund öffnen (Mund ist der tiefste Punkt).","★ 7 Atmung laufend kontrollieren (jede Minute), Wärme, Basismaßnahmen.","Allein ohne Hilfe: Notruf spätestens nach der Seitenlage."],"merke":"Knie ganz hoch, sonst wird eine Bauchlage daraus.","notizen":[{"text":"Stabile Seitenlage muss für die Prüfung sitzen. Erzählen, was man gerade macht.","ort":"S. 23"},{"text":"Auch in der stabilen Seitenlage immer die Atmung kontrollieren, nicht dass die Person aufhört zu atmen.","ort":"Unterricht"}]},{"id":"wie","titel":"Wiederbelebung","seiten":"S. 26 bis 27","kern":"Keine Reaktion und keine normale Atmung heißt Atem-Kreislauf-Stillstand. Dann sofort 30 Mal drücken, 2 Mal beatmen, bis die Person normal atmet oder der Rettungsdienst übernimmt. Vor allem Praxis.","punkte":["Harter Untergrund, Handballen auf die Brustmitte, Arme durchgestreckt.","Schnell und kräftig, nach jedem Druck ganz entlasten (Leitlinie: 5 bis 6 cm, 100 bis 120 pro Minute).","Beatmung nur, wenn du sie kannst, sonst ohne Pause durchdrücken. Beatmungstuch.","Trainierte Helfer wechseln alle 2 Minuten. Rippenbrüche heilen, Nichtstun ist tödlich."],"merke":"30 : 2, hart, schnell, entlasten, nicht aufhören.","notizen":[]},{"id":"def","titel":"Defibrillator (AED)","seiten":"S. 28 bis 29","kern":"Der Defi unterbricht mit einem Stromstoß das Kammerflimmern, er ersetzt das Drücken nicht. Einschalten, Anweisungen folgen, nur in Analyse und Schock die Hände weg.","punkte":["Einer drückt weiter, der andere schaltet ein und klebt die Elektroden auf die nackte, trockene Brust.","★ Analysephase und Schock: nicht drücken, niemand berührt die Person.","★ Kammerflimmern: Der Defi gibt immer einen Schock (so ist die Prüfungssituation).","★ Asystolie, gar kein Herzschlag: kein Schock, nur Drücken hilft.","Elektroden normal: rechts unter dem Schlüsselbein und links seitlich unter der Achsel. Kleine Kinder: vorne und hinten.","Nässe abtrocknen, starke Behaarung notfalls rasieren, Drücken hat Vorrang."],"merke":"Einschalten und tun, was er sagt.","ergaenzung":["Nachgeschaut: Schockbar sind Kammerflimmern und pulslose ventrikuläre Tachykardie. Nicht schockbar sind Asystolie (Nulllinie, keine elektrische Aktivität) und pulslose elektrische Aktivität. Bei Kindern, wenn vorhanden, Kinder-Elektroden; ist das Kind zu klein für zwei Elektroden vorne, eine vorne in die Brustmitte und eine hinten zwischen die Schulterblätter."],"notizen":[{"text":"Bei der Analysephase nicht drücken.","ort":"S. 29"},{"text":"Bei Herzkammerflimmern gibt der Defi immer Schock ab, das wird die Situation in der Prüfung sein.","ort":"S. 29 und Unterricht"},{"text":"Wenn gar kein Herzschlag, dann hilft kein Defi (Asystolie).","ort":"S. 29"},{"text":"Bei kleinen Kindern Elektroden vorne und hinten, nicht wie sonst seitlich und oben.","ort":"S. 29 und Unterricht"}]},{"id":"ver","titel":"Verschlucken","seiten":"S. 30 bis 31","kern":"Hustet die Person kräftig: leichte Verlegung, weiter husten lassen. Kann sie nicht atmen, sprechen oder husten: schwere Verlegung, 5 Rückenschläge und 5 Heimlich im Wechsel.","punkte":["Rückenschläge: vorbeugen, am Brustkorb stützen, bis 5 Mal mit der flachen Hand zwischen die Schulterblätter.","Heimlich: hinter die Person, Faust zwischen Nabel und Brustkorb, bis 5 Mal kräftig nach innen oben.","Danach immer ins Krankenhaus. Bewusstlos: Wiederbelebung."],"merke":"5 Schläge, 5 Heimlich, im Wechsel.","notizen":[]},{"id":"blu","titel":"Starke Blutung","seiten":"S. 32","kern":"Spritzt Blut oder läuft es im Schwall, behandelst du es als starke Blutung. Handschuhe an, dann Druck: mit der Hand oder mit Druckverband.","punkte":["Manueller Druck: geht überall. Am Anfang die Person selbst drücken lassen.","Druckverband: nur an Armen und Beinen, du hast die Hände frei.","★ Druckkörper: größer als die Wunde, saugfähig, passt sich der Körperform an.","Blutet es durch: zusätzlich mit der Hand auf den Verband drücken."],"merke":"Druck stillt jede sichtbare Blutung.","notizen":[{"text":"Druckkörper und seine Eigenschaften kommen zur Prüfung (Kreuz am Rand).","ort":"S. 32"}]}],"karten":[{"id":"ork01","t":"ork","f":"Wer legte den Grundstein für das Rote Kreuz, wann, und seit wann gibt es das ÖRK?","a":["Henry Dunant, Schweizer Geschäftsmann, in den 1860er-Jahren","ÖRK seit 1880","Heute weltweit 192 Gesellschaften, koordiniert aus Genf"],"s":"S. 12"},{"id":"ork02","t":"ork","f":"Nenne die sieben Rotkreuz-Grundsätze.","a":["Menschlichkeit, Unparteilichkeit, Neutralität, Unabhängigkeit, Freiwilligkeit, Einheit, Universalität","Eselsbrücke: „Manche Unfälle nehmen uns fast echt unvorbereitet“"],"s":"S. 12","p":true},{"id":"ork03","t":"ork","f":"Nenne die acht Berufs- und Tätigkeitspflichten.","a":["Gut arbeiten: Sorgfalt, Dokumentation, Fortbildung","Mit Information umgehen: Verschwiegenheit, Auskunft, Mitteilung, Anzeige","Helfen: Hilfeleistung"],"s":"S. 15","p":true},{"id":"ork04","t":"ork","f":"Wer muss in Österreich für das Rettungswesen sorgen?","a":["Die Gemeinden","Sie übertragen es meist dem Roten Kreuz"],"s":"S. 15"},{"id":"abc01","t":"abc","f":"Wofür stehen SSS, EE und ABCDE?","a":["SSS: Szene, Sicherheit, Situation","EE: Erster Eindruck","A: Airway, Atemwege","B: Breathing, Atmung","C: Circulation, Kreislauf","D: Disability, Neurologie","E: Exposure, Entkleiden/Entscheiden"],"s":"S. 16","p":true},{"id":"abc02","t":"abc","f":"Welches Motto steht hinter dem ABCDE-Schema?","a":["„Treat first what kills first“: Behandle zuerst, was zuerst tötet"],"s":"S. 16","p":true},{"id":"abc03","t":"abc","f":"Worum geht es bei SSS und beim Ersten Eindruck (EE)?","a":["SSS: eigene Sicherheit, Team und Patient:in schützen","EE: Notfall erfassen, lebensbedrohliche Blutungen sofort stillen"],"s":"S. 16","p":true},{"id":"abc04","t":"abc","f":"Worum geht es bei A und bei B?","a":["A: Atemwege freimachen und freihalten","B: Atmung und Sauerstoffversorgung sichern, nötigenfalls Wiederbelebung"],"s":"S. 16","p":true},{"id":"abc05","t":"abc","f":"Worum geht es bei C, D und E?","a":["C: schwere Kreislaufprobleme feststellen","D: schwere neurologische Störungen erkennen","E: entkleiden, nichts Wichtiges übersehen, entscheiden"],"s":"S. 16","p":true},{"id":"abc06","t":"abc","f":"Du stufst eine Person als kritisch ein. Was tust du?","a":["Notarzt nachfordern","Wenn kein Notarztmittel rechtzeitig verfügbar ist: schneller Transport ins Krankenhaus"],"s":"S. 16","p":true},{"id":"abc07","t":"abc","f":"Was unterscheidet den Notfallcheck vom ABCDE-Schema?","a":["Sie sind sich ähnlich","Notfallcheck: Sicht der Ersthelfer","ABCDE: Sicht der Rettungssanitäter, strukturierte Beurteilung"],"s":"S. 16, S. 22","n":"Das eine ist die Erste-Hilfe-Perspektive, das ABC ist dann für Rettungssanitäter."},{"id":"nr122a","t":"not","f":"Welche Nummer hat die Feuerwehr?","a":["122"],"s":"S. 17","p":true},{"id":"nr122b","t":"not","f":"Wen erreichst du unter 122?","a":["Feuerwehr"],"s":"S. 17","p":true},{"id":"nr133a","t":"not","f":"Welche Nummer hat die Polizei?","a":["133"],"s":"S. 17","p":true},{"id":"nr133b","t":"not","f":"Wen erreichst du unter 133?","a":["Polizei"],"s":"S. 17","p":true},{"id":"nr144a","t":"not","f":"Welche Nummer hat der Rettungsdienst?","a":["144"],"s":"S. 17","p":true},{"id":"nr144b","t":"not","f":"Wen erreichst du unter 144, und was macht die Leitstelle für dich?","a":["Rettungsdienst","Leitet die Erste Hilfe am Telefon an und sagt dir, wo der nächste Defi ist"],"s":"S. 17","p":true},{"id":"nr112a","t":"not","f":"Welche Nummer ist der Euro-Notruf?","a":["112"],"s":"S. 17","p":true},{"id":"nr112b","t":"not","f":"Was ist 112, wo landest du in Österreich, und was ist der Vorteil?","a":["Euro-Notruf, in ganz Europa gleich","In Österreich bei der Polizei","Geht ohne SIM, Vertrag, Guthaben oder Heimatnetz, über jedes verfügbare Netz"],"s":"S. 17","p":true},{"id":"nr1450a","t":"not","f":"Welche Nummer hat die telefonische Gesundheitsberatung?","a":["1450"],"s":"S. 17","p":true},{"id":"nr1450b","t":"not","f":"Was ist 1450, und wann rufst du dort an?","a":["Telefonische Gesundheitsberatung, 0 bis 24 Uhr","Bei Beschwerden, die kein Notfall sind"],"s":"S. 17","p":true},{"id":"nr140a","t":"not","f":"Welche Nummer hat die Bergrettung?","a":["140"],"s":"S. 17","p":true},{"id":"nr140b","t":"not","f":"Wen erreichst du unter 140?","a":["Bergrettung"],"s":"S. 17","p":true},{"id":"nr141a","t":"not","f":"Welche Nummer hat der Ärztenotdienst?","a":["141"],"s":"S. 17","p":true},{"id":"nr141b","t":"not","f":"Wen erreichst du unter 141?","a":["Ärztenotdienst, ärztlicher Bereitschaftsdienst"],"s":"S. 17","p":true},{"id":"nr142a","t":"not","f":"Welche Nummer hat die Telefonseelsorge?","a":["142"],"s":"S. 17","p":true},{"id":"nr142b","t":"not","f":"Wen erreichst du unter 142?","a":["Telefonseelsorge"],"s":"S. 17","p":true},{"id":"nr147a","t":"not","f":"Welche Nummer hat Rat auf Draht?","a":["147"],"s":"S. 17","p":true},{"id":"nr147b","t":"not","f":"Wen erreichst du unter 147?","a":["Rat auf Draht"],"s":"S. 17","p":true},{"id":"nr116a","t":"not","f":"Welche Nummer hat die Ö3 Kummernummer?","a":["116 123"],"s":"S. 17","p":true},{"id":"nr116b","t":"not","f":"Wen erreichst du unter 116 123?","a":["Ö3 Kummernummer"],"s":"S. 17","p":true},{"id":"nrvizA","t":"not","f":"Welche Nummer hat die Vergiftungsinformationszentrale?","a":["+43 1 406 43 43"],"s":"S. 17","p":true,"n":"Kommt 100 % zur Prüfung."},{"id":"nrvizB","t":"not","f":"Wen erreichst du unter +43 1 406 43 43?","a":["Vergiftungsinformationszentrale"],"s":"S. 17","p":true,"n":"Kommt 100 % zur Prüfung."},{"id":"not06","t":"not","f":"Wann ist ein Notruf abgeschlossen, und was tust du währenddessen?","a":["Erst wenn die Leitstelle das Gespräch beendet","Fragen beantworten, Freisprechen nutzen, parallel Erste Hilfe leisten","Die Einsatzkräfte sind schon während des Gesprächs alarmiert"],"s":"S. 17"},{"id":"not07","t":"not","f":"Verkehrsunfall mit eingeklemmter Person: Musst du Feuerwehr und Polizei extra anrufen?","a":["Nein, eine Nummer reicht","Die Leitstelle alarmiert Feuerwehr und Polizei mit, wenn du die Lage schilderst"],"s":"S. 17"},{"id":"not10","t":"not","f":"Warum musst du dein Material kennen?","a":["Was du nicht genau kennst, findest du in der Stresssituation erst recht nicht","Z. B. die Rettungstasche in einem neuen Auto"],"s":"S. 17, Unterricht","n":"Kenn dein Material."},{"id":"gams1","t":"not","f":"Wofür steht GAMS?","a":["G: Gefahr erkennen","A: Absichern, Absperren, Abstand halten","M: Menschenleben retten","S: Spezialkräfte nachfordern"],"s":"S. 17, Unterricht","p":true,"n":"Gefahr, Absichern / Abstand, Menschenleben retten, Spezialkräfte."},{"id":"gams2","t":"not","f":"Was bedeuten die vier Schritte von GAMS konkret?","a":["G: beobachten, Warntafeln lesen, im Zweifel die größte Gefahr annehmen","A: Bereich absperren, selbst Abstand halten, nicht in die Gefahr gehen","M: Menschen retten nur ohne Eigengefährdung, sonst Leute aus dem Bereich rufen","S: Feuerwehr, Polizei, Gefahrgutkräfte nachfordern, Nummern der Warntafel durchgeben"],"s":"nachgeschlagen","q":"e"},{"id":"dreiw","t":"not","f":"Welche 3 W brauchst du bei einem Autounfall, und in welcher Reihenfolge?","a":["Warnblinker einschalten","Warnweste noch im Auto anziehen","Warndreieck aufstellen, in ausreichendem Abstand vor der Unfallstelle","Abstände: Lehrbuch S. 34 (folgt mit dem nächsten Scan)"],"s":"S. 17, Unterricht","p":true,"n":"3 W: Warnweste, Warnblinker, Warndreieck. Wichtig, wo man sie aufstellt."},{"id":"bas01","t":"bas","f":"Nenne die vier Basismaßnahmen.","a":["Lagerung","Frische Luft","Wärme","Psychische Betreuung"],"s":"S. 18 bis 19","p":true},{"id":"bas02","t":"bas","f":"Was sind Basismaßnahmen, und was dürfen sie nie?","a":["Maßnahmen, die bei jedem Notfall gehen, körperlich und psychisch","Du empfiehlst sie, du zwingst sie nicht auf","Sie dürfen lebensrettende Maßnahmen nie verzögern"],"s":"S. 18","p":true},{"id":"bas03","t":"bas","f":"Was gehört zur frischen Luft?","a":["Fenster auf","Enge Kleidung lockern","Ruhig atmen lassen"],"s":"S. 18","p":true},{"id":"bas04","t":"bas","f":"Wie hältst du eine Person warm, und worauf achtest du?","a":["Zudecken und die Decke auch unter die Person stopfen","Grund: Transmissionswärme, man verliert auch über den Boden Wärme","Bei Verdacht auf Becken- oder Wirbelsäulenverletzung nicht umlagern"],"s":"S. 19","p":true,"n":"Auch unter die Person, nicht nur drüber legen."},{"id":"bas05","t":"bas","f":"Was bedeutet Look, Listen, Link?","a":["Look: hinschauen, Stresssignale wahrnehmen","Listen: aktiv zuhören, Bedürfnisse erfragen","Link: Angehörige und weitere Hilfe holen"],"s":"S. 19","p":true},{"id":"lag01","t":"bas","f":"Welche vier Lagerungen habt ihr gelernt, und wofür?","a":["Beine zum Bauch anziehen: Bauchschmerzen","Seitenlage: wach, aber übel oder schläfrig","Vornübergebeugt: Atemnot, Asthma","Rückenlage, Beine angewinkelt (L-Form): Kreislaufprobleme"],"s":"S. 19, Unterricht","p":true},{"id":"lag02","t":"bas","f":"Eine Person hat starke Bauchschmerzen. Wie lagerst du sie, und warum?","a":["Beine Richtung Bauch anziehen","Das entlastet die Bauchdecke"],"s":"Unterricht","p":true},{"id":"lag03","t":"bas","f":"Eine Person ist bei Bewusstsein, ihr ist übel und sie ist schläfrig. Wie lagerst du sie?","a":["Seitenlage (nicht die stabile Seitenlage)","Bleiben die Atemwege frei, falls sie erbricht"],"s":"Unterricht","p":true},{"id":"lag04","t":"bas","f":"Eine Person hat Atemnot oder einen Asthmaanfall. Wie lagerst du sie?","a":["Vornübergebeugt, sitzend, Arme abstützen","Oberkörper hoch"],"s":"S. 18, Unterricht","p":true},{"id":"lag05","t":"bas","f":"Eine Person hat Kreislaufprobleme. Wie lagerst du sie?","a":["Am Rücken auf dem Boden, Beine angewinkelt hoch (L-Form)"],"s":"Unterricht","p":true},{"id":"lag06","t":"bas","f":"Was ist der Unterschied zwischen Seitenlage und stabiler Seitenlage?","a":["Seitenlage: Person ist bei Bewusstsein, aber übel oder schläfrig","Stabile Seitenlage: Person ist bewusstlos und atmet normal"],"s":"Unterricht, S. 24","p":true},{"id":"weg01","t":"weg","f":"Wie ziehst du eine reglose Person aus der Gefahrenzone?","a":["Nur ohne Eigengefährdung, vorher wenn möglich absichern","Arme am Boden lassen und nach oben führen","Hinter dem Kopf überkreuzen, Kopf möglichst zwischen den Armen","An den Handgelenken wegziehen","Aus der Bauchlage genauso"],"s":"S. 20 bis 21","b":["wegziehen-1","wegziehen-2","wegziehen-3"]},{"id":"weg02","t":"weg","f":"Wie drehst du eine reglose Person aus der Bauchlage auf den Rücken?","a":["Arm beim Kopf ausstrecken","An Becken und Schulter der Gegenseite fassen","Zu dir drehen, möglichst nicht übers Gesicht","Danach Atmung prüfen"],"s":"S. 20 bis 21"},{"id":"reg02","t":"reg","f":"Notfallcheck: Wie läuft er ab? Sag es laut wie in der Prüfung.","a":["1 Umgebung sichern: „Umgebung sicher.“","2 An den Schultern rütteln: „Hallo, hallo, können Sie mich hören?“","3 Keine Reaktion: laut um Hilfe rufen","4 Aufgaben verteilen: Rettung rufen, Defi holen, Verbandskasten holen","5 Atemwege prüfen, ggf. freimachen, Kopf überstrecken","6 Max. 10 s Atemkontrolle: Ohr zu Mund und Nase, Blick auf den Brustkorb","7 Atmet: stabile Seitenlage. Atmet nicht: Herzdruckmassage"],"s":"S. 22 bis 23, Unterricht","p":true},{"id":"reg09","t":"reg","f":"Wie verteilst du beim Notfallcheck die Aufgaben?","a":["Personen direkt ansprechen","„Du rufst die Rettung (144).“","„Du holst den Defi.“","„Du holst den Verbandskasten.“"],"s":"Unterricht","p":true},{"id":"reg05","t":"reg","f":"Du bist unsicher, ob die Person normal atmet. Was gilt, und warum?","a":["Keine normale Atmung annehmen, sofort drücken","Wacht die Person beim Drücken auf, merkst du es","Andersrum stirbt sie in der stabilen Seitenlage"],"s":"S. 22, Unterricht","p":true,"n":"Wenn unsicher, dann KEINE ATMUNG."},{"id":"reg10","t":"reg","f":"Du findest als Sanitäter:in eine bewusstlose Person. Wie schätzt du die Lage ein?","a":["Immer kritisch, akute Lebensgefahr","Immer Notarzt nachfordern"],"s":"Unterricht","p":true,"n":"Bewusstlos ist immer kritisch, Notarzt nachfordern."},{"id":"reg03","t":"reg","f":"Warum überstreckst du bei einer reglosen Person den Kopf?","a":["Die Muskulatur ist schlaff, die Zunge sinkt nach hinten und verlegt die Atemwege","Überstrecken macht sie frei"],"s":"S. 22"},{"id":"reg06","t":"reg","f":"Woran unterscheidest du Bewusstlosigkeit und Atem-Kreislauf-Stillstand?","a":["Beide: keine Reaktion auf Ansprechen","Bewusstlosigkeit: normale Atmung, stabile Seitenlage","Atem-Kreislauf-Stillstand: keine normale Atmung, Wiederbelebung"],"s":"S. 22, S. 28","p":true},{"id":"reg07","t":"reg","f":"Ist Schnappatmung eine normale Atmung?","a":["Nein","Vereinzelte, unregelmäßige oder langsame Atemzüge und Schnappen nach Luft sind keine normale Atmung"],"s":"S. 24, S. 26"},{"id":"ssl01","t":"ssl","f":"Warum braucht eine bewusstlose Person, die normal atmet, die stabile Seitenlage?","a":["Zunge, Erbrochenes, Blut oder Speichel können die Atemwege verlegen","Ohne Seitenlage droht der Erstickungstod"],"s":"S. 24"},{"id":"ssl02","t":"ssl","f":"Stabile Seitenlage: Wie gehst du vor? Erzähl laut, was du machst.","a":["1 Notfallcheck: Person atmet, neben sie knien","2 Näheren Arm im rechten Winkel ablegen","3 Ferne Hand aufs ferne Knie legen, Knie gleichzeitig so weit wie möglich hochziehen","4 Am Knie zu dir ziehen","5 Kopf kurz anheben, die Hand vom Knie unter den Kopf legen","6 Kopf überstrecken, Mund öffnen","7 Atmung laufend kontrollieren"],"s":"S. 24 bis 25, Unterricht","p":true,"n":"Muss für die Prüfung sitzen. Erzählen, was man gerade macht."},{"id":"ssl03","t":"ssl","f":"Warum ziehst du das Knie bei der stabilen Seitenlage so weit wie möglich hoch?","a":["Sonst rollt die Person weiter und es wird eine Bauchlage daraus"],"s":"Unterricht","p":true},{"id":"ssl04","t":"ssl","f":"Die Person liegt in der stabilen Seitenlage. Was tust du jetzt?","a":["Atmung laufend kontrollieren, jede Minute","Hört sie auf zu atmen: Wiederbelebung","Basismaßnahmen, z. B. Wärme"],"s":"S. 24, Unterricht","p":true,"n":"Immer die Atmung kontrollieren, nicht dass sie aufhört zu atmen."},{"id":"ssl05","t":"ssl","f":"Du bist allein, niemand kann helfen. Wann setzt du den Notruf ab, wenn die Person normal atmet?","a":["Spätestens nach der stabilen Seitenlage"],"s":"S. 24"},{"id":"wie01","t":"wie","f":"Woran erkennst du einen Atem-Kreislauf-Stillstand?","a":["Keine Reaktion auf Ansprechen und Rütteln","Keine oder keine normale Atmung"],"s":"S. 26","p":true},{"id":"wie02","t":"wie","f":"In welchem Verhältnis drückst und beatmest du?","a":["30 Herzdruckmassagen : 2 Beatmungen"],"s":"S. 26","p":true},{"id":"wie03","t":"wie","f":"Wie drückst du richtig?","a":["Harter Untergrund, Handballen auf die Brustmitte, zweite Hand darüber","Arme durchgestreckt, Oberkörper senkrecht darüber","Schnell und kräftig, nach jedem Druck ganz entlasten","Leitlinie: 5 bis 6 cm tief, 100 bis 120 pro Minute"],"s":"S. 26 bis 27","p":true},{"id":"wie04","t":"wie","f":"Du kannst oder willst nicht beatmen. Was dann?","a":["Ohne Pause durchdrücken","Beatmung nur, wenn du sie kannst, bei Fremden mit Beatmungstuch"],"s":"S. 26"},{"id":"wie05","t":"wie","f":"Wie lange führst du die Wiederbelebung durch?","a":["Bis die Person wieder normal atmet oder der Rettungsdienst übernimmt","Trainierte Helfer wechseln alle 2 Minuten"],"s":"S. 26"},{"id":"wie06","t":"wie","f":"Ein Passant ruft: „Hör auf, du brichst ihr die Rippen!“ Was tust du?","a":["Weiterdrücken","Eine Rippe heilt, eine unterlassene Herzdruckmassage führt zum Tod"],"s":"S. 26"},{"id":"def01","t":"def","f":"Was bewirkt ein Defibrillator, und was kann er nicht?","a":["Ein Stromstoß unterbricht das unkoordinierte Zucken des Herzens","Er ersetzt das Drücken und Beatmen nicht"],"s":"S. 28"},{"id":"def02","t":"def","f":"Ihr seid zu zweit und habt einen AED. Wer macht was?","a":["Einer drückt und beatmet ohne Pause weiter","Der andere schaltet ein, folgt den Anweisungen, klebt die Elektroden auf die nackte, trockene Brust"],"s":"S. 28 bis 29"},{"id":"def03","t":"def","f":"Wann hörst du beim AED auf zu drücken?","a":["Nur in der Analysephase und beim Schock","Dann berührt niemand die Person"],"s":"S. 28 bis 29","p":true,"n":"Bei der Analysephase nicht drücken."},{"id":"def10","t":"def","f":"Die Person hat Kammerflimmern. Gibt der Defi einen Schock?","a":["Ja, bei Kammerflimmern immer","So ist die Situation in der Prüfung"],"s":"S. 29, Unterricht","p":true,"n":"Bei Herzkammerflimmern gibt der Defi immer Schock ab."},{"id":"def11","t":"def","f":"Was ist eine Asystolie, und hilft der Defi?","a":["Gar kein Herzschlag, keine elektrische Aktivität (Nulllinie)","Der Defi gibt keinen Schock","Nur Drücken hilft"],"s":"S. 29, Unterricht","p":true,"n":"Wenn gar kein Herzschlag, dann hilft kein Defi (Asystolie)."},{"id":"def12","t":"def","f":"Welche Herzrhythmen sind schockbar, welche nicht?","a":["Schockbar: Kammerflimmern, pulslose ventrikuläre Tachykardie","Nicht schockbar: Asystolie, pulslose elektrische Aktivität"],"s":"nachgeschlagen","q":"e"},{"id":"def13","t":"def","f":"Wo klebst du die Elektroden bei Erwachsenen hin?","a":["Rechts oben unter dem Schlüsselbein, neben dem Brustbein","Links seitlich am Brustkorb, unter der Achsel"],"s":"Bild auf den Elektroden","q":"e"},{"id":"def06","t":"def","f":"Bei einem kleinen Kind ist vorne kein Platz für zwei Elektroden. Was tust du?","a":["Eine vorne in die Brustmitte, eine hinten zwischen die Schulterblätter","Kinder-Elektroden nehmen, wenn vorhanden"],"s":"S. 29, Unterricht","p":true,"n":"Bei kleinen Kindern vorne und hinten."},{"id":"def04","t":"def","f":"Welche Sicherheitsregeln gelten beim AED?","a":["Nasse Brust abtrocknen","Starke Behaarung notfalls rasieren, Drücken hat Vorrang","Keine Nässe als Stromverbindung","Beim Schock berührt niemand die Person"],"s":"S. 28"},{"id":"ver01","t":"ver","f":"Woran unterscheidest du leichte und schwere Verlegung der Atemwege?","a":["Leicht: Person hustet kräftig, weiter husten lassen","Schwer: kann nicht atmen, sprechen oder husten, Lebensgefahr"],"s":"S. 30","p":true},{"id":"ver03","t":"ver","f":"Wie gehst du bei einer schweren Verlegung vor?","a":["Notruf veranlassen","Vorbeugen, stützen, bis 5 Schläge zwischen die Schulterblätter","Dann bis 5 Heimlich-Griffe","Im Wechsel wiederholen","Danach immer ins Krankenhaus"],"s":"S. 30 bis 31","p":true},{"id":"ver04","t":"ver","f":"Wie geht der Heimlich-Griff?","a":["Hinter die Person, Arme um den Oberbauch","Faust zwischen Nabel und Brustkorb","Bis 5 Mal kräftig nach innen und oben ziehen"],"s":"S. 31"},{"id":"ver06","t":"ver","f":"Die Person mit dem Fremdkörper wird bewusstlos. Was jetzt?","a":["Atem-Kreislauf-Stillstand: sofort Wiederbelebung","Vor dem Beatmen sichtbare Fremdkörper aus dem Mund holen"],"s":"S. 30"},{"id":"blu01","t":"blu","f":"Woran erkennst du eine starke Blutung?","a":["Blut spritzt oder kommt im Schwall","Im Zweifel als stark behandeln"],"s":"S. 32"},{"id":"blu02","t":"blu","f":"Welche zwei Möglichkeiten hast du, eine starke Blutung zu stillen?","a":["Manueller Druck: geht überall","Druckverband: nur an Armen und Beinen, Hände werden frei"],"s":"S. 32","p":true},{"id":"blu03","t":"blu","f":"Welche drei Eigenschaften muss ein Druckkörper haben?","a":["Größer als die Wunde","Saugfähig","Passt sich der Körperform an"],"s":"S. 32","p":true,"n":"Kommt zur Prüfung."},{"id":"blu04","t":"blu","f":"Es blutet durch den Druckverband durch. Was tust du?","a":["Zusätzlich mit der Hand auf den Druckverband drücken"],"s":"S. 32"},{"id":"blu06","t":"blu","f":"Was ist dein erster Schritt bei einer starken Blutung?","a":["Einmalhandschuhe anziehen","Die Person selbst fest auf die Wunde drücken lassen"],"s":"S. 32"},{"id":"fall01","t":"reg","typ":"fall","f":"Im Park liegt ein Mann am Boden und reagiert nicht. Spiel den Notfallcheck durch.","a":["„Umgebung sicher.“","Rütteln: „Hallo, hallo, können Sie mich hören?“","Laut um Hilfe rufen, Aufgaben verteilen (Rettung, Defi, Verbandskasten)","Atemwege frei, Kopf überstrecken, max. 10 s Atmung prüfen","Atmet: stabile Seitenlage, laufend kontrollieren","Atmet nicht oder unsicher: 30 : 2, Defi"],"s":"S. 22 bis 27","p":true},{"id":"fall02","t":"reg","typ":"fall","f":"Bei der Atemkontrolle hörst du alle paar Sekunden ein schnappendes Geräusch. Was tust du?","a":["Schnappatmung ist keine normale Atmung","Sofort Wiederbelebung, Defi holen lassen"],"s":"S. 24, S. 26"},{"id":"fall03","t":"ver","typ":"fall","f":"Im Restaurant greift sich eine Frau an den Hals, sie kann nicht sprechen und nicht husten. Was tust du?","a":["Schwere Verlegung: Notruf veranlassen","Bis 5 Rückenschläge, bis 5 Heimlich, im Wechsel","Wird sie bewusstlos: Wiederbelebung","Danach ins Krankenhaus"],"s":"S. 30 bis 31","p":true},{"id":"fall04","t":"def","typ":"fall","f":"Prüfungssituation: Du drückst, der AED analysiert und meldet Kammerflimmern. Was passiert, was tust du?","a":["Während der Analyse: Hände weg","Bei Kammerflimmern gibt der Defi einen Schock: alle weg, Schock auslösen","Danach sofort weiterdrücken, Anweisungen folgen"],"s":"S. 28 bis 29","p":true},{"id":"fall05","t":"blu","typ":"fall","f":"Aus einer Wunde am Unterarm spritzt Blut, ein Verbandskoffer ist da. Was tust du?","a":["Handschuhe, Person selbst drücken lassen oder selbst drücken","Notruf veranlassen","Druckverband mit Druckkörper (größer, saugfähig, anschmiegsam)","Blutet es durch: zusätzlich drücken","Wärme, betreuen"],"s":"S. 32","p":true},{"id":"fall06","t":"weg","typ":"fall","f":"Auf einer Landstraße liegt nach einem Unfall eine Person reglos auf der Fahrbahn. Was tust du zuerst?","a":["3 W: Warnblinker, Warnweste, Warndreieck","Selbstschutz prüfen","Person wegziehen: Arme hinter dem Kopf kreuzen, an den Handgelenken ziehen","Dann Notfallcheck"],"s":"S. 17, S. 20"},{"id":"fall07","t":"not","typ":"fall","f":"Ein Kind hat aus einer Putzmittelflasche getrunken und ist ansprechbar. Wen rufst du an?","a":["Vergiftungsinformationszentrale +43 1 406 43 43","Bei Beschwerden oder Lebensgefahr: 144"],"s":"S. 17","p":true},{"id":"fall08","t":"bas","typ":"fall","f":"Eine ältere Frau ist ansprechbar, aber sehr kurzatmig. Welche Basismaßnahmen setzt du?","a":["Vornübergebeugt sitzen lassen, Arme abstützen","Frische Luft, enge Kleidung lockern","Look, Listen, Link: beruhigen, zuhören","Notruf, wenn es ein Notfall ist"],"s":"S. 18 bis 19","p":true},{"id":"fall09","t":"abc","typ":"fall","f":"Du kommst als Sanitäter:in zu einer Person, die stark blutet und kaum ansprechbar ist. Woran hältst du dich?","a":["SSS: Szene, Sicherheit, Situation","EE: Erster Eindruck, Blutung sofort stillen","Dann A, B, C, D, E","Kritisch: Notarzt nachfordern"],"s":"S. 16","p":true},{"id":"fall10","t":"not","typ":"fall","f":"Ein Lkw mit orangefarbener Warntafel ist umgekippt, Flüssigkeit läuft aus, der Fahrer sitzt im Führerhaus. Was tust du?","a":["GAMS: Gefahr erkennen, im Zweifel die größte annehmen","Absperren, Abstand halten, nicht hineinlaufen","Den Fahrer nur retten, wenn es ohne Eigengefährdung geht","Spezialkräfte über den Notruf nachfordern, Nummern der Warntafel durchgeben"],"s":"S. 17, nachgeschlagen","q":"e"},{"id":"fall11","t":"bas","typ":"fall","f":"Ein Mann krümmt sich vor Bauchschmerzen, ein anderer ist blass und ihm ist schwindlig. Wie lagerst du die beiden?","a":["Bauchschmerzen: Beine zum Bauch anziehen","Kreislaufprobleme: Rückenlage, Beine angewinkelt hoch (L-Form)"],"s":"Unterricht","p":true}],"skizzen":{"wegziehen-1":"<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"Arme am Boden entlang nach oben führen\"><line x1=\"8\" y1=\"92\" x2=\"192\" y2=\"92\" stroke-width=\"2\" opacity=\".35\"/><circle cx=\"60\" cy=\"80\" r=\"10\"/><path d=\"M70 82 L140 84 M140 84 L178 80 M140 84 L176 90\"/><path d=\"M80 83 L104 92\" opacity=\".35\" stroke-dasharray=\"4 6\"/><path d=\"M78 80 L52 66 M80 82 L40 74\"/><path d=\"M34 60 Q46 40 70 48\" stroke=\"var(--accent)\"/><path d=\"M64 42 L71 48 L62 53\" stroke=\"var(--accent)\"/><\/svg>","wegziehen-2":"<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"Arme unter dem Kopf überkreuzen\"><line x1=\"8\" y1=\"92\" x2=\"192\" y2=\"92\" stroke-width=\"2\" opacity=\".35\"/><circle cx=\"78\" cy=\"80\" r=\"10\"/><path d=\"M88 82 L156 84 M156 84 L190 80 M156 84 L188 90\"/><path d=\"M92 80 L60 90 L36 74 M92 84 L58 74 L34 88\"/><circle cx=\"34\" cy=\"74\" r=\"3\" fill=\"currentColor\"/><circle cx=\"34\" cy=\"88\" r=\"3\" fill=\"currentColor\"/><text x=\"44\" y=\"30\" fill=\"var(--accent)\" stroke=\"none\" font-size=\"22\" font-family=\"system-ui, sans-serif\" font-weight=\"700\">X<\/text><\/svg>","wegziehen-3":"<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"An den Handgelenken in Sicherheit ziehen\"><line x1=\"8\" y1=\"92\" x2=\"192\" y2=\"92\" stroke-width=\"2\" opacity=\".35\"/><circle cx=\"104\" cy=\"80\" r=\"10\"/><path d=\"M114 82 L170 84 M170 84 L196 80 M170 84 L194 90\"/><path d=\"M118 80 L84 90 L62 80 M118 84 L82 76 L62 84\"/><circle cx=\"30\" cy=\"22\" r=\"9\"/><path d=\"M34 31 L46 58 L40 92 M46 58 L60 90 M38 40 L62 80 M38 44 L62 84\"/><path d=\"M28 104 L6 104\" stroke=\"var(--accent)\"/><path d=\"M13 98 L6 104 L13 110\" stroke=\"var(--accent)\"/><\/svg>"}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("daten").textContent);
  const THEMA = Object.fromEntries(D.themen.map(t => [t.id, t]));
  const IV = [0, 1, 2, 4, 8, 16, 32, 64];
  const NEU_PRO_TAG = 20;
  const LS = "sani-lernkartei-v1";
  let prog = {};
  let db = null, quelle = "lokal", geladen = false;
  let queue = [], aktuell = null, offen = false, bewertetInSitzung = 0;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function heute(plus) { const d = new Date(); d.setHours(12, 0, 0, 0); if (plus) d.setDate(d.getDate() + plus); return d.toISOString().slice(0, 10); }
  function lokalLesen() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
  function lokalSchreiben() { try { localStorage.setItem(LS, JSON.stringify(prog)); } catch (e) {} }

  function istFaellig(k) { const p = prog[k.id]; return p && p.d && p.d <= heute(); }
  function istNeu(k) { return !prog[k.id]; }
  function heuteEingefuehrt() { const h = heute(); return Object.values(prog).filter(p => p.e === h).length; }
  function passt(k) {
    const f = $("filter").value;
    if (f === "alle") return true;
    if (f === "pruef") return !!k.p;
    if (f === "fall") return k.typ === "fall";
    return k.t === f;
  }
  function mischen(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function baueQueue() {
    const karten = D.karten.filter(passt);
    if ($("modus").value === "alle") { queue = mischen(karten.slice()); }
    else {
      const faellig = karten.filter(istFaellig).sort((a, b) => prog[a.id].d.localeCompare(prog[b.id].d));
      const frei = Math.max(0, NEU_PRO_TAG - heuteEingefuehrt());
      const neu = karten.filter(istNeu).slice(0, frei);
      queue = faellig.concat(neu);
    }
    naechste();
  }
  function naechste() { aktuell = queue.shift() || null; offen = false; zeichneKarte(); zaehlen(); }

  function intervall(k, g) {
    const p = prog[k.id] || { b: 0 };
    if (g === 0) return "gleich";
    if (g === 1) return "1 Tag";
    const b = Math.min(p.b + (g === 3 ? 2 : 1), IV.length - 1);
    return IV[b] === 1 ? "1 Tag" : IV[b] + " Tage";
  }
  function bewerte(g) {
    const k = aktuell; if (!k) return;
    const alt = prog[k.id] || { b: 0, r: 0, f: 0, e: heute() };
    const p = { b: alt.b || 0, r: alt.r || 0, f: alt.f || 0, e: alt.e || heute() };
    if (g === 0) { p.b = 0; p.d = heute(); p.f += 1; queue.splice(Math.min(3, queue.length), 0, k); }
    else if (g === 1) { p.b = Math.max(1, p.b); p.d = heute(1); p.r += 1; }
    else { p.b = Math.min(p.b + (g === 3 ? 2 : 1), IV.length - 1); p.d = heute(IV[p.b]); p.r += 1; }
    p.z = Date.now();
    prog[k.id] = p; bewertetInSitzung += 1;
    lokalSchreiben(); speichern(k.id, p);
    naechste();
  }

  const ketten = {};
  function speichern(id, p) {
    if (!db) return;
    ketten[id] = (ketten[id] || Promise.resolve()).then(() => db.collection("fortschritt").doc(id).set(p)).catch(err => {
      $("status").textContent = "Speichern in der Cloud gerade nicht möglich, dein Fortschritt bleibt auf diesem Gerät.";
    });
  }

  function marken(k) {
    const m = [];
    if (k.p) m.push('<span class="tag p">★ Prüfung</span>');
    if (k.typ === "fall") m.push('<span class="tag fall">Fall</span>');
    if (k.q === "e") m.push('<span class="tag e">Ergänzung</span>');
    return m.join("");
  }
  function bilder(liste) {
    return '<div class="bilder">' + liste.map(b => '<figure>' + ((D.skizzen || {})[b.src] || "") + (b.text ? '<figcaption>' + esc(b.text) + '</figcaption>' : '') + '</figure>').join("") + '</div>';
  }
  function zeichneKarte() {
    const el = $("karte");
    if (!aktuell) {
      const imFilter = D.karten.filter(passt);
      const offenNeu = imFilter.filter(istNeu).length;
      el.innerHTML = '<div class="karte leer"><h2>' + (bewertetInSitzung ? "Für heute geschafft" : "Gerade nichts fällig") + '</h2>' +
        '<p class="hinweis">' + (offenNeu ? offenNeu + " neue Karten warten, das Tageslimit von " + NEU_PRO_TAG + " ist erreicht." : "Alle Karten in diesem Bereich sind eingeplant.") + '</p>' +
        '<button id="weiter" class="zeigen" style="width:auto">Trotzdem weiter üben</button></div>';
      $("weiter").onclick = () => { $("modus").value = "alle"; baueQueue(); };
      return;
    }
    const k = aktuell, t = THEMA[k.t];
    let h = '<article class="karte"><div class="oben"><span>' + esc(t.titel) + '</span><div class="marken">' + marken(k) + '</div></div>' +
      '<p class="frage">' + esc(k.f) + '</p>';
    if (!offen) {
      h += '<button class="zeigen" id="zeigen">Antwort zeigen</button>';
    } else {
      h += '<ul class="antwort">' + k.a.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul>';
      if (k.b) h += bilder(k.b.map(n => ({ src: n })));
      if (k.n) h += '<div class="notiz"><small>Deine Notiz</small>' + esc(k.n) + '</div>';
      h += '<p class="quelle">' + (k.q === "e" ? "Ergänzung von Claude, Bezug: " : "Lehrbuch ") + esc(k.s) + '</p>';
      const L = ["Nochmal", "Schwer", "Gut", "Leicht"];
      h += '<div class="bewerten">' + L.map((l, i) => '<button class="b' + i + '" data-g="' + i + '">' + l + '<span>' + intervall(k, i) + '</span></button>').join("") + '</div>';
    }
    h += '</article>';
    el.innerHTML = h;
    if (!offen) $("zeigen").onclick = () => { offen = true; zeichneKarte(); };
    el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => bewerte(+b.dataset.g));
  }
  function zaehlen() {
    const alle = D.karten;
    $("z-faellig").textContent = alle.filter(istFaellig).length;
    $("z-neu").textContent = alle.filter(istNeu).length;
    $("z-sicher").textContent = alle.filter(k => prog[k.id] && prog[k.id].b >= 3).length;
  }

  function zeichneBlatt() {
    $("blatt").innerHTML = '<p class="hinweis">' + esc(D.quelle) + '. ★ = von dir markiert oder prüfungsrelevant.</p>' + D.themen.map(t => {
      let h = '<details class="thema"><summary><h3>' + esc(t.titel) + '</h3><span class="seiten">' + esc(t.seiten) + '</span></summary><div class="inhalt">';
      h += '<p class="kern">' + esc(t.kern) + '</p>';
      h += '<ul class="punkte">' + t.punkte.map(p => p.startsWith("★") ? '<li class="stern">' + esc(p.slice(1).trim()) + '</li>' : '<li>' + esc(p) + '</li>').join("") + '</ul>';
      if (t.merke) h += '<div class="merke">' + esc(t.merke) + '</div>';
      if (t.bilder) h += bilder(t.bilder);
      if (t.ergaenzung && t.ergaenzung.length) h += '<div class="erg"><strong>Ergänzung von Claude</strong>' + t.ergaenzung.map(x => '<p>' + esc(x) + '</p>').join("") + '</div>';
      (t.notizen || []).forEach(n => { h += '<div class="notiz"><small>Deine Notiz, ' + esc(n.ort) + (n.unsicher ? '<span class="offen">noch klären</span>' : '') + '</small>' + esc(n.text) + '</div>'; });
      return h + '</div></details>';
    }).join("");
  }
  function zeichneStand() {
    let h = '<h2 class="abschnitt">Themen</h2><div class="box">';
    D.themen.forEach(t => {
      const ks = D.karten.filter(k => k.t === t.id), n = ks.length;
      const sicher = ks.filter(k => prog[k.id] && prog[k.id].b >= 3).length;
      const lernt = ks.filter(k => prog[k.id] && prog[k.id].b < 3).length;
      const f = ks.filter(istFaellig).length;
      h += '<div class="zeile"><span class="name">' + esc(t.titel) + '</span><span class="werte">' + sicher + '/' + n + ' sicher' + (f ? ' · ' + f + ' fällig' : '') + '</span>' +
        '<div class="balken" role="img" aria-label="' + sicher + ' sicher, ' + lernt + ' in Arbeit von ' + n + '"><i class="sicher" style="width:' + (100 * sicher / n) + '%"></i><i class="lernt" style="width:' + (100 * lernt / n) + '%"></i></div></div>';
    });
    h += '</div><div class="legende"><span><i style="background:var(--good)"></i>sicher (ab 4 Tagen Abstand)</span><span><i style="background:var(--accent)"></i>in Arbeit</span><span><i style="background:var(--line)"></i>neu</span></div>';
    const schwach = D.karten.filter(k => prog[k.id] && prog[k.id].f >= 2 && prog[k.id].f >= prog[k.id].r).sort((a, b) => prog[b.id].f - prog[a.id].f).slice(0, 10);
    h += '<h2 class="abschnitt">Schwierige Karten</h2><div class="box">' + (schwach.length ? schwach.map(k => '<div class="schwach"><b>' + esc(k.f) + '</b><span class="hinweis">' + prog[k.id].f + '× nochmal, ' + esc(THEMA[k.t].titel) + '</span></div>').join("") : '<p class="hinweis">Noch keine. Karten, bei denen du öfter „Nochmal“ drückst, landen hier.</p>') + '</div>';
    h += '<p class="status">' + (quelle === "cloud" ? "Fortschritt wird über alle deine Geräte synchronisiert." : quelle === "laedt" ? "Fortschritt wird geladen …" : "Fortschritt nur auf diesem Gerät gespeichert.") + ' Stand der Inhalte: ' + esc(D.stand) + ', ' + D.karten.length + ' Karten.</p>';
    h += '<button class="knopf" id="kopieren">Fortschritt für Claude kopieren</button><p class="hinweis" id="kopiert">Kopiert den Lernstand. Füge ihn im Chat ein, dann sehe ich, wo es hakt.</p>';
    $("stand").innerHTML = h;
    $("kopieren").onclick = async () => {
      const text = "Lernstand Sani-Lernkartei " + heute() + "\n" + JSON.stringify(prog);
      try { await navigator.clipboard.writeText(text); $("kopiert").textContent = "Kopiert. Jetzt im Chat mit Claude einfügen."; }
      catch (e) { const ta = document.createElement("textarea"); ta.value = text; ta.rows = 4; ta.style.width = "100%"; $("kopiert").replaceWith(ta); ta.select(); }
    };
  }

  function filterFuellen() {
    const o = ['<option value="alle">Alle Themen</option>', '<option value="pruef">★ Nur Prüfungsstoff</option>', '<option value="fall">Nur Fallbeispiele</option>'];
    D.themen.forEach(t => o.push('<option value="' + t.id + '">' + esc(t.titel) + '</option>'));
    $("filter").innerHTML = o.join("");
  }
  function ansicht(v) {
    document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.v === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    $("v-lernen").hidden = v !== "lernen"; $("v-blatt").hidden = v !== "blatt"; $("v-stand").hidden = v !== "stand";
    if (v === "stand") zeichneStand();
    try { localStorage.setItem(LS + "-ansicht", v); } catch (e) {}
    window.scrollTo(0, 0);
  }

  async function verbinden() {
    if (!window.claude || !window.claude.use) { quelle = "lokal"; return; }
    quelle = "laedt";
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { quelle = "lokal"; $("status").textContent = "Fortschritt wird nur auf diesem Gerät gespeichert."; return; }
    const timer = setTimeout(() => { if (!geladen) $("status").textContent = "Der gespeicherte Fortschritt ist gerade nicht erreichbar. Du kannst trotzdem lernen."; }, 10000);
    db.collection("fortschritt").onSnapshot(snap => {
      const neu = {};
      snap.docs.forEach(d => { neu[d.id] = Object.assign({}, d.data()); });
      Object.keys(prog).forEach(id => { if (!neu[id] || (prog[id].z || 0) > (neu[id].z || 0)) neu[id] = prog[id]; });
      prog = neu; lokalSchreiben();
      if (!snap.metadata.fromCache) { clearTimeout(timer); quelle = "cloud"; $("status").textContent = ""; }
      const ersterStand = !geladen; geladen = true;
      if (ersterStand && bewertetInSitzung === 0 && !offen) baueQueue(); else zaehlen();
      if (!$("v-stand").hidden) zeichneStand();
    }, err => { clearTimeout(timer); quelle = "lokal"; $("status").textContent = "Cloud-Speicher nicht verfügbar, Fortschritt bleibt auf diesem Gerät."; });
  }

  prog = lokalLesen();
  $("kursname").textContent = D.kurs + " · Kapitel 1";
  filterFuellen();
  zeichneBlatt();
  $("filter").onchange = baueQueue;
  $("modus").onchange = baueQueue;
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => ansicht(b.dataset.v));
  baueQueue();
  let start = "lernen"; try { start = localStorage.getItem(LS + "-ansicht") || "lernen"; } catch (e) {}
  if (start !== "lernen") ansicht(start);
  verbinden();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
