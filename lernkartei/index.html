<style>
/* Layout: eine schmale Lernspalte wie ein Kartenstapel, Navigation unten am Daumen; Akzent in Rettungsdecken-Gold, deine Notizen in Kugelschreiber-Blau */
:root {
  --bg: #eef1ef; --panel: #ffffff; --ink: #15202a; --muted: #56626b; --line: #d6dcd9;
  --accent: #c58f1c; --accent-ink: #1d1503; --accent-soft: #f6ead0;
  --pen: #2b3fa6; --pen-soft: #e9ecfa;
  --again: #b83c28; --hard: #a86a12; --good: #2a7449; --easy: #285f9f;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1317; --panel: #172028; --ink: #e6ebee; --muted: #9aa6ae; --line: #2a3640;
  --accent: #e2b04c; --accent-ink: #1d1503; --accent-soft: #3a2f17;
  --pen: #9aabff; --pen-soft: #1f2645;
  --again: #ef7b66; --hard: #e3a84f; --good: #61c38e; --easy: #74aaea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1317; --panel: #172028; --ink: #e6ebee; --muted: #9aa6ae; --line: #2a3640;
  --accent: #e2b04c; --accent-ink: #1d1503; --accent-soft: #3a2f17;
  --pen: #9aabff; --pen-soft: #1f2645;
  --again: #ef7b66; --hard: #e3a84f; --good: #61c38e; --easy: #74aaea; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
header.kopf { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.marke { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: .01em; line-height: 1; text-wrap: balance; }
.marke small { display: block; font-weight: 500; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.zahlen { display: flex; gap: 14px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.zahl { text-align: right; }
.zahl b { display: block; font-size: 28px; line-height: 1; font-weight: 700; }
.zahl span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.zahl.faellig b { color: var(--accent); }
.leiste { display: flex; gap: 8px; flex-wrap: wrap; }
select { font: inherit; font-size: 15px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; flex: 1 1 160px; }
.karte { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 1px 0 var(--line), 0 10px 24px -18px rgba(0,0,0,.35); }
.oben { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.marken { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.p { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.tag.fall { border-color: var(--ink); color: var(--ink); }
.tag.e { border-style: dashed; }
.frage { font-size: 22px; line-height: 1.35; font-weight: 700; text-wrap: balance; margin: 0; }
.antwort { margin: 0; padding: 14px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 8px; list-style: none; }
.antwort li { padding-left: 22px; position: relative; }
.antwort li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.notiz { background: var(--pen-soft); color: var(--pen); border-radius: 10px; padding: 8px 12px 10px; font-family: var(--f-hand); font-size: 23px; line-height: 1.2; }
.notiz small { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; margin-bottom: 2px; }
.notiz .offen { font-family: var(--f-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: middle; }
.quelle { font-size: 14px; color: var(--muted); }
.bilder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.bilder figure { margin: 0; display: grid; gap: 4px; color: var(--ink); background: var(--bg); border-radius: 10px; padding: 6px; }
.bilder svg { width: 100%; height: auto; display: block; }
.bilder figcaption { font-size: 12px; line-height: 1.3; color: var(--muted); text-align: center; }
.knopf { justify-self: start; font-weight: 700; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 12px 14px; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.zeigen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; width: 100%; font-size: 18px; }
.bewerten { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bewerten button { display: grid; gap: 2px; padding: 10px 4px; font-weight: 700; font-size: 15px; border-width: 2px; }
.bewerten button span { font-family: var(--f-display); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.b0 { border-color: var(--again); color: var(--again); } .b1 { border-color: var(--hard); color: var(--hard); }
.b2 { border-color: var(--good); color: var(--good); } .b3 { border-color: var(--easy); color: var(--easy); }
.leer { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 28px; }
.leer h2 { font-family: var(--f-display); font-size: 28px; margin: 0; }
.hinweis { font-size: 14px; color: var(--muted); }
details.thema { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
details.thema > summary { list-style: none; padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; cursor: pointer; }
details.thema > summary::-webkit-details-marker { display: none; }
.thema h3 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 600; text-wrap: balance; }
.thema .seiten { font-family: var(--f-display); font-size: 14px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
.inhalt { padding: 0 16px 16px; display: grid; gap: 12px; }
.kern { margin: 0; font-size: 17px; }
.punkte { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.punkte li.stern::marker { content: "★ "; color: var(--accent); }
.merke { border-left: 4px solid var(--accent); padding: 6px 12px; font-weight: 700; }
.erg { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; display: grid; gap: 6px; }
.erg strong { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.erg p { margin: 0; }
.zeile { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.zeile:last-child { border-bottom: 0; }
.zeile .name { font-weight: 700; min-width: 0; }
.zeile .werte { font-family: var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.balken { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
.balken i { display: block; height: 100%; }
.balken .sicher { background: var(--good); } .balken .lernt { background: var(--accent); }
.legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
h2.abschnitt { font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }
.schwach { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.schwach:last-child { border-bottom: 0; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
nav.tabs div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: none; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 14px 4px; border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.status { font-size: 13px; color: var(--muted); }
.bereiche { display: flex; gap: 6px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.bereiche button { flex: 1 1 0; min-width: 0; border: 0; border-radius: 9px; padding: 9px 8px; background: none; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .03em; color: var(--muted); }
.bereiche button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (prefers-reduced-motion: no-preference) { .karte { animation: rein .18s ease-out; } @keyframes rein { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }
@media (max-width: 380px) { .frage { font-size: 20px; } .bewerten button { font-size: 14px; } }
</style>
