<style>
/* Layout: zwei Reiter. Einkaufen (Tage, Gefrierfach, Gerichte, Liste in der Reihenfolge des Spar-Rundgangs) und Kochen (Rezepte mit den Mengen dieses Einkaufs). */
:root {
  --bg: #f1f4ef;
  --surface: #ffffff;
  --ink: #17211b;
  --muted: #5b6a61;
  --line: #d9e1db;
  --accent: #2b6a4c;
  --accent-ink: #ffffff;
  --soft: #e1ede5;
  --done: #9aa8a0;
  --warn: #93590a;
  --font-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411; --surface: #18201b; --ink: #e6ede8; --muted: #97a69d; --line: #29332d;
    --accent: #72c497; --accent-ink: #0b1810; --soft: #1d3326; --done: #5e6c64; --warn: #e0a64e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411; --surface: #18201b; --ink: #e6ede8; --muted: #97a69d; --line: #29332d;
  --accent: #72c497; --accent-ink: #0b1810; --soft: #1d3326; --done: #5e6c64; --warn: #e0a64e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 48px;
  display: flex; flex-direction: column; gap: 14px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; margin: 0; }
.sync { font-size: 0.78rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); display: inline-block; }
.sync[data-s="ok"] i { background: var(--accent); }
.sync[data-s="busy"] i { background: var(--warn); }

.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: var(--line); padding: 4px; border-radius: 16px; }
.seg button {
  font: inherit; border: 0; border-radius: 12px; padding: 9px 8px; background: transparent; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer;
}
.seg button small { font-size: 0.74rem; color: var(--muted); }
.seg button b { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.seg button:focus-visible, .chip:focus-visible, .step:focus-visible, .row:focus-within, .linkbtn:focus-visible, select:focus-visible, .tog:focus-within {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.daysrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 10px; }
.step {
  width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 1.5rem; line-height: 1; cursor: pointer; display: grid; place-items: center;
}
.step:disabled { opacity: .35; cursor: default; }
.daysval { min-width: 82px; text-align: center; }
.daysval b { font-family: var(--font-display); font-weight: 800; font-size: 2rem; font-variant-numeric: tabular-nums; display: block; line-height: 1; }
.daysval span { font-size: 0.8rem; color: var(--muted); }
.cookday { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
select {
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.until { font-size: 0.92rem; color: var(--muted); margin-top: -4px; }
.until b { color: var(--ink); font-weight: 600; }
.label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.94rem; border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip em { font-style: normal; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] em { color: var(--accent-ink); opacity: .8; }
.togs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tog { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 0.94rem; }
.tog input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; flex: none; }
.summary { font-size: 0.88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
.summary b { color: var(--ink); font-weight: 600; }
.note { color: var(--warn); font-size: 0.86rem; }

.listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.18rem; margin: 0; letter-spacing: -0.01em; }
.prog { font-size: 0.86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.area { display: flex; flex-direction: column; }
.area .label { padding: 12px 0 4px; }
.row {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px;
  padding: 11px 2px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px;
}
.area .row:last-child { border-bottom: 0; }
.row input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.box { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { width: 14px; height: 14px; opacity: 0; }
.row input:checked + .box { background: var(--accent); border-color: var(--accent); }
.row input:checked + .box svg { opacity: 1; }
.what { min-width: 0; }
.what b { font-weight: 600; display: block; }
.what small { color: var(--muted); font-size: 0.8rem; display: block; overflow-wrap: anywhere; }
.qty { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.qty small { display: block; font-weight: 400; color: var(--muted); font-size: 0.78rem; }
.row.is-done .what b, .row.is-done .qty { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row.is-done .what small, .row.is-done .qty small { color: var(--done); }
.linkbtn { font: inherit; font-size: 0.86rem; background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; font-weight: 600; }
.linkbtn.armed { color: var(--warn); }
.empty { color: var(--muted); font-size: 0.94rem; padding: 6px 0; }
.kit { background: var(--soft); border-radius: 12px; padding: 0 12px 4px; margin-top: 4px; }
.kit .row { border-bottom-color: var(--line); }
.kitnote { margin: 0; padding: 4px 0 8px; font-size: 0.84rem; color: var(--muted); }
.kit .row:last-of-type { border-bottom: 0; }

details.rec { border-top: 1px solid var(--line); }
details.rec:first-of-type { border-top: 0; }
details.rec summary { list-style: none; cursor: pointer; padding: 12px 0; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.rec summary::-webkit-details-marker { display: none; }
details.rec summary b { font-weight: 600; margin-right: auto; }
details.rec summary .thumb { width: 46px; height: 46px; border-radius: 12px; object-fit: cover; flex: none; }
.recbody .hero { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; border-radius: 14px; }
/* Echte Fotos mit langsamem, nahtlosem Zoom und Schwenk (seit 24.11.2026, Gregors Wunsch: realistisch statt Zeichnung, wie ein kleiner Loop) */
.recbody .hero-fig { margin: 0; }
.recbody .hero-rahmen { overflow: hidden; border-radius: 14px; aspect-ratio: 8 / 5; }
.recbody .hero-rahmen .hero { height: 100%; border-radius: 0; object-fit: cover; transform-origin: 58% 46%; animation: hero-loop 18s ease-in-out infinite alternate; will-change: transform; }
@keyframes hero-loop { from { transform: scale(1.03) translate(0, 0); } to { transform: scale(1.13) translate(-2.2%, -1.6%); } }
@media (prefers-reduced-motion: reduce) { .recbody .hero-rahmen .hero { animation: none; } }
.recbody .hero-fig figcaption { margin-top: 4px; font-size: .68rem; line-height: 1.3; color: var(--muted); }
.recbody .hero-fig figcaption a { color: inherit; }
details.rec summary span { color: var(--muted); font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
details.rec summary::after { content: "+"; color: var(--accent); font-weight: 700; margin-left: 4px; }
details.rec[open] summary::after { content: "−"; }
.recbody { padding: 0 0 14px; display: flex; flex-direction: column; gap: 10px; font-size: 0.94rem; }
.recbody ul, .recbody ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.recbody .meta { color: var(--muted); font-size: 0.84rem; }
.recbody .portions { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.recbody .portions b { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.recbody h3 { margin: 4px 0 0; font-size: 0.8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.recbody .keep { background: var(--soft); border-radius: 10px; padding: 8px 10px; font-size: 0.88rem; }
.foot { font-size: 0.8rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .bar i, .box { transition: none; } }
.linkknopf { font: inherit; font-size: 0.8rem; color: var(--muted); background: none; border: 0; text-decoration: underline; min-height: 44px; padding: 0 8px; cursor: pointer; }
#uebertragenText { width: 100%; min-height: 80px; font: 12px/1.3 ui-monospace, monospace; }
/* Eingebettet in Tagwerk: Kopfzeile aus, Übertragen-Knopf aus */
.eingebettet header.top, .eingebettet #uebertragenZeile { display: none; }
.eingebettet .wrap { padding-block: 12px 24px; }
/* Eingebettet in der App Wieser Ventures: Farben der Canada-Goose-Präsentation (seit 15.11.2026), eigenständige App unverändert */
html.eingebettet { --bg: #F3F6F8; --surface: #ffffff; --ink: #0E2841; --muted: #4F6575; --line: #D3E0E8; --accent: #084F6A; --accent-ink: #ffffff; --soft: #E2EEF3; --done: #9AAFBC; }
@media (prefers-color-scheme: dark) { html.eingebettet:not([data-theme="light"]) { --bg: #071827; --surface: #0E2336; --ink: #E4EEF4; --muted: #93AABA; --line: #1E3A52; --accent: #4CC3F0; --accent-ink: #06202F; --soft: #12324A; --done: #4F6A7C; color-scheme: dark } }
html.eingebettet[data-theme="dark"] { --bg: #071827; --surface: #0E2336; --ink: #E4EEF4; --muted: #93AABA; --line: #1E3A52; --accent: #4CC3F0; --accent-ink: #06202F; --soft: #12324A; --done: #4F6A7C; color-scheme: dark }
</style>

      if (intIn(c.days, 1, 10)) s.days = c.days;
      if (Array.isArray(c.dishes)) { const d = fixDishes(c.dishes); if (d.length) s.dishes = d; }
      if (typeof c.fr === "boolean") s.fr = c.fr;
      if (typeof c.sn === "boolean") s.sn = c.sn;
    }
    if (raw.checked && typeof raw.checked === "object") {
      // Haken der alten Einkaufstage passen nicht mehr, nur die Küchenausstattung bleibt.
      for (const [k, v] of Object.entries(raw.checked)) if (v === true && (raw.v === 2 || k.startsWith("k-"))) s.checked[k] = true;
    }
    return s;
  }

  let state = normalize(safeParse(lsGet(LS_STATE)) || window.MP_START || null);
  const SHOP = 0, BOOK = 1;
  let tab = lsGet(LS_TAB) === "2" || lsGet(LS_TAB) === "book" ? BOOK : SHOP;
  function safeParse(t) { try { return t ? JSON.parse(t) : null; } catch (e) { return null; } }

  // ---------- Rechnen ----------
  // 2 Boxen pro Tag. Boxen aus dem Gefrierfach zuerst, der Rest wird in Kochrunden zu 4 Portionen gekocht.
  // Jedes gewählte Gericht bekommt mindestens eine Runde, weitere Runden reihum.
  function plan() {
    const days = state.days, meals = 2 * days;
    const fromFreezer = Math.min(state.frozen, meals), need = meals - fromFreezer;
    const sel = DISH_ORDER.filter(k => state.dishes.includes(k));
    const rounds = {};
    let total = 0;
    if (need > 0 && sel.length) {
      total = Math.max(Math.ceil(need / BATCH), sel.length);
      sel.forEach((k, i) => { rounds[k] = Math.floor(total / sel.length) + (i < total % sel.length ? 1 : 0); });
    }
    const cooked = total * BATCH, extra = Math.max(0, cooked - need);
    return { days, meals, fromFreezer, need, sel, rounds, total, cooked, extra, minRounds: need > 0 ? Math.ceil(need / BATCH) : 0,
      frozenAfter: state.frozen - fromFreezer + extra, missing: need > 0 && !sel.length ? need : 0 };
  }

  // Beste Packungszahl: Rezeptmenge darf im Rahmen von flex an die Packung angepasst werden.
  function choosePack(it, q) {
    const [lo, hi] = it.flex || [1, 1];
    let best = null;
    for (const [s, size, kind] of it.pk) {
      const n0 = Math.max(1, Math.floor(q / s + 1e-9));
      for (const n of [n0, n0 + 1]) {
        const f = n * s / q, inside = f >= lo - 1e-9 && f <= hi + 1e-9;
        const score = (inside ? 0 : 10) + Math.abs(Math.log(f)) + (f < 1 - 1e-9 ? 0.05 : 0) + n * 0.01;
        if (!best || score < best.score) best = { n, s, size, kind, f, score };
      }
    }
    best.use = Math.min(best.f, hi);                // Faktor für die Rezeptmengen
    best.rest = best.n * best.s - q * best.use;     // was trotzdem übrig bleibt
    if (best.rest < 0.1 * best.s) best.rest = 0;     // Krümel unter 10 % einer Packung nicht melden
    return best;
  }

  function needs(P) {
    const map = {};
    const add = (id, q, src) => {
      if (!q) return;
      const m = map[id] || (map[id] = { q: 0, src: [] });
      m.q += q;
      if (!m.src.includes(src)) m.src.push(src);
    };
    const spices = [];
    for (const k of DISH_ORDER) {
      const r = P.rounds[k]; if (!r) continue;
      const d = DISHES[k];
      d.ing.forEach(([id, q]) => add(id, q * r, d.short));
      d.sp.forEach(([name]) => { if (!spices.includes(name)) spices.push(name); });
    }
    if (P.days && state.fr) OATS.ing.forEach(([id, q]) => add(id, q * P.days, "Frühstück"));
    if (P.days && state.sn) SNACK.ing.forEach(([id, q]) => add(id, q * P.days, "Snacks"));
    const F = {}, buy = {};
    for (const id in map) {
      const it = ITEMS[id];
      if (it.pk) { buy[id] = choosePack(it, map[id].q); F[id] = buy[id].use; } else F[id] = 1;
    }
    return { map, spices, F, buy };
  }

  function shopQty(u, q) {
    if (u === "g" || u === "ml") { const step = q < 300 ? 10 : 50; return Math.ceil(q / step - 1e-9) * step; }
    return Math.ceil(q - 1e-9);
  }
  const nf = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 2 });
  function fmtShop(u, q) {
    if (u === "g") return q >= 1000 ? nf.format(q / 1000) + " kg" : q + " g";
    if (u === "ml") return q >= 1000 ? nf.format(q / 1000) + " l" : q + " ml";
    if (u === "Stk") return q + " Stück";
    if (u === "Dose") return q + (q === 1 ? " Dose" : " Dosen");
    if (u === "Zehe") return q + (q === 1 ? " Zehe" : " Zehen");
    return q + " " + u;
  }
  function frac(q) {
    let r = Math.round(q * 4) / 4;
    if (r === 0) r = 0.25;
    const w = Math.floor(r), f = r - w;
    const g = { 0: "", 0.25: "¼", 0.5: "½", 0.75: "¾" }[f];
    return (w ? String(w) : "") + g;
  }
  function fmtCook(u, q) {
    if (u === "g" && q >= 1000) return nf.format(Math.round(q / 50) * 50 / 1000) + " kg";
    if (u === "g" || u === "ml") return Math.max(5, Math.round(q / 5) * 5) + " " + u;
    const v = frac(q), one = Math.round(q * 4) / 4 <= 1;
    if (u === "Stk") return v;
    if (u === "Dose") return v + (one ? " Dose" : " Dosen");
    if (u === "Zehe") return v + (one ? " Zehe" : " Zehen");
    return v + " " + u;
  }
  function untilDay(days) {
    // Gekocht wird am Einkaufstag, die erste Box ist das Abendessen. 2 Boxen pro Tag reichen bis Mittag am Tag heute + Tage.
    return WD[(new Date().getDay() + days) % 7];
  }

  // ---------- Darstellung ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const boxWord = n => n === 1 ? "Box" : "Boxen";

  function renderSeg() {
    $("seg").innerHTML =
      '<button type="button" data-tab="' + SHOP + '" aria-pressed="' + (tab === SHOP) + '"><small>für ' + state.days + (state.days === 1 ? " Tag" : " Tage") + "</small><b>Einkaufen</b></button>" +
      '<button type="button" data-tab="' + BOOK + '" aria-pressed="' + (tab === BOOK) + '"><small>Rezepte</small><b>Kochen</b></button>';
  }

  function stepper(id, val, unit, lo, hi, labelLess, labelMore) {
    return '<div class="stepper">' +
      '<button type="button" class="step" id="' + id + 'minus" aria-label="' + labelLess + '"' + (val <= lo ? " disabled" : "") + ">−</button>" +
      '<div class="daysval" aria-live="polite"><b>' + val + "</b><span>" + unit + "</span></div>" +
      '<button type="button" class="step" id="' + id + 'plus" aria-label="' + labelMore + '"' + (val >= hi ? " disabled" : "") + ">+</button></div>";
  }

  function renderSetup() {
    const P = plan();
    const chips = DISH_ORDER.map(k => {
      const on = state.dishes.includes(k), r = P.rounds[k];
      return '<button type="button" class="chip" data-dish="' + k + '" aria-pressed="' + on + '">' + DISHES[k].short +
        (on && r ? "<em>" + r * BATCH + "×</em>" : "") + "</button>";
    }).join("");

    const lines = [];
    const parts = P.sel.filter(k => P.rounds[k]).map(k => DISHES[k].short + " " + P.rounds[k] * BATCH);
    if (P.cooked) lines.push("<span><b>" + P.cooked + " Boxen kochen</b>" + (parts.length ? " · " + parts.join(" · ") : "") + "</span>");
    else if (P.need === 0) lines.push("<span><b>Nichts kochen</b>, die Boxen aus dem Gefrierfach reichen.</span>");
    if (P.fromFreezer) lines.push("<span>" + P.fromFreezer + " " + boxWord(P.fromFreezer) + " aus dem Gefrierfach essen</span>");
    if (P.extra) lines.push("<span>" + P.extra + " " + boxWord(P.extra) + " übrig, die kommen ins Gefrierfach</span>");
    let kcal = 0, prot = 0;
    if (P.cooked) {
      let k1 = 0, p1 = 0;
      for (const k of P.sel) { const n = (P.rounds[k] || 0) * BATCH; k1 += n * DISHES[k].kcal; p1 += n * DISHES[k].prot; }
      kcal += 2 * k1 / P.cooked; prot += 2 * p1 / P.cooked;
    } else if (P.fromFreezer) { kcal += 2 * 585; prot += 2 * 39; }
    if (state.fr) { kcal += OATS.kcal; prot += OATS.prot; }
    if (state.sn) { kcal += SNACK.kcal; prot += SNACK.prot; }
    lines.push("<span>Pro Tag etwa <b>" + nf.format(Math.round(kcal / 10) * 10) + " kcal</b> und <b>" + Math.round(prot) + " g Protein</b></span>");
    if (P.missing) lines.push('<span class="note">Kein Gericht gewählt, für ' + P.missing + " Boxen fehlt das Essen.</span>");
    if (P.sel.length > P.minRounds && P.minRounds > 0) {
      lines.push('<span class="note">Für ' + P.days + (P.days === 1 ? " Tag" : " Tage") + (P.minRounds === 1 ? " reicht 1 Gericht" : " reichen " + P.minRounds + " Gerichte") +
        ". Tipp eins weg, wenn du nicht so viel einfrieren willst.</span>");
    }

    $("setup").innerHTML =
      '<div class="daysrow"><div class="cookday">Einkauf für</div>' + stepper("d", state.days, state.days === 1 ? "Tag" : "Tage", 1, 10, "Einen Tag weniger", "Einen Tag mehr") + "</div>" +
      '<div class="until">Wenn du heute kochst, reicht es mit 2 Boxen am Tag bis <b>' + untilDay(state.days) + " Mittag</b>.</div>" +
      '<div class="daysrow"><div class="cookday">Im Gefrierfach</div>' + stepper("f", state.frozen, boxWord(state.frozen), 0, 30, "Eine Box weniger im Gefrierfach", "Eine Box mehr im Gefrierfach") + "</div>" +
      '<div><div class="label" style="margin-bottom:8px">Gerichte</div><div class="chips">' + chips + "</div></div>" +
      '<div class="togs">' +
        '<label class="tog"><input type="checkbox" id="fr"' + (state.fr ? " checked" : "") + ">Frühstück</label>" +
        '<label class="tog"><input type="checkbox" id="sn"' + (state.sn ? " checked" : "") + ">Snacks</label>" +
      "</div>" +
      '<div class="summary">' + lines.join("") + "</div>";
  }

  function currentRows() {
    const P = plan(), N = needs(P);
    const rows = [];
    for (const id of ITEM_ORDER) {
      const m = N.map[id]; if (!m) continue;
      const it = ITEMS[id];
      let qty, hint;
      if (it.pk) {
        const b = N.buy[id];
        qty = b.n + " × " + b.size;
        hint = b.kind;
        if (b.rest > 1e-6) {
          const r = it.u === "g" ? Math.round(b.rest / 10) * 10 : Math.round(b.rest * 4) / 4;
          if (r > 0) hint += it.frier ? ", Rest (" + fmtShop(it.u, r) + ") einfrieren" : ", bleibt etwa " + fmtShop(it.u, r) + " übrig";
        }
      } else if (it.vorrat) {
        qty = fmtShop(it.u, shopQty(it.u, m.q));
        hint = it.vorrat;
      } else {
        qty = fmtShop(it.u, shopQty(it.u, m.q));
        hint = it.lose || "";
      }
      rows.push({ key: "e-" + id, area: it.a, name: it.n, qty, hint, src: m.src.join(", ") });
    }
    if (N.spices.length) rows.push({ key: "e-gewuerze", area: 2, name: "Gewürze", qty: "", hint: "was nicht daheim ist", src: N.spices.join(", ") });
    if (P.rounds.chili) rows.push({ key: "e-schoko", area: 2, name: "Dunkle Schokolade", qty: "optional", hint: "", src: "Chili" });
    return rows;
  }

  function kitRows() {
    const P = plan();
    const used = new Set(Object.keys(P.rounds).filter(k => P.rounds[k]));
    const x = { has: k => used.has(k), maxBoxes: P.cooked, maxOats: state.fr ? Math.min(P.days, 4) : 0, snacks: state.sn, any: P.cooked > 0 || state.fr || state.sn };
    return KIT.filter(k => k.need(x)).map(k => ({ key: "k-" + k.id, name: k.n, qty: k.q ? k.q(x) : "", hint: "", src: k.h }));
  }

  function rowHtml(r) {
    const on = !!state.checked[r.key];
    return '<label class="row' + (on ? " is-done" : "") + '" data-key="' + r.key + '">' +
      '<input type="checkbox" id="c-' + r.key + '"' + (on ? " checked" : "") + ">" +
      '<span class="box">' + CHECK_SVG + "</span>" +
      '<span class="what"><b>' + esc(r.name) + "</b><small>" + esc(r.src) + "</small></span>" +
      '<span class="qty">' + esc(r.qty) + (r.hint ? "<small>" + esc(r.hint) + "</small>" : "") + "</span></label>";
  }

  // Die Küchenliste steht unten im Einkauf, bis alles abgehakt ist.
  let kitShown = false, extraShown = false;
  function extraRows() { return EXTRA.map(x => ({ key: "x-" + x.id, name: x.n, qty: x.q || "", hint: "", src: x.h || "" })); }
  function renderList() {
    const rows = currentRows();
    const kit = kitRows();
    const extra = extraRows();
    kitShown = kit.length > 0 && kit.some(r => !state.checked[r.key]);
    extraShown = extra.some(r => !state.checked[r.key]);
    let html = "", kitHtml = "";
    const extraHtml = extraShown ? '<div class="area"><div class="label">Sonstiges</div>' + extra.map(rowHtml).join("") + "</div>" : "";
    if (kitShown) {
      kitHtml = '<div class="area kit"><div class="label">Küche, einmalig</div>' +
        '<p class="kitnote">Schon da: ' + HAVE + ".</p>" + kit.map(rowHtml).join("") +
        '<p class="kitnote">Die Gerichte nacheinander im großen Topf kochen, Reis im kleinen Topf. Küchenzeug hat am ehesten ein Interspar, sonst Haushaltsgeschäft oder Ikea.</p></div>';
    }
    if (!rows.length) {
      if (!extraShown) html += '<p class="empty">Nichts zu kaufen. Stell oben Tage und Gerichte ein.</p>';
    } else {
      AREAS.forEach((area, ai) => {
        const rs = rows.filter(r => r.area === ai).sort((x, y) => shopPos(x) - shopPos(y));
        if (!rs.length) return;
        html += '<div class="area"><div class="label">' + area + "</div>" + rs.map(rowHtml).join("") + "</div>";
      });
    }
    $("list").innerHTML = html + extraHtml + kitHtml;
    renderProgress();
  }

  function renderProgress() {
    const rows = currentRows().concat(extraShown ? extraRows() : [], kitShown ? kitRows() : []);
    const done = rows.filter(r => state.checked[r.key]).length;
    $("prog").textContent = rows.length ? done + " von " + rows.length + " im Wagen" : "";
    $("barFill").style.width = rows.length ? (100 * done / rows.length) + "%" : "0";
    const P = plan(), f = $("fertig");
    if (!f.classList.contains("armed")) f.textContent = "Fertig gekocht: Haken löschen, Gefrierfach auf " + P.frozenAfter + " " + boxWord(P.frozenAfter);
    zusammenfassung(rows, done);
  }

  // Kurzfassung für die Startseite von Tagwerk
  function zusammenfassung(rows, done) {
    try {
      lsSet("mp-einkauf-zusammenfassung", JSON.stringify({ stand: Date.now(), v: 2, tage: state.days, bis: untilDay(state.days), offen: rows.length - done, gesamt: rows.length, gefrierfach: state.frozen }));
    } catch (e) { }
  }
  $("uebertragen").onclick = async () => {
    const t = "Meal Prep Stand " + new Date().toISOString().slice(0, 10) + "\n" + JSON.stringify(state);
    try { await navigator.clipboard.writeText(t); $("uebertragen").textContent = "Kopiert. In Tagwerk unter Stand übernehmen einfügen."; }
    catch (e) { const a = $("uebertragenText"); a.value = t; a.hidden = false; a.select(); $("uebertragen").textContent = "Text unten markieren und kopieren"; }
  };

  // Zutatenzeile im Rezept. whole = ganze Packungen, wenn das Gericht die Packung allein aufbraucht.
  function ingLine(id, q, note, N) {
    const it = ITEMS[id];
    let s = fmtCook(it.u, q) + " " + (it.c || it.n);
    if (it.stk && it.u === "g") s += " (etwa " + frac(q / it.stk[0]) + " " + it.stk[1] + ")";
    if (N && it.pk && it.u !== "Dose" && N.map[id] && N.map[id].src.length === 1) {
      const b = N.buy[id], k = q / b.s;
      if (Math.abs(k - Math.round(k)) < 1e-6 && Math.round(k) >= 1) s += Math.round(k) === 1 ? ", die ganze Packung" : ", alle " + Math.round(k) + " Packungen";
    }
    return s + (note ? ", " + note : "");
  }

  function fill(s, f) { return s.replace(/\{ml:(\d+)\}/g, (m, v) => Math.max(10, Math.round(v * f / 10) * 10) + " ml"); }
  function nutri(d) { return "Je Portion etwa " + d.kcal + " kcal, " + d.prot + " g Protein, " + d.kh + " g Kohlenhydrate, " + d.fett + " g Fett, " + d.bal + " g Ballaststoffe"; }
  function steps(list, f) { return list.length ? "<h3>Zubereitung</h3><ol>" + list.map(s => "<li>" + esc(fill(s, f)) + "</li>").join("") + "</ol>" : ""; }

  function renderBook() {
    const box = $("recipes");
    const shown = box.dataset.book === "1";
    const open = new Set([...box.querySelectorAll("details[open]")].map(x => x.dataset.k));
    const isOpen = (k, dflt) => shown ? open.has(k) : dflt;
    const P = plan(), N = needs(P);
    const planText = P.sel.filter(k => P.rounds[k]).map(k => DISHES[k].short + " " + P.rounds[k] * BATCH);
    let html = '<details class="rec" data-k="ablauf"' + (isOpen("ablauf", true) ? " open" : "") + '><summary><b>So läuft der Kochtag</b><span>Ablauf</span></summary><div class="recbody">' +
      (planText.length ? '<div class="meta">Geplant für ' + P.days + (P.days === 1 ? " Tag" : " Tage") + ": " + esc(planText.join(" · ")) + " Portionen" +
        (P.extra ? ", davon " + P.extra + " " + boxWord(P.extra) + " zum Einfrieren" : "") + "</div>" : "") +
      "<ol>" + ABLAUF.map(s => "<li>" + esc(s) + "</li>").join("") + "</ol></div></details>";
    for (const k of DISH_ORDER) {
      const d = DISHES[k], r = P.rounds[k] || 0, f = r || 1, n = f * BATCH;
      const ings = d.ing.map(([id, q, note]) => "<li>" + esc(ingLine(id, q * f * (r ? N.F[id] || 1 : 1), note, r ? N : null)) + "</li>");
      const sp = d.sp.map(([name, q, u]) => q ? frac(q * f) + " " + u + " " + name : name);
      ings.push("<li>" + esc(sp.join(", ")) + (d.sp.some(s => !s[1]) ? " nach Geschmack" : "") + "</li>");
      if (d.extra) ings.push("<li>" + esc(d.extra) + "</li>");
      html += '<details class="rec" data-k="' + k + '"' + (isOpen(k, r > 0) ? " open" : "") + '><summary>' + thumb(k) + "<b>" + esc(d.name) + "</b><span>" +
        (r ? n + " Portionen" : "nicht geplant") + "</span></summary>" +
        '<div class="recbody">' + hero(k, d.name) + '<div class="meta">' + esc(d.sub) + " · " + d.min + " Minuten · " + n + " Portionen" + (r ? "" : ", eine Kochrunde") + "</div>" +
        "<h3>Zutaten</h3><ul>" + ings.join("") + "</ul>" + steps(d.steps, f) +
        '<div class="keep">' + esc(d.lager) + '</div><div class="meta">' + nutri(d) + "</div></div></details>";
    }
    const daily = (d, on) => d.ing.map(([id, q]) => "<li>" + esc(ingLine(id, q * (on && P.days ? N.F[id] || 1 : 1))) + "</li>").join("");
    [["oats", OATS, "1 Glas pro Tag", state.fr], ["snack", SNACK, "pro Tag", state.sn]].forEach(([k, d, unit, on]) => {
      html += '<details class="rec" data-k="' + k + '"' + (isOpen(k, false) ? " open" : "") + '><summary>' + thumb(k) + "<b>" + esc(d.name) + "</b><span>" + (on ? unit : "nicht geplant") + "</span></summary>" +
        '<div class="recbody">' + hero(k, d.name) + '<div class="meta">' + esc(d.sub) + (on ? " · Mengen so, dass die Packungen in " + P.days + (P.days === 1 ? " Tag" : " Tagen") + " leer werden" : "") + "</div>" +
        "<h3>Zutaten " + (k === "oats" ? "pro Glas" : "pro Tag") + "</h3><ul>" + daily(d, on) + "</ul>" + steps(d.steps, 1) +
        '<div class="keep">' + esc(d.lager) + '</div><div class="meta">' + nutri(d) + "</div></div></details>";
    });
    box.innerHTML = html;
    box.dataset.book = "1";
  }

  function renderAll() {
    renderSeg();
    const book = tab === BOOK;
    $("setup").hidden = book; $("listCard").hidden = book; $("recCard").hidden = !book;
    if (book) renderBook(); else { $("recipes").dataset.book = ""; renderSetup(); renderList(); }
  }

  // ---------- Speichern und Sync ----------
  let ref = null, dirty = false, writing = false, again = false, flushTimer = null;
  function setSync(s, text) { $("sync").dataset.s = s; $("syncText").textContent = text; }

  function changed() {
    lsSet(LS_STATE, JSON.stringify(state));
    if (!ref) return;
    dirty = true;
    setSync("busy", "Speichert");
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 350);
  }

  async function flush() {
    if (!ref) return;
    if (writing) { again = true; return; }
    writing = true; dirty = false;
    try {
      await writeOnce(clone(state));
      if (!dirty) setSync("ok", "Synchron");
    } catch (e) {
      setSync("local", e && e.code === "invalid_argument" ? "Nur auf diesem Gerät" : "Offline, später erneut");
      if (e && e.code !== "invalid_argument") dirty = true;
    } finally {
      writing = false;
      if (again || dirty) { again = false; clearTimeout(flushTimer); flushTimer = setTimeout(flush, dirty ? 4000 : 50); }
    }
  }
  async function writeOnce(data) {
    try { await ref.set(data); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); await ref.set(data); }
      else throw e;
    }
  }

  async function connect() {
    const use = window.claude && window.claude.use;
    if (!use) { setSync("local", "Nur auf diesem Gerät"); return; }
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { setSync("local", "Nur auf diesem Gerät"); return; }
    ref = db.doc("mealprep/state");
    let first = true;
    const timer = setTimeout(() => { if (first) setSync("local", "Offline, Stand von diesem Gerät"); }, 10000);
    ref.onSnapshot(snap => {
      if (snap.metadata.fromCache && !snap.exists) return;
      if (!snap.metadata.fromCache) { first = false; clearTimeout(timer); }
      if (!snap.exists) { dirty = true; flush(); return; }
      if (dirty || writing || snap.metadata.hasPendingWrites) return;
      const next = normalize(snap.data());
      if (JSON.stringify(next) !== JSON.stringify(state)) {
        state = next;
        lsSet(LS_STATE, JSON.stringify(state));
        renderAll();
      }
      if (!snap.metadata.fromCache) setSync("ok", "Synchron");
    }, err => {
      clearTimeout(timer);
      ref = null;
      setSync("local", "Nur auf diesem Gerät");
    });
  }

  // ---------- Bedienung ----------
  document.addEventListener("click", ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.tab != null) {
      tab = Number(t.dataset.tab); lsSet(LS_TAB, tab === BOOK ? "book" : "shop"); renderAll();
      return;
    }
    if (tab === BOOK) return;
    if (t.id === "dminus" && state.days > 1) { state.days--; changed(); renderAll(); return; }
    if (t.id === "dplus" && state.days < 10) { state.days++; changed(); renderAll(); return; }
    if (t.id === "fminus" && state.frozen > 0) { state.frozen--; changed(); renderAll(); return; }
    if (t.id === "fplus" && state.frozen < 30) { state.frozen++; changed(); renderAll(); return; }
    if (t.dataset.dish) {
      const k = t.dataset.dish;
      state.dishes = state.dishes.includes(k) ? state.dishes.filter(x => x !== k) : DISH_ORDER.filter(x => x === k || state.dishes.includes(x));
      changed(); renderAll(); return;
    }
    if (t.id === "fertig") {
      if (!t.classList.contains("armed")) {
        t.classList.add("armed"); t.textContent = "Sicher? Nochmal tippen, dann ist die Liste leer";
        setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); renderProgress(); } }, 4000);
        return;
      }
      state.frozen = Math.min(30, plan().frozenAfter);
      for (const k of Object.keys(state.checked)) if (k.startsWith("e-")) delete state.checked[k];
      t.classList.remove("armed");
      changed(); renderAll();
    }
  });

  document.addEventListener("change", ev => {
    const el = ev.target;
    if (el.id === "fr" || el.id === "sn") { state[el.id] = el.checked; changed(); renderAll(); return; }
    const row = el.closest(".row");
    if (row) {
      const key = row.dataset.key;
      if (el.checked) state.checked[key] = true; else delete state.checked[key];
      row.classList.toggle("is-done", el.checked);
      changed(); renderProgress();
    }
  });

  renderAll();
  setSync("local", "Nur auf diesem Gerät");
  connect();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
