<style>
/* Layout: eine Spalte pro Kochtag. Regler oben, Einkaufsliste nach Lidl-Bereichen, Rezepte mit umgerechneten Mengen unten. */
:root {
  --bg: #f1f4ef;
  --surface: #ffffff;
  --ink: #17211b;
  --muted: #5b6a61;
  --line: #d9e1db;
  --accent: #2b6a4c;
  --accent-ink: #ffffff;
  --soft: #e1ede5;
  --done: #9aa8a0;
  --warn: #93590a;
  --font-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411; --surface: #18201b; --ink: #e6ede8; --muted: #97a69d; --line: #29332d;
    --accent: #72c497; --accent-ink: #0b1810; --soft: #1d3326; --done: #5e6c64; --warn: #e0a64e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411; --surface: #18201b; --ink: #e6ede8; --muted: #97a69d; --line: #29332d;
  --accent: #72c497; --accent-ink: #0b1810; --soft: #1d3326; --done: #5e6c64; --warn: #e0a64e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 48px;
  display: flex; flex-direction: column; gap: 14px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; margin: 0; }
.sync { font-size: 0.78rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); display: inline-block; }
.sync[data-s="ok"] i { background: var(--accent); }
.sync[data-s="busy"] i { background: var(--warn); }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--line); padding: 4px; border-radius: 16px; }
.seg button {
  font: inherit; border: 0; border-radius: 12px; padding: 9px 8px; background: transparent; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer;
}
.seg button small { font-size: 0.74rem; color: var(--muted); }
.seg button b { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.seg button:focus-visible, .chip:focus-visible, .step:focus-visible, .row:focus-within, .linkbtn:focus-visible, select:focus-visible, .tog:focus-within {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.daysrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 10px; }
.step {
  width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 1.5rem; line-height: 1; cursor: pointer; display: grid; place-items: center;
}
.step:disabled { opacity: .35; cursor: default; }
.daysval { min-width: 82px; text-align: center; }
.daysval b { font-family: var(--font-display); font-weight: 800; font-size: 2rem; font-variant-numeric: tabular-nums; display: block; line-height: 1; }
.daysval span { font-size: 0.8rem; color: var(--muted); }
.cookday { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
select {
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.until { font-size: 0.92rem; color: var(--muted); margin-top: -4px; }
.until b { color: var(--ink); font-weight: 600; }
.label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.94rem; border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip em { font-style: normal; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] em { color: var(--accent-ink); opacity: .8; }
.togs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tog { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 0.94rem; }
.tog input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; flex: none; }
.summary { font-size: 0.88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
.summary b { color: var(--ink); font-weight: 600; }
.note { color: var(--warn); font-size: 0.86rem; }

.listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.18rem; margin: 0; letter-spacing: -0.01em; }
.prog { font-size: 0.86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.area { display: flex; flex-direction: column; }
.area .label { padding: 12px 0 4px; }
.row {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px;
  padding: 11px 2px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px;
}
.area .row:last-child { border-bottom: 0; }
.row input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.box { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { width: 14px; height: 14px; opacity: 0; }
.row input:checked + .box { background: var(--accent); border-color: var(--accent); }
.row input:checked + .box svg { opacity: 1; }
.what { min-width: 0; }
.what b { font-weight: 600; display: block; }
.what small { color: var(--muted); font-size: 0.8rem; display: block; overflow-wrap: anywhere; }
.qty { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.qty small { display: block; font-weight: 400; color: var(--muted); font-size: 0.78rem; }
.row.is-done .what b, .row.is-done .qty { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row.is-done .what small, .row.is-done .qty small { color: var(--done); }
.linkbtn { font: inherit; font-size: 0.86rem; background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; font-weight: 600; }
.linkbtn.armed { color: var(--warn); }
.empty { color: var(--muted); font-size: 0.94rem; padding: 6px 0; }
.kit { background: var(--soft); border-radius: 12px; padding: 0 12px 4px; margin-top: 4px; }
.kit .row { border-bottom-color: var(--line); }
.kitnote { margin: 0; padding: 4px 0 8px; font-size: 0.84rem; color: var(--muted); }
.kit .row:last-of-type { border-bottom: 0; }

details.rec { border-top: 1px solid var(--line); }
details.rec:first-of-type { border-top: 0; }
details.rec summary { list-style: none; cursor: pointer; padding: 12px 0; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.rec summary::-webkit-details-marker { display: none; }
details.rec summary b { font-weight: 600; margin-right: auto; }
details.rec summary .thumb { width: 46px; height: 46px; border-radius: 12px; object-fit: cover; flex: none; }
.recbody .hero { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; border-radius: 14px; }
details.rec summary span { color: var(--muted); font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
details.rec summary::after { content: "+"; color: var(--accent); font-weight: 700; margin-left: 4px; }
details.rec[open] summary::after { content: "−"; }
.recbody { padding: 0 0 14px; display: flex; flex-direction: column; gap: 10px; font-size: 0.94rem; }
.recbody ul, .recbody ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.recbody .meta { color: var(--muted); font-size: 0.84rem; }
.recbody .portions { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.recbody .portions b { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.recbody h3 { margin: 4px 0 0; font-size: 0.8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.recbody .keep { background: var(--soft); border-radius: 10px; padding: 8px 10px; font-size: 0.88rem; }
.foot { font-size: 0.8rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .bar i, .box { transition: none; } }
</style>

    if (u === "Dose") return q + (q === 1 ? " Dose" : " Dosen");
    if (u === "Zehe") return q + (q === 1 ? " Zehe" : " Zehen");
    if (u === "Scheibe") return q + (q === 1 ? " Scheibe" : " Scheiben");
    return q + " " + u;
  }
  function frac(q) {
    let r = Math.round(q * 4) / 4;
    if (r === 0) r = 0.25;
    const w = Math.floor(r), f = r - w;
    const g = { 0: "", 0.25: "¼", 0.5: "½", 0.75: "¾" }[f];
    return (w ? String(w) : "") + g;
  }
  function fmtCook(u, q) {
    if (u === "g" || u === "ml") return Math.max(5, Math.round(q / 5) * 5) + " " + u;
    const v = frac(q), one = Math.round(q * 4) / 4 <= 1;
    if (u === "Stk") return v;
    if (u === "Dose") return v + (one ? " Dose" : " Dosen");
    if (u === "Zehe") return v + (one ? " Zehe" : " Zehen");
    if (u === "Scheibe") return v + (one ? " Scheibe" : " Scheiben");
    return v + " " + u;
  }
  function daysUntil(c) {
    // gekocht wird am Kochtag mittags/nachmittags, die erste Box ist das Abendessen.
    // 2 Boxen pro Tag reichen dann bis zum Mittagessen am Tag Kochtag + Tage.
    return WD[(c.wd + c.days) % 7];
  }

  // ---------- Darstellung ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderSeg() {
    $("seg").innerHTML = state.cook.map((c, i) =>
      '<button type="button" data-tab="' + i + '" aria-pressed="' + (i === tab) + '">' +
      "<small>Einkauf " + (i + 1) + "</small><b>" + WD[c.wd] + "</b></button>").join("") +
      '<button type="button" data-tab="' + BOOK + '" aria-pressed="' + (tab === BOOK) + '"><small>Kochen</small><b>Rezepte</b></button>';
  }

  function renderSetup() {
    const c = state.cook[tab];
    const p = portionsFor(c);
    const boxes = Object.values(p).reduce((a, b) => a + b, 0);
    const opts = WD.map((n, i) => '<option value="' + i + '"' + (i === c.wd ? " selected" : "") + ">" + n + "</option>").join("");
    const chips = DISH_ORDER.map(k => {
      const on = c.dishes.includes(k);
      return '<button type="button" class="chip" data-dish="' + k + '" aria-pressed="' + on + '">' + DISHES[k].short +
        (on && p[k] ? "<em>" + p[k] + "×</em>" : "") + "</button>";
    }).join("");

    let sumHtml;
    if (!c.days) {
      sumHtml = "<span>Kein Kochen an diesem Tag. Mit + Tage dazugeben.</span>";
    } else {
      const parts = DISH_ORDER.filter(k => p[k]).map(k => DISHES[k].short + " " + p[k]);
      let kcal = 0, prot = 0;
      if (boxes) {
        let k1 = 0, p1 = 0;
        for (const k of Object.keys(p)) { k1 += p[k] * DISHES[k].kcal; p1 += p[k] * DISHES[k].prot; }
        kcal += 2 * k1 / boxes; prot += 2 * p1 / boxes;
      }
      if (c.fr) { kcal += OATS.kcal; prot += OATS.prot; }
      if (c.sn) { kcal += SNACK.kcal; prot += SNACK.prot; }
      sumHtml = "<span><b>" + boxes + " Boxen</b>" + (parts.length ? " · " + parts.join(" · ") : "") + "</span>" +
        "<span>Pro Tag etwa <b>" + nf.format(Math.round(kcal / 10) * 10) + " kcal</b> und <b>" + Math.round(prot) + " g Protein</b></span>";
      if (!c.dishes.length) sumHtml += '<span class="note">Kein Gericht gewählt, es gibt nur Frühstück und Snacks.</span>';
      if (p.teri && c.days > 4) sumHtml += '<span class="note">Hähnchen-Teriyaki hält 3 bis 4 Tage, also zuerst essen.</span>';
    }

    $("setup").innerHTML =
      '<div class="daysrow">' +
        '<label class="cookday" for="wd">Kochtag<select id="wd">' + opts + "</select></label>" +
        '<div class="stepper">' +
          '<button type="button" class="step" id="minus" aria-label="Einen Tag weniger"' + (c.days <= 0 ? " disabled" : "") + ">−</button>" +
          '<div class="daysval" aria-live="polite"><b>' + c.days + "</b><span>" + (c.days === 1 ? "Tag" : "Tage") + "</span></div>" +
          '<button type="button" class="step" id="plus" aria-label="Einen Tag mehr"' + (c.days >= 10 ? " disabled" : "") + ">+</button>" +
        "</div>" +
      "</div>" +
      (c.days ? '<div class="until">Reicht mit 2 Boxen am Tag bis <b>' + daysUntil(c) + " Mittag</b></div>" : "") +
      '<div><div class="label" style="margin-bottom:8px">Gerichte</div><div class="chips">' + chips + "</div></div>" +
      '<div class="togs">' +
        '<label class="tog"><input type="checkbox" id="fr"' + (c.fr ? " checked" : "") + ">Frühstück</label>" +
        '<label class="tog"><input type="checkbox" id="sn"' + (c.sn ? " checked" : "") + ">Snacks</label>" +
      "</div>" +
      '<div class="summary">' + sumHtml + "</div>";
  }

  function currentRows() {
    const c = state.cook[tab];
    const { map, spices } = needs(c);
    const rows = [];
    for (const id of ITEM_ORDER) {
      const m = map[id]; if (!m) continue;
      const it = ITEMS[id];
      const q = shopQty(it.u, m.q);
      rows.push({ key: tab + "-" + id, area: it.a, name: it.n, qty: fmtShop(it.u, q), hint: it.h ? it.h(q) : "", src: m.src.join(", ") });
    }
    if (spices.length) {
      rows.push({ key: tab + "-gewuerze", area: 5, name: "Gewürze", qty: "", hint: "", src: spices.join(", ") });
    }
    if (c.dishes.includes("chili") && portionsFor(c).chili) {
      rows.push({ key: tab + "-schoko", area: 5, name: "Dunkle Schokolade", qty: "optional", hint: "", src: "Chili" });
    }
    return rows;
  }

  function kitRows() {
    const used = new Set();
    let maxBoxes = 0, maxOats = 0, snacks = false, any = false;
    state.cook.forEach(c => {
      if (!c.days) return;
      const p = portionsFor(c);
      Object.keys(p).forEach(k => used.add(k));
      const b = Object.values(p).reduce((a, x) => a + x, 0);
      maxBoxes = Math.max(maxBoxes, b);
      if (c.fr) maxOats = Math.max(maxOats, Math.min(c.days, 4));
      if (c.sn) snacks = true;
      if (b || c.fr || c.sn) any = true;
    });
    const x = { has: k => used.has(k), maxBoxes, maxOats, snacks, any };
    return KIT.filter(k => k.need(x)).map(k => ({ key: "k-" + k.id, name: k.n, qty: k.q ? k.q(x) : "", hint: "", src: k.h }));
  }

  function rowHtml(r) {
    const on = !!state.checked[r.key];
    return '<label class="row' + (on ? " is-done" : "") + '" data-key="' + r.key + '">' +
      '<input type="checkbox" id="c-' + r.key + '"' + (on ? " checked" : "") + ">" +
      '<span class="box">' + CHECK_SVG + "</span>" +
      '<span class="what"><b>' + esc(r.name) + "</b><small>" + esc(r.src) + "</small></span>" +
      '<span class="qty">' + esc(r.qty) + (r.hint ? "<small>" + esc(r.hint) + "</small>" : "") + "</span></label>";
  }

  // Die Küchenliste steht im ersten Einkauf, bis alles abgehakt ist.
  let kitShown = false;
  function renderList() {
    const rows = currentRows();
    const kit = tab === 0 ? kitRows() : [];
    kitShown = kit.length > 0 && kit.some(r => !state.checked[r.key]);
    let html = "";
    if (kitShown) {
      const tips = [];
      if (state.cook.some(c => { const p = portionsFor(c); return p.chili && p.curry; })) tips.push("Chili und Curry nacheinander im großen Topf kochen");
      if (kit.some(r => r.key === "k-topfklein")) tips.push("Reis im kleinen Topf");
      if (state.cook.some(c => { const p = portionsFor(c); return p.teri && p.bolo; })) tips.push("Am zweiten Kochtag zuerst Brokkoli und Spaghetti im großen Topf, dann Teriyaki und Bolognese-Sauce nacheinander in der großen Pfanne");
      else if (state.cook.some(c => portionsFor(c).bolo)) tips.push("Bolognese-Sauce in der großen Pfanne, Spaghetti im großen Topf");
      html += '<div class="area kit"><div class="label">Küche, einmalig</div>' +
        '<p class="kitnote">Schon da: ' + HAVE + ".</p>" +
        kit.map(rowHtml).join("") +
        '<p class="kitnote">' + (tips.length ? tips.join(", ") + ". " : "") +
        "Küchenzeug hat der Lidl oft nur in Aktionswochen. Sonst Haushaltsgeschäft oder Ikea.</p></div>";
    }
    if (!rows.length) {
      html += '<p class="empty">Nichts zu kaufen. Stell oben Tage und Gerichte ein.</p>';
    } else {
      AREAS.forEach((area, ai) => {
        const rs = rows.filter(r => r.area === ai);
        if (!rs.length) return;
        html += '<div class="area"><div class="label">' + area + "</div>" + rs.map(rowHtml).join("") + "</div>";
      });
    }
    $("list").innerHTML = html;
    renderProgress();
  }

  function renderProgress() {
    const rows = currentRows().concat(kitShown ? kitRows() : []);
    const done = rows.filter(r => state.checked[r.key]).length;
    $("prog").textContent = rows.length ? done + " von " + rows.length + " im Wagen" : "";
    $("barFill").style.width = rows.length ? (100 * done / rows.length) + "%" : "0";
    $("reset").hidden = done === 0;
  }

  function ingLine(id, q, note) {
    const it = ITEMS[id];
    const name = it.c || it.n;
    return fmtCook(it.u, q) + " " + name + (note ? ", " + note : "");
  }

  function fill(s, f) { return s.replace(/\{ml:(\d+)\}/g, (m, v) => Math.max(10, Math.round(v * f / 10) * 10) + " ml"); }
  function nutri(d) { return "Je Portion etwa " + d.kcal + " kcal, " + d.prot + " g Protein, " + d.kh + " g Kohlenhydrate, " + d.fett + " g Fett, " + d.bal + " g Ballaststoffe"; }
  function planned(k) { return state.cook.map(c => [c, portionsFor(c)[k]]).filter(x => x[1]).map(x => WD[x[0].wd] + " " + x[1]); }
  function defaultPortions(k) { for (const c of state.cook) { const n = portionsFor(c)[k]; if (n) return n; } return DISHES[k].base; }
  function steps(list, f) { return list.length ? "<h3>Zubereitung</h3><ol>" + list.map(s => "<li>" + esc(fill(s, f)) + "</li>").join("") + "</ol>" : ""; }

  function renderBook() {
    const box = $("recipes");
    const shown = box.dataset.book === "1";
    const open = new Set([...box.querySelectorAll("details[open]")].map(x => x.dataset.k));
    const isOpen = (k, dflt) => shown ? open.has(k) : dflt;
    const plan = state.cook.map(c => { const p = portionsFor(c); const ks = DISH_ORDER.filter(k => p[k]); return ks.length ? WD[c.wd] + ": " + ks.map(k => DISHES[k].short + " " + p[k]).join(", ") : ""; }).filter(Boolean);
    let html = '<details class="rec" data-k="ablauf"' + (isOpen("ablauf", true) ? " open" : "") + '><summary><b>So läuft der Kochtag</b><span>Ablauf</span></summary><div class="recbody">' +
      (plan.length ? '<div class="meta">Geplant: ' + esc(plan.join(" · ")) + " Portionen</div>" : "") +
      "<ol>" + ABLAUF.map(s => "<li>" + esc(s) + "</li>").join("") + "</ol></div></details>";
    for (const k of DISH_ORDER) {
      const d = DISHES[k], pl = planned(k), n = rp[k] || defaultPortions(k), f = n / d.base;
      const ings = d.ing.map(([id, q, note]) => "<li>" + esc(ingLine(id, q * f, note)) + "</li>");
      const sp = d.sp.map(([name, q, u]) => q ? frac(q * f) + " " + u + " " + name : name);
      ings.push("<li>" + esc(sp.join(", ")) + (d.sp.some(s => !s[1]) ? " nach Geschmack" : "") + "</li>");
      if (d.extra) ings.push("<li>" + esc(d.extra) + "</li>");
      html += '<details class="rec" data-k="' + k + '"' + (isOpen(k, pl.length > 0) ? " open" : "") + '><summary>' + thumb(k) + '<b>' + esc(d.name) + "</b><span>" + esc(pl.length ? pl.join(", ") : "nicht geplant") + "</span></summary>" +
        '<div class="recbody">' + hero(k, d.name) + '<div class="meta">' + esc(d.sub) + " · " + d.min + " Minuten</div>" +
        '<div class="portions">Portionen <button type="button" class="step" data-rp="' + k + '" data-d="-1" aria-label="Eine Portion weniger"' + (n <= 1 ? " disabled" : "") + '>−</button><b>' + n + '</b><button type="button" class="step" data-rp="' + k + '" data-d="1" aria-label="Eine Portion mehr"' + (n >= 24 ? " disabled" : "") + ">+</button></div>" +
        "<h3>Zutaten</h3><ul>" + ings.join("") + "</ul>" + steps(d.steps, f) +
        '<div class="keep">' + esc(d.lager) + '</div><div class="meta">' + nutri(d) + "</div></div></details>";
    }
    [["oats", OATS, "1 Glas"], ["snack", SNACK, "pro Tag"]].forEach(([k, d, unit]) => {
      html += '<details class="rec" data-k="' + k + '"' + (isOpen(k, false) ? " open" : "") + '><summary>' + thumb(k) + '<b>' + esc(d.name) + "</b><span>" + unit + "</span></summary>" +
        '<div class="recbody">' + hero(k, d.name) + '<div class="meta">' + esc(d.sub) + "</div>" +
        "<h3>Zutaten</h3><ul>" + d.ing.map(([id, q]) => "<li>" + esc(ingLine(id, q)) + "</li>").join("") + "</ul>" + steps(d.steps, 1) +
        '<div class="keep">' + esc(d.lager) + '</div><div class="meta">' + nutri(d) + "</div></div></details>";
    });
    box.innerHTML = html;
    box.dataset.book = "1";
  }

  function renderRecipes() {
    if (tab === BOOK) { renderBook(); return; }
    $("recipes").dataset.book = "";
    const c = state.cook[tab];
    const p = portionsFor(c);
    let html = "";
    for (const k of DISH_ORDER) {
      const n = p[k]; if (!n) continue;
      const d = DISHES[k], f = n / d.base;
      const ings = d.ing.map(([id, q, note]) => "<li>" + esc(ingLine(id, q * f, note)) + "</li>");
      const sp = d.sp.map(([name, q, u]) => q ? frac(q * f) + " " + u + " " + name : name);
      ings.push("<li>" + esc(sp.join(", ")) + (d.sp.some(s => !s[1]) ? " nach Geschmack" : "") + "</li>");
      if (d.extra) ings.push("<li>" + esc(d.extra) + "</li>");
      html += '<details class="rec"><summary>' + thumb(k) + '<b>' + d.name + "</b><span>" + n + (n === 1 ? " Portion" : " Portionen") + "</span></summary>" +
        '<div class="recbody">' + hero(k, d.name) + '<div class="meta">' + d.sub + " · " + d.min + " Minuten · " + d.keep + " · je Portion etwa " + d.kcal + " kcal, " + d.prot + " g Protein</div>" +
        "<ul>" + ings.join("") + "</ul><ol>" + d.steps.map(s => "<li>" + esc(fill(s, f)) + "</li>").join("") + "</ol></div></details>";
    }
    if (c.days && c.fr) {
      html += '<details class="rec"><summary>' + thumb("oats") + '<b>' + OATS.name + "</b><span>1 Glas pro Tag</span></summary>" +
        '<div class="recbody">' + hero("oats", OATS.name) + '<div class="meta">' + OATS.sub + " · etwa " + OATS.kcal + " kcal, " + OATS.prot + " g Protein</div>" +
        "<ul>" + OATS.ing.map(([id, q]) => "<li>" + esc(ingLine(id, q)) + "</li>").join("") + "</ul>" +
        "<ol>" + OATS.steps.map(s => "<li>" + esc(s) + "</li>").join("") + "</ol></div></details>";
    }
    if (c.days && c.sn) {
      html += '<details class="rec"><summary>' + thumb("snack") + '<b>' + SNACK.name + "</b><span>pro Tag</span></summary>" +
        '<div class="recbody">' + hero("snack", SNACK.name) + '<div class="meta">' + SNACK.sub + " · etwa " + SNACK.kcal + " kcal, " + SNACK.prot + " g Protein</div>" +
        "<ul>" + SNACK.ing.map(([id, q]) => "<li>" + esc(ingLine(id, q)) + "</li>").join("") + "</ul></div></details>";
    }
    $("recipes").innerHTML = html || '<p class="empty">Noch kein Gericht für diesen Kochtag.</p>';
  }

  function renderAll() {
    renderSeg();
    const book = tab === BOOK;
    $("setup").hidden = book; $("listCard").hidden = book;
    $("recTitle").textContent = book ? "Rezepte" : "Rezepte mit diesen Mengen";
    if (!book) { renderSetup(); renderList(); }
    renderRecipes();
  }

  // ---------- Speichern und Sync ----------
  let ref = null, dirty = false, writing = false, again = false, flushTimer = null;
  function setSync(s, text) { $("sync").dataset.s = s; $("syncText").textContent = text; }

  function changed() {
    lsSet(LS_STATE, JSON.stringify(state));
    if (!ref) return;
    dirty = true;
    setSync("busy", "Speichert");
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 350);
  }

  async function flush() {
    if (!ref) return;
    if (writing) { again = true; return; }
    writing = true; dirty = false;
    try {
      await writeOnce(clone(state));
      if (!dirty) setSync("ok", "Synchron");
    } catch (e) {
      setSync("local", e && e.code === "invalid_argument" ? "Nur auf diesem Gerät" : "Offline, später erneut");
      if (e && e.code !== "invalid_argument") dirty = true;
    } finally {
      writing = false;
      if (again || dirty) { again = false; clearTimeout(flushTimer); flushTimer = setTimeout(flush, dirty ? 4000 : 50); }
    }
  }
  async function writeOnce(data) {
    try { await ref.set(data); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); await ref.set(data); }
      else throw e;
    }
  }

  async function connect() {
    const use = window.claude && window.claude.use;
    if (!use) { setSync("local", "Nur auf diesem Gerät"); return; }
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { setSync("local", "Nur auf diesem Gerät"); return; }
    ref = db.doc("mealprep/state");
    let first = true;
    const timer = setTimeout(() => { if (first) setSync("local", "Offline, Stand von diesem Gerät"); }, 10000);
    ref.onSnapshot(snap => {
      if (snap.metadata.fromCache && !snap.exists) return;
      if (!snap.metadata.fromCache) { first = false; clearTimeout(timer); }
      if (!snap.exists) {
        // Noch nichts gespeichert: den Stand dieses Geräts als Start nehmen.
        dirty = true; flush();
        return;
      }
      if (dirty || writing || snap.metadata.hasPendingWrites) return;
      const next = normalize(snap.data());
      if (JSON.stringify(next) !== JSON.stringify(state)) {
        state = next;
        lsSet(LS_STATE, JSON.stringify(state));
        renderAll();
      }
      if (!snap.metadata.fromCache) setSync("ok", "Synchron");
    }, err => {
      clearTimeout(timer);
      ref = null;
      setSync("local", "Nur auf diesem Gerät");
    });
  }

  // ---------- Bedienung ----------
  document.addEventListener("click", ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.tab != null) {
      tab = Number(t.dataset.tab); lsSet(LS_TAB, String(tab)); renderAll();
      return;
    }
    if (t.dataset.rp) {
      const k = t.dataset.rp;
      rp[k] = Math.min(24, Math.max(1, (rp[k] || defaultPortions(k)) + Number(t.dataset.d)));
      renderBook();
      return;
    }
    if (tab === BOOK) return;
    const c = state.cook[tab];
    if (t.id === "minus" && c.days > 0) { c.days--; changed(); renderAll(); return; }
    if (t.id === "plus" && c.days < 10) { c.days++; changed(); renderAll(); return; }
    if (t.dataset.dish) {
      const k = t.dataset.dish;
      c.dishes = c.dishes.includes(k) ? c.dishes.filter(x => x !== k) : DISH_ORDER.filter(x => x === k || c.dishes.includes(x));
      changed(); renderAll(); return;
    }
    if (t.id === "reset") {
      if (!t.classList.contains("armed")) {
        t.classList.add("armed"); t.textContent = "Wirklich alle Haken entfernen? Nochmal tippen";
        setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Alle Haken entfernen"; } }, 4000);
        return;
      }
      const prefix = tab + "-";
      for (const k of Object.keys(state.checked)) if (k.startsWith(prefix)) delete state.checked[k];
      t.classList.remove("armed"); t.textContent = "Alle Haken entfernen";
      changed(); renderList();
    }
  });

  document.addEventListener("change", ev => {
    const el = ev.target;
    const c = state.cook[tab];
    if (el.id === "wd") { c.wd = Number(el.value); changed(); renderAll(); return; }
    if (el.id === "fr" || el.id === "sn") { c[el.id] = el.checked; changed(); renderAll(); return; }
    const row = el.closest(".row");
    if (row) {
      const key = row.dataset.key;
      if (el.checked) state.checked[key] = true; else delete state.checked[key];
      row.classList.toggle("is-done", el.checked);
      changed(); renderProgress();
    }
  });

  renderAll();
  setSync("local", "Nur auf diesem Gerät");
  connect();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
